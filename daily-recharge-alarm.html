<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Recharge Alarm</title>
<style>
:root{--bg:#EEF4F3;--card:#fff;--ink:#14282F;--mute:#52656B;--line:#D5E2E0;--teal:#14A085;--dteal:#0B5E50;--navy:#1F3A5F;--class:#8FB0D9;--work:#F2B84B;--err:#B5B5B5;--night:#1F3A5F;--ring:#0B5E50;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B1F;--card:#162A30;--ink:#E6F0EF;--mute:#9DB3B7;--line:#27424A;--teal:#2BC4A5;--ring:#2BC4A5;--class:#6E92BF;--night:#5D7FB0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1B1F;--card:#162A30;--ink:#E6F0EF;--mute:#9DB3B7;--line:#27424A;--teal:#2BC4A5;--ring:#2BC4A5;--class:#6E92BF;--night:#5D7FB0;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.05rem;margin:0 0 14px;font-weight:700;color:var(--mute)}
.hero{background:var(--dteal);color:#fff;border-radius:22px;padding:22px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:#fff;opacity:.08}
#clock{font-size:3.4rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{opacity:.8;margin-top:4px}
.next{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.next small{opacity:.75;display:block}
#nextLabel{font-size:1.15rem;font-weight:600;margin:2px 0}
#count{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.primary{background:var(--teal);color:#fff}
.primary.on{background:var(--card);color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.days{display:flex;gap:6px;margin-bottom:6px}
.days button{flex:1;padding:9px 0;background:var(--card);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.days button.on{background:var(--navy);color:#fff;box-shadow:none}
#status{color:var(--mute);font-size:.9rem;margin:4px 2px 12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px;border-left:6px solid var(--c)}
li.rest{--c:var(--teal)}li.class{--c:var(--class)}li.work{--c:var(--work)}li.err{--c:var(--err)}li.night{--c:var(--night)}
li.past{opacity:.5}
li.cur{box-shadow:0 0 0 2px var(--teal)}
li.rest .t{font-weight:700}
.t{font-variant-numeric:tabular-nums;min-width:5.6em;font-weight:600}
.l{flex:1}
.l span{display:block;color:var(--mute);font-size:.82rem}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i:after{transform:translateX(18px)}
#ov{position:fixed;inset:0;background:var(--ring);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#ov.show{display:flex}
#ov .big{font-size:2.2rem;font-weight:700;margin:6px 0 4px}
#ov .tm{font-size:1.2rem;opacity:.85;margin-bottom:28px}
#ov button{background:#fff;color:var(--dteal);font-size:1.2rem;padding:16px 44px;border-radius:16px}
.pulse{width:84px;height:84px;border-radius:50%;background:#fff;opacity:.9;animation:p 1s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.18);opacity:.5}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.note{color:var(--mute);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Daily Recharge Alarm</h1>
<section class="hero" aria-live="off">
  <div id="clock">--:--:--</div>
  <div id="date"></div>
  <div class="next"><small>Next alarm</small><div id="nextLabel">Loading…</div><div id="count"></div></div>
</section>
<div class="bar">
  <button class="primary" id="arm">Turn alarms on</button>
  <button class="ghost" id="test">Test sound</button>
  <button class="ghost" id="wake">Keep screen on</button>
</div>
<div class="days" id="days" role="group" aria-label="Alarm days"></div>
<div id="status">Alarms are off. Tap “Turn alarms on” first.</div>
<ul id="list"></ul>
<p class="note">Alarms ring only while this page stays open. On a phone, tap “Keep screen on” and leave the page in front. Switch any row off to skip its alarm.</p>
</main>
<div id="ov" role="alertdialog" aria-live="assertive"><div class="pulse"></div><div class="big" id="ovT"></div><div class="tm" id="ovM"></div><button id="ovB">Dismiss</button></div>
<script>
var S=[
[7,0,"work","Arrive: read, learn, develop"],
[8,0,"rest","Short recharge, 10 min"],
[8,10,"work","Work and print"],
[8,20,"rest","Recharge before class, 10 min"],
[8,30,"class","Class: Math 8"],
[9,30,"rest","Long recharge, 40 min"],
[10,11,"work","Work and print"],
[10,31,"rest","Recharge before class, 14 min"],
[10,45,"class","Class: Math 10"],
[11,45,"err","Principal’s office: log out/in"],
[12,0,"rest","Lunch and recharge, 45 min"],
[12,45,"err","Personal hygiene"],
[12,50,"rest","Recharge before class, 10 min"],
[13,0,"class","Class: Math 8"],
[14,0,"rest","Longest recharge, 60 min"],
[15,0,"work","Work and print"],
[15,10,"rest","Quick recharge, 5 min"],
[15,15,"class","Class: Gen Math 11"],
[16,16,"err","Organize files"],
[16,21,"rest","Recharge, then go home"],
[20,0,"night","Shutdown: write tomorrow’s top 3"],
[20,30,"night","Wind-down: no screens"],
[21,30,"night","Bedtime"]
];
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var off={},days={1:1,2:1,3:1,4:1,5:1},armed=false,fired={},ac=null,lock=null,ringTimer=null;
try{off=JSON.parse(localStorage.getItem("dra-off")||"{}");var d=localStorage.getItem("dra-days");if(d)days=JSON.parse(d)}catch(e){}
function save(){try{localStorage.setItem("dra-off",JSON.stringify(off));localStorage.setItem("dra-days",JSON.stringify(days))}catch(e){}}
function fmt(h,m){var a=h>=12?"PM":"AM",x=h%12||12;return x+":"+(m<10?"0":"")+m+" "+a}
function $(i){return document.getElementById(i)}
function p2(n){return n<10?"0"+n:""+n}

var list=$("list");
S.forEach(function(s,i){
  var li=document.createElement("li");li.className=s[2];li.id="r"+i;
  li.innerHTML='<div class="t">'+fmt(s[0],s[1])+'</div><div class="l">'+s[3]+'</div><label class="sw"><input type="checkbox" aria-label="Alarm at '+fmt(s[0],s[1])+'"><i></i></label>';
  var cb=li.querySelector("input");cb.checked=!off[i];
  cb.onchange=function(){if(cb.checked)delete off[i];else off[i]=1;save()};
  list.appendChild(li);
});
var dEl=$("days");
[1,2,3,4,5,6,0].forEach(function(n){
  var b=document.createElement("button");b.textContent=DN[n];b.className=days[n]?"on":"";b.setAttribute("aria-pressed",!!days[n]);
  b.onclick=function(){if(days[n])delete days[n];else days[n]=1;b.className=days[n]?"on":"";b.setAttribute("aria-pressed",!!days[n]);save()};
  dEl.appendChild(b);
});

function tone(f,t,d,type,v){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime+t);g.gain.linearRampToValueAtTime(v||.3,ac.currentTime+t+.02);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);
  o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.05);
}
var PAT={
 rest:[[523,0],[659,.28],[784,.56],[1047,.84]],
 class:[[880,0],[880,.35],[880,.7]],
 work:[[660,0],[660,.3]],
 err:[[587,0],[587,.3]],
 night:[[392,0],[330,.4],[262,.8]]
};
function play(kind){
  if(!ac)return;
  var p=PAT[kind]||PAT.work;
  p.forEach(function(n){tone(n[0],n[1],.5,kind==="class"?"triangle":"sine",.35)});
}
function ring(i){
  var s=S[i];
  $("ovT").textContent=s[3];$("ovM").textContent=fmt(s[0],s[1]);$("ov").className="show";
  clearInterval(ringTimer);var n=0;
  function go(){play(s[2]);if(navigator.vibrate)navigator.vibrate([300,150,300]);if(++n>=8)clearInterval(ringTimer)}
  go();ringTimer=setInterval(go,3000);
  try{if(window.Notification&&Notification.permission==="granted")new Notification(s[3],{body:fmt(s[0],s[1]),tag:"dra"})}catch(e){}
}
$("ovB").onclick=function(){clearInterval(ringTimer);$("ov").className=""};

function setStatus(){
  $("arm").textContent=armed?"Alarms are on":"Turn alarms on";
  $("arm").className="primary"+(armed?" on":"");
  $("status").textContent=armed?"Alarms are on. Keep this page open.":"Alarms are off. Tap “Turn alarms on” first.";
}
$("arm").onclick=function(){
  if(armed){armed=false;setStatus();return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){$("status").textContent="This browser cannot play sound.";return}
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  armed=true;setStatus();play("rest");
};
$("test").onclick=function(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  play("rest");setTimeout(function(){play("class")},1400);
};
$("wake").onclick=async function(){
  try{
    if(lock){await lock.release();lock=null;$("wake").textContent="Keep screen on";return}
    lock=await navigator.wakeLock.request("screen");$("wake").textContent="Screen stays on";
    lock.addEventListener("release",function(){lock=null;$("wake").textContent="Keep screen on"});
  }catch(e){$("wake").textContent="Not supported here"}
};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&lock===null&&$("wake").textContent==="Screen stays on")$("wake").click()});

function tick(){
  var n=new Date(),sec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),dow=n.getDay(),on=!!days[dow];
  $("clock").textContent=p2(n.getHours()%12||12)+":"+p2(n.getMinutes())+":"+p2(n.getSeconds())+" "+(n.getHours()>=12?"PM":"AM");
  $("date").textContent=n.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  var cur=-1;
  S.forEach(function(s,i){
    var t=s[0]*3600+s[1]*60,li=$("r"+i);
    if(on&&t<=sec)cur=i;
    li.classList.toggle("past",on&&t<=sec);
    if(armed&&on&&!off[i]){
      var k=n.toDateString()+i;
      if(!fired[k]&&sec>=t&&sec-t<90){fired[k]=1;ring(i)}
    }
  });
  S.forEach(function(s,i){$("r"+i).classList.toggle("cur",i===cur)});
  var found=null;
  for(var d=0;d<8&&!found;d++){
    var dt=new Date(n.getFullYear(),n.getMonth(),n.getDate()+d);
    if(!days[dt.getDay()])continue;
    for(var i=0;i<S.length;i++){
      if(off[i])continue;
      var at=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),S[i][0],S[i][1],0);
      if(at>n){found={i:i,at:at};break}
    }
  }
  if(!found){$("nextLabel").textContent="No alarms set";$("count").textContent="Choose a day and switch rows on";return}
  var diff=Math.round((found.at-n)/1000),h=Math.floor(diff/3600),m=Math.floor(diff%3600/60),s2=diff%60;
  var s=S[found.i];
  $("nextLabel").textContent=fmt(s[0],s[1])+"  "+s[3];
  $("count").textContent="in "+(h?h+" h ":"")+(h||m?m+" min ":"")+s2+" s";
}
setStatus();tick();setInterval(tick,1000);
</script>
</body>
</html>
