<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 5 of 7 | Bourbon Dynasty</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#0e0a06;--bg-mid:#1a120a;--bg-end:#0c0804;--accent:#c49a6c;--accent2:#e8d0b0;--accent-glow:rgba(196,154,108,0.30);--card-bg:rgba(26,18,10,0.85);--text-primary:#e8d0b0;--text-secondary:#8a7460;--border-glow:rgba(196,154,108,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(196,154,108,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:1080px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(196,154,108,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(196,154,108,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(196,154,108,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(196,154,108,0.4);background:rgba(196,154,108,0.30);box-shadow:0 0 20px rgba(196,154,108,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(196,154,108,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(196,154,108,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#000;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(196,154,108,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(196,154,108,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#000}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(196,154,108,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:1080px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(196,154,108,0.4);background:rgba(196,154,108,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#000;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

{q:"If the school will be used as an evacuation center for more than fifteen (15) days, what should the Local Government Unit provide for DepEd and the Department of Interior and Local Government (DILG)?\n\nI. The name and location of the school\nII. The number of available rooms\nIII. All alternative evacuation centers and transitional relocation sites.\nIV. Measures are being implemented to prevent interference or disruption to children\u2019s school and educational activities.\nV. List of evacuees with address and contact details.",
c:[{t:"I and II",x:0},{t:"II and V",x:0},{t:"I, II and III",x:0},{t:"I, III and IV",x:1}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"When a school is used as an evacuation center for more than 15 days, the LGU must provide: (I) The name and location of the school, (III) All alternative evacuation centers and transitional relocation sites, and (IV) Measures to prevent disruption to children\u2019s educational activities. These ensure DepEd can plan for learning continuity.",
wr:[{l:"A",r:"While the name and location (I) is needed, the number of rooms (II) is an operational detail, not a required provision under the guidelines."},{l:"B",r:"The number of rooms (II) and list of evacuees (V) are operational logistics, not the specific requirements the LGU must provide to DepEd and DILG."},{l:"C",r:"While I and III are correct, the number of rooms (II) is not specifically required. Measures to prevent educational disruption (IV) is the missing critical element."}]}},

{q:"Cited below is the performance of Grade 6 learners in School ABC in English, Science, and Math for three consecutive school years. What action must the school head undertake after?",img:"IMG82",
c:[{t:"The performance level in English, Science, and Mathematics of School ABC is increasing from S.Y. 2018 \u2013 2019 to 2020 \u2013 2021; hence, enrichment activities should be put into consideration.",x:1},{t:"School year 2018 \u2013 2019 has the lowest performance among the three, and immediate intervention should be done.",x:0},{t:"Science has the most stable MPS from S.Y. 2018 \u2013 2019 to 2020 \u2013 2021; thus, no intervention is needed.",x:0},{t:"There is a need to conduct a reading intervention program in English since it has the lowest MPS for three consecutive years.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"The bar chart shows that performance in all three subjects (English, Science, Mathematics) is consistently increasing across the three school years. Since performance is improving, the appropriate next step is enrichment activities to sustain and further enhance the upward trend, rather than intervention programs.",
wr:[{l:"B",r:"While 2018-2019 has the lowest scores, the question asks what action to take AFTER reviewing the data. The upward trend is the key finding, not the starting point."},{l:"C",r:"Saying \u201Cno intervention is needed\u201D for Science ignores the principle that all subjects benefit from continuous improvement, even when performance is stable or improving."},{l:"D",r:"English does NOT have the lowest MPS for three consecutive years. Looking at the chart, English (green bars) shows improvement and is not consistently the lowest subject."}]}},

{q:"School K, a small and non-implementing unit, must conduct a school-level search for Best in Teaching Modalities. This is in compliance with a division memorandum requiring the conduct of the activity even though it is not included in the approved School\u2019s Work and Financial Plan. It requires the immediate purchase of goods amounting to \u20b110,000.00.\n\nWhat action should School K\u2019s school head do to get the activity done?\n\nI. Request approval of authority to conduct the activity\nII. Issue a purchase order to the supplier with the lowest price quotation\nIII. Prepare supplemental work and financial plan of the activity\nIV. Conduct inspection procedure upon delivery and acceptance of goods\nV. Obtain at least three price quotations from at least three suppliers of known qualifications",
c:[{t:"I-III-V-II-IV",x:1},{t:"III-I-V-II-IV",x:0},{t:"IV-V-I-II-III",x:0},{t:"III-V-I-II-IV",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"The correct sequence is: (I) Request approval of authority first, (III) Prepare supplemental work and financial plan, (V) Obtain three price quotations, (II) Issue purchase order to lowest bidder, (IV) Conduct inspection upon delivery. This follows proper procurement procedures: authorization \u2192 budgeting \u2192 canvassing \u2192 purchasing \u2192 inspection.",
wr:[{l:"B",r:"Preparing the supplemental plan (III) before requesting authority (I) reverses the proper sequence. Authority must be obtained before any planning or spending."},{l:"C",r:"Starting with inspection (IV) is illogical \u2014 inspection happens at the end after goods are delivered, not at the beginning."},{l:"D",r:"While III and V are in the right relative order, requesting authority (I) must come before preparing the supplemental plan (III)."}]}},

{q:"Adherence to the provisions of DepEd Order No. 40, s. 2012 or Child Protection Policy is required of all schools. If there are bullying incidents in school, the school head can best execute positive and non-violent discipline by taking which of the following actions?",
c:[{t:"Implement orientation sessions exclusive to parents and children.",x:0},{t:"Strengthen the imposition of corporal punishment to address the misbehavior of children.",x:0},{t:"Integrate education sessions on corporal punishment and positive discipline in the initiatives of the Parents-Teachers Association.",x:1},{t:"Building the capacity of school administrators and teachers only that will focus on children\u2019s rights and development.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.3 Inclusive practice",
e:{w:"Integrating education sessions on corporal punishment and positive discipline into PTA initiatives involves parents as partners in implementing non-violent discipline. This approach educates both school and home environments, creating a consistent framework for positive discipline that aligns with the Child Protection Policy.",
wr:[{l:"A",r:"Exclusive sessions limit participation. The PTA approach is more inclusive and reaches a broader audience of stakeholders."},{l:"B",r:"Strengthening corporal punishment directly violates DepEd Order No. 40, s. 2012, which prohibits corporal punishment and promotes positive discipline."},{l:"D",r:"Limiting capacity building to administrators and teachers only excludes parents, who are critical partners in implementing positive discipline both at school and at home."}]}},

{q:"The use of Information and Communication Technology (ICT) in managing school data and information increases the level of efficiency in the service. Which of the following situations reflect the effective use of ICT in the school setting?\n\nI. Checking learner\u2019s previous enrolment data in the Learners Information System (LIS)\nII. Employing social media platforms to inform the parents, the school, and the community about the academic standing of each learner publicly.\nIII. Signing school documents using the digital signature facility from Philippine National Public Key Infrastructure (PNPKI)\nIV. Using the school\u2019s key performance indicators generated from the EBEIS Portal\nV. Utilizing DepEd email account in sending SF10 and other transfer credentials",
c:[{t:"I, II and III",x:0},{t:"II, IV and V",x:0},{t:"I, III, IV",x:1},{t:"II and V",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.5 Management of school information",
e:{w:"Effective ICT use in schools includes: (I) Using LIS for enrollment data verification, (III) Using PNPKI digital signatures for document authentication, and (IV) Using EBEIS Portal for school KPI data. These reflect proper, secure, and efficient use of official DepEd ICT systems.",
wr:[{l:"A",r:"Publicly sharing academic standing on social media (II) violates data privacy laws and is not an effective or appropriate use of ICT."},{l:"B",r:"Social media disclosure of academic standing (II) is inappropriate. While V (DepEd email for SF10) is acceptable, combining it with II makes this set incorrect."},{l:"D",r:"Both items include social media disclosure (II) which violates data privacy, making this combination inappropriate."}]}},

{q:"During the First Quarter of SY 2021-2022, a teacher seeks advice on how to address the problem of Learner A, whose performance is shown as follows:",img:"IMG86",
c:[{t:"Have a teleconference with the Math and Science teachers so that they can see the difference in Learner A\u2019s grade in their subjects with the others.",x:0},{t:"Collaborate with the Mathematics and Science Teacher to conduct brainstorming activities and agree on possible interventions.",x:0},{t:"Conduct home visitation immediately so that the parents will be involved in identifying the factors of Learner A\u2019s performance in Math and Science.",x:1},{t:"Get feedback from Learner A by conducting an online interview and submitting a report to the school head for possible action.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"The grades table shows Learner A performing well in most subjects (85-98) but significantly lower in Mathematics (74) and Science (73). Conducting home visitation involves parents in identifying the root causes of the performance gap. Parent involvement is critical because factors affecting Math and Science performance may be home-related (study habits, resources, support).",
wr:[{l:"A",r:"Having a teleconference to show grade differences is informational but does not address the root causes of Learner A\u2019s performance gap."},{l:"B",r:"Collaboration and brainstorming among teachers is helpful but addresses only the school side. Parent involvement is needed to understand the full picture of factors affecting performance."},{l:"D",r:"Getting feedback from the learner through an online interview is indirect and formal. Home visitation provides a more comprehensive understanding of the learner\u2019s situation."}]}},

{q:"Enrollment Trends \u2014 School Z Enrollment:\nSY 2019-2020: 1,200 | SY 2020-2021: 1,050 | SY 2021-2022: 980 | SY 2022-2023: 870\n\nWhat is the best school head response?\n\nI. Investigate causes of declining enrollment.\nII. Strengthen community advocacy.\nIII. Request school closure due to low numbers.\nIV. Launch programs to retain learners.\nV. Coordinate with LGU for population and migration data.\nVI. Allow natural decline since DepEd has no enrollment targets.",
c:[{t:"I, II, IV, V",x:1},{t:"II, III, VI",x:0},{t:"I and III only",x:0},{t:"I, II only",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"A comprehensive response to declining enrollment includes: (I) Investigating root causes through data analysis, (II) Strengthening community advocacy to promote school enrollment, (IV) Launching retention programs to prevent further decline, and (V) Coordinating with LGU for demographic data to understand migration patterns. This multi-pronged approach addresses the problem from multiple angles.",
wr:[{l:"B",r:"Requesting school closure (III) and allowing natural decline (VI) are defeatist responses that contradict the school head\u2019s mandate to ensure access to education."},{l:"C",r:"Investigation (I) alone is insufficient, and requesting closure (III) is premature and inappropriate without exhausting improvement efforts."},{l:"D",r:"While I and II are correct, this combination is incomplete. Retaining learners (IV) and obtaining demographic data (V) are also essential components of the response."}]}},

{q:"The newly installed school head found out that there are three teachers who do not exhibit high performance in carrying out their duties and functions because they will be retiring soon. How should the school head act on the matter?",
c:[{t:"Initiate a heart-to-heart talk with the teachers and encourage them to carry out their duties as expected until they retire from the service.",x:0},{t:"Reprimand the teachers for performing below expectations.",x:0},{t:"Send the teachers to capability-building activity that focuses on refreshing the commitment of teachers to quality service.",x:1},{t:"Encourage the retiring teachers to file for early retirement to give the young generation of teachers a chance.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"Sending the teachers to capability-building focused on refreshing commitment addresses the root issue \u2014 declining motivation and engagement as retirement approaches. This is a professional development approach that respects the teachers\u2019 dignity while reinvigorating their sense of purpose and quality service.",
wr:[{l:"A",r:"A heart-to-heart talk is personal but may not produce lasting change. A structured capability-building activity provides systematic support for renewed commitment."},{l:"B",r:"Reprimanding retiring teachers is punitive and counterproductive. It damages morale without addressing the underlying issue of declining motivation."},{l:"D",r:"Encouraging early retirement is dismissive of the teachers\u2019 remaining contributions and does not address the performance issue. Teachers should be supported to perform well until their actual retirement date."}]}},

{q:"The Division property disposal team will visit a school to inspect the reported school property for disposal. Which of the following needs to be performed by the school disposal team before the scheduled division inspection?\n\nI. Determine if the property is economically repairable or subject to disposal.\nII. Validate if the item for disposal is listed in the property inventory.\nIII. Determine the current market value of the property.\nIV. Check the depreciated value of the property based on DepEd issuance.\nV. Prepare a list of accredited bidders.\nVI. Convene the Bids and Awards Committee to discuss the bidding procedure.",
c:[{t:"I, III, V",x:0},{t:"II, III, VI",x:0},{t:"I, II, IV",x:1},{t:"III, V, VI",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"Before the division inspection, the school disposal team must: (I) Determine if the property is repairable or truly for disposal, (II) Validate that the item is listed in the property inventory, and (IV) Check the depreciated value per DepEd issuance. These are the school-level preparatory steps.",
wr:[{l:"A",r:"Determining current market value (III) and preparing bidder lists (V) are division-level functions, not school-level preparatory steps."},{l:"B",r:"Market value determination (III) and BAC convening (VI) are post-inspection activities handled at the division level."},{l:"D",r:"Market value (III), bidder lists (V), and BAC procedures (VI) are all beyond the school disposal team\u2019s preparatory responsibilities."}]}},

{q:"Which of the following activities suggests that a teacher is conducting an assessment for learning?\n\nI. Administering a diagnostic test\nII. Guiding students in setting goals and monitoring their progress\nIII. Judging students\u2019 performance in relation to MELCs\nIV. Using conversation, learning logs, and observation\nV. Comparing performance against overall curricular expectations\nVI. Requiring students to submit learning portfolio",
c:[{t:"I, II, IV",x:1},{t:"III, V, VI",x:0},{t:"I, III, VI",x:0},{t:"I, II, V",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"Assessment FOR learning (formative) includes: (I) Diagnostic tests to identify starting points, (II) Guiding goal-setting and progress monitoring for self-regulated learning, and (IV) Using varied formative tools like conversation, learning logs, and observation. These activities support ongoing learning improvement.",
wr:[{l:"B",r:"Judging performance against MELCs (III), comparing against curricular expectations (V), and requiring portfolios (VI) are assessment OF learning (summative) activities."},{l:"C",r:"Judging performance (III) and requiring portfolios (VI) are summative assessment activities, not formative assessment for learning."},{l:"D",r:"Comparing performance against overall curricular expectations (V) is a summative measure, not an assessment for learning strategy."}]}},

{q:"A teacher, who is a newly-designated Student Supreme Government (SSG) adviser, is worried about the challenges posed by the pandemic in the conduct of student government elections. Which of the following should the school head do to help the teacher?",
c:[{t:"Discuss the SSG Adviser\u2019s role in supervising the conduct of the election.",x:0},{t:"Mentor teachers on applying the SSG Standard Election Code guidelines consistent with the revised SSG Constitution and By-Laws.",x:1},{t:"Give assurance that following the guidelines will lead to the fair and successful conduct of the elections.",x:0},{t:"Reduce the teaching load and consider SSG Advisership as one load.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"The concern is about how to properly conduct SSG elections during a challenging situation. Effective school leadership requires capacity building and mentoring of teachers. Mentoring on applying the SSG Standard Election Code guidelines integrates guidance, policy application, and professional development, aligning with higher-order relational thinking.",
wr:[{l:"A",r:"Discussing the role is informational but does not equip the teacher with the practical skills needed to conduct elections during the pandemic."},{l:"C",r:"Giving assurance is supportive but does not provide the specific guidance and capacity building the teacher needs."},{l:"D",r:"Reducing teaching load addresses workload but does not address the teacher\u2019s lack of knowledge about election procedures during the pandemic."}]}},

{q:"The school head, together with the team, is designing the class program for the opening of classes of the current school year. Which of the following actions of the school head is appropriate in accordance with DepEd Memorandum No. 291 s. 2008? Assign six (6) teaching loads of one hour per load to fully utilize the six-hour teaching load...",
c:[{t:"with due regard for possible intervals and two-hour teaching-related activities within or outside the school premises to complete the eight hours daily service requirements.",x:1},{t:"regardless of class intervals and two hours of teaching-related activities within or outside the school premises, complete the eight-hour daily service requirements.",x:0},{t:"in consecutive timeslots and two hours of teaching-related activities outside to complete the eight hours daily service requirements.",x:0},{t:"with 2 hours interval per class to be used for teaching-related activities to complete the eight hours service requirement for the day.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"DepEd Memorandum No. 291, s. 2008 stipulates that teachers with six teaching loads should have due regard for possible intervals between classes, and the remaining two hours of teaching-related activities may be rendered within or outside the school premises. This ensures both instructional quality and compliance with the eight-hour service requirement.",
wr:[{l:"B",r:"\u201CRegardless of class intervals\u201D ignores the policy requirement to consider possible intervals. Consecutive, uninterrupted teaching without breaks is not mandated."},{l:"C",r:"Requiring consecutive timeslots and outside-only activities is too restrictive. The policy allows flexibility in scheduling and location of the two-hour activities."},{l:"D",r:"A 2-hour interval per class is excessive and impractical. The policy calls for reasonable intervals, not extended gaps between each teaching period."}]}},

{q:"A Parent-Teachers Association (PTA) member wrote a letter addressed to the school head\u2019s office clarifying the guidelines of the association. The concern was to inquire if the homeroom president is allowed to run in any elective position in the General Parents-Teachers Association if he/she is a 2nd-degree relative and has custody over a learner. What is the most appropriate content of the response letter?",
c:[{t:"The Homeroom PTA president is qualified since they are relatives.",x:0},{t:"There is a need to verify the Homeroom PTA officer\u2019s relationship with the enrolled learner.",x:1},{t:"The PTA officer is not qualified because only biological parents are allowed to become members of the PTA.",x:0},{t:"There is a need to present proof that the Homeroom PTA president is a court-appropriated legal guardian of the learner.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.2 Management of school organizations",
e:{w:"The most appropriate response is to verify the relationship between the PTA officer and the enrolled learner. This ensures compliance with PTA guidelines while being fair and thorough. Verification is needed because PTA membership requires a documented relationship with an enrolled learner, not just a claim of relativity.",
wr:[{l:"A",r:"Simply stating the person is qualified because they are relatives is insufficient. The specific relationship and custody arrangement must be verified."},{l:"C",r:"PTA membership is not limited to biological parents. Guardians, relatives with custody, and other authorized caregivers are also eligible."},{l:"D",r:"Requiring court-appointed legal guardianship is too restrictive. DepEd guidelines recognize various forms of authorized custody, not just court orders."}]}},

{q:"A former colleague invited a newly promoted school head to benchmark the school\u2019s best practices in another country. During the preparation of the needed documents, the school head was informed by the Division Administrative Officer that the superintendent would not sign the travel order unless the official business was changed to the official time; however, the school head saw the invitation as an excellent opportunity to compare their school\u2019s best practices with that of another country\u2019s. How will the school head respond to the situation?",
c:[{t:"Continue with the benchmarking plan and seek sponsorship or request the Local Government Unit (LGU) to cover the expenses.",x:0},{t:"Write a Letter of Appeal to the Superintendent for reconsideration.",x:0},{t:"Utilize the canteen fund earmarked for faculty and student development funds.",x:0},{t:"Cancel the plan and arrange with the former colleague to reschedule the visit until resources are in place.",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.3 Professional networks",
e:{w:"The scenario involves ethical decision-making, compliance with administrative procedures, and responsible use of resources. Canceling the plan and rescheduling until resources are properly in place demonstrates integrity, fiscal responsibility, and adherence to proper authorization processes. The school head should not circumvent administrative requirements.",
wr:[{l:"A",r:"Seeking LGU sponsorship may create obligations and does not address the authorization issue with the superintendent."},{l:"B",r:"Appealing to the superintendent is adversarial and may not resolve the fundamental issue of proper authorization and funding."},{l:"C",r:"Using canteen funds for international travel would be a misuse of school funds and violate financial management guidelines."}]}},

{q:"An experienced private school teacher has recently been hired in a public school. The school head saw the need for the teacher to be involved in professional learning communities in the context of DepEd. Which of the following professional development activities can the school head use to deliver the task?\n\nI. Teacher Induction Program\nII. Learning Delivery Modalities I\nIII. School Heads Development Program\nIV. Learning Action Cell\nV. In-service Training\nVI. Learning Delivery Modalities",
c:[{t:"III, IV, V, and VI",x:0},{t:"I, II, and IV only",x:0},{t:"II, III, IV, and V",x:0},{t:"I, IV, V, and VI",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"For a newly-hired teacher transitioning from private to public school: (I) Teacher Induction Program \u2014 mandatory for new DepEd teachers; (IV) Learning Action Cell \u2014 school-based professional learning community; (V) In-service Training \u2014 ongoing professional development; (VI) Learning Delivery Modalities \u2014 training on DepEd\u2019s delivery approaches.",
wr:[{l:"A",r:"School Heads Development Program (III) is for school leaders, not for teachers. This would not be appropriate for the newly-hired teacher."},{l:"B",r:"While I, II, and IV are relevant, this set is incomplete \u2014 it excludes In-service Training (V) and the broader Learning Delivery Modalities (VI)."},{l:"C",r:"School Heads Development Program (III) is not applicable to a teacher. This option incorrectly includes a leadership program while excluding TIP (I)."}]}},

{q:"A school head was reassigned to a new school and found out it is low-performing based on its key performance indicator. The school only offers a regular curriculum despite the diversity of learner population composed of Muslims, indigenous peoples, out-of-school learners, and children in different circumstances.\n\nThe school head can best avoid early missteps by taking which of the following actions first?",
c:[{t:"Provide feeding activities and temporary learning shelters as part of the child care program.",x:0},{t:"Assess the learning needs of the children before offering inclusive education.",x:1},{t:"Capacitate the teachers on how to conduct assessment of learning.",x:0},{t:"Arrange a competition for the best bulletin board and best classroom structuring on cultural sensitivity.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"Before implementing any intervention for diverse learner populations, the school head must first assess their learning needs. This ensures that subsequent programs are responsive and appropriate. Assessment before action prevents missteps such as providing programs that don\u2019t match the learners\u2019 actual needs.",
wr:[{l:"A",r:"Providing feeding and shelters addresses welfare needs but does not address the educational needs of diverse learners. Assessment must come first."},{l:"C",r:"Capacitating teachers on assessment is important but premature. The school head must first understand the learners\u2019 needs before designing teacher training."},{l:"D",r:"Bulletin board competitions on cultural sensitivity are superficial and do not address the fundamental need to understand and serve the diverse learner population."}]}},

{q:"Result of LISTAHAN from the Department of Social Welfare and Development for School Year 2020 shows that 60 out of 1000 of the population are out of school. Listahan is an information management system that identifies who and where the poor are nationwide. Utilizing the result, what can the school head do?",
c:[{t:"Identify reasons behind the learners\u2019 needs and problems.",x:0},{t:"Select student leaders to represent learners\u2019 voices.",x:0},{t:"Provide a safe environment for open discussion.",x:0},{t:"Identify real needs, issues, and concerns of learners in the school.",x:1}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The LISTAHAN data identifies out-of-school populations and their socioeconomic conditions. Using this data, the school head can identify the real needs, issues, and concerns of learners \u2014 both those enrolled and those not yet in school. This data-driven approach ensures targeted interventions for the most vulnerable populations.",
wr:[{l:"A",r:"Identifying reasons behind needs is part of the process but is a secondary step. First, the school head must identify what the actual needs, issues, and concerns are using the LISTAHAN data."},{l:"B",r:"Selecting student leaders addresses governance but does not directly utilize the LISTAHAN data to address out-of-school populations."},{l:"C",r:"Providing a safe environment for discussion is important but does not directly leverage the LISTAHAN data to identify and address learner needs."}]}},

{q:"What action is expected from a school head to ensure that all graduates for school year 2021-2022 are accounted for including their chosen curriculum exit?",
c:[{t:"The school head shall inform the Career Guidance Counselor to facilitate the needed documents.",x:0},{t:"The school head shall coordinate with the advisers to list the chosen curriculum exit of the learners.",x:0},{t:"The school head shall open the link for Curriculum Exit Trading System two weeks before the school year ends and shall close it after a month.",x:1},{t:"The school head shall conduct a Career Guidance Program Orientation to gather the learners\u2019 chosen tracks.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.5 Management of school information",
e:{w:"The school head must open the Curriculum Exit Trading System link two weeks before the school year ends and close it after a month. This is the official DepEd mechanism for tracking and accounting for all graduates and their chosen curriculum exits, ensuring complete and timely data capture.",
wr:[{l:"A",r:"Informing the Career Guidance Counselor is a delegation step but does not directly ensure systematic accounting of all graduates."},{l:"B",r:"Coordinating with advisers for a list is manual and may miss data. The official system (Curriculum Exit Trading System) provides a more comprehensive and accurate approach."},{l:"D",r:"Career Guidance Orientation gathers information but does not systematically account for graduates through the official tracking system."}]}},

{q:"After the conduct of Phil-IRI, the school head convened the Grade 3 teachers to discuss the possible ways to level up the performance of learners in reading, especially in English. She also reiterated the importance of addressing this issue with regard to the performance of the school. With this effort, what domain in the PPSSH does he/she apply?",
c:[{t:"Leading Strategically",x:0},{t:"Focusing on Teaching and Learning",x:1},{t:"Developing Self and Others",x:0},{t:"Managing School Operation",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"The school head\u2019s action \u2014 convening teachers to discuss reading performance and instructional strategies \u2014 falls directly under Focusing on Teaching and Learning. This domain covers curriculum implementation, instructional improvement, and addressing learner performance through pedagogical interventions.",
wr:[{l:"A",r:"Leading Strategically involves vision-setting and strategic planning, not the direct focus on instructional improvement and reading performance."},{l:"C",r:"Developing Self and Others focuses on professional growth and mentoring. While the meeting develops teachers, the primary purpose is improving learner reading performance."},{l:"D",r:"Managing School Operations involves administrative functions, not the instructional improvement focus demonstrated in the scenario."}]}},

{q:"What school-initiated programs should be prioritized by the school head based on the select key performance indicators of School A, as reflected in the table below?",img:"IMG100",
c:[{t:"Drop-out reduction program shall be intensified among Grades 7 and 10 learners and prioritize remediation classes for Grade 10 learners.",x:0},{t:"Remediation activities shall be enhanced among Grades 8, 9, and 10 learners with enhanced dropout reduction activities for Grade 7.",x:0},{t:"Drop-out reduction program shall be prioritized among Grades 9 and 10 learners with a strengthened remediation program for Grades 7 and 9 learners.",x:1},{t:"The school should intensify its child mapping activities to increase enrolment by at least five percent.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The table shows: Grades 9 and 10 have the highest dropout rates (10% and 22% respectively), so dropout reduction should be prioritized there. Grades 7 and 9 have the highest retention/non-promotion rates (20% and 29%), so remediation programs should be strengthened for those grade levels. This data-driven prioritization addresses the most critical performance gaps.",
wr:[{l:"A",r:"Grade 7 has 0% dropout, so intensifying dropout reduction there is not data-driven. Grade 10 needs dropout reduction more than remediation."},{l:"B",r:"This combination does not accurately target the grade levels with the worst indicators. Grade 7 has no dropouts, and the remediation needs are in Grades 7 and 9 (highest retention rates)."},{l:"D",r:"Child mapping for enrollment increase does not address the critical issues of dropout and retention shown in the data. The immediate priorities are retention and dropout reduction."}]}}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml='';
if(q.img==='IMG82') imgHtml='<img class="q-img" src="'+IMG82+'" alt="Data Table">';
if(q.img==='IMG86') imgHtml='<img class="q-img" src="'+IMG86+'" alt="Data Table">';
if(q.img==='IMG100') imgHtml='<img class="q-img" src="'+IMG100+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}
var r=document.getElementById('resultsArea');

function restart(){cur=0;cor=0;wrn=0;ans=false;document.getElementById('pCor').textContent=0;document.getElementById('pWrn').textContent=0;document.getElementById('pPct').textContent=0;document.getElementById('pFill').style.width='0%';var r=document.getElementById('resultsArea');r.classList.remove('show');r.innerHTML='';document.getElementById('quizArea').classList.remove('hidden');render();}
function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(196,154,108,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
