<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 4 of 7 | Aurum Prestige</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#100800;--bg-mid:#1a1000;--bg-end:#0e0900;--accent:#e8a020;--accent2:#f0bc50;--accent-glow:rgba(232,160,32,0.30);--card-bg:rgba(16,8,0,0.85);--text-primary:#fff8e8;--text-secondary:#907040;--border-glow:rgba(232,160,32,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(232,160,32,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:1080px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(232,160,32,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(232,160,32,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(232,160,32,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(232,160,32,0.4);background:rgba(232,160,32,0.30);box-shadow:0 0 20px rgba(232,160,32,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(232,160,32,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(232,160,32,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#000;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(232,160,32,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(232,160,32,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#000}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(232,160,32,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:1080px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(232,160,32,0.4);background:rgba(232,160,32,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#000;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

{q:"The Division Office recommends a school to become a SPED center to address the needs of children with disabilities in the municipality where it is located. The school head went to various SPED centers for benchmarking. The statements below are his takeaways. What is the best takeaway for the school head in establishing the said SPED center and advocating inclusive education?",
c:[{t:"Teachers have high expectations from every learner to promote intellectual engagement and self-awareness in learning.",x:0},{t:"Learners have participation and representation in the school organization, in curricular and co-curricular activities, and program planning, development, and implementation.",x:0},{t:"The global thrust of inclusive education is included in the School Improvement Plan and is properly coordinated with the Education Program Supervisor in charge of SPED.",x:1},{t:"The school encourages learners to have access to and participate in learning centers and other places of learning.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.3 Inclusive practice",
e:{w:"The global thrust of inclusive education should be included in the SIP and properly coordinated with the EPS in charge of SPED. It ensures planning, coordination, and alignment with DepEd policies, which is essential for establishing a SPED center.",
wr:[{l:"A",r:"High expectations for learners is a good practice but does not address the institutional and policy requirements for establishing a SPED center."},{l:"B",r:"Learner participation is important but is an outcome of good inclusive practice, not the foundational step for establishing a SPED center."},{l:"D",r:"Encouraging access to learning centers is operational but does not address the strategic planning and coordination needed to establish a SPED center."}]}},

{q:"The school head, as the central leadership figure, must have the competencies to lead in developing and implementing school plans. Who among the following school heads can really adapt to the current public health emergency and can respond quickly, especially to unprecedented changes?",
c:[{t:"Mr. A, whose crisis management skills are strongly evident.",x:1},{t:"Mr. B whose knowledge of all DepEd policies is extensive.",x:0},{t:"Ms. C whose vision and goals for the school are clearly stated.",x:0},{t:"Ms. D, whose instructional leadership skills are outstanding.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The scenario emphasizes adaptability during a public health emergency and the ability to respond quickly to unprecedented changes. Crisis management skills are the most relevant competency for navigating emergencies, making quick decisions under pressure, and adapting school operations to rapidly changing conditions.",
wr:[{l:"B",r:"Extensive policy knowledge is valuable but does not guarantee the ability to adapt quickly to unprecedented situations that may not be covered by existing policies."},{l:"C",r:"Having a clear vision is important for long-term leadership but does not directly address the need for rapid response during a crisis."},{l:"D",r:"Outstanding instructional leadership skills are crucial for teaching and learning but are not the primary competency needed during a public health emergency."}]}},

{q:"A school head instructed his/her teachers to submit project proposals to be implemented starting next school year. Ten proposals were submitted, and he/she found out that most of the proposals submitted were not aligned with the Department of Education (DepEd) vision and mission. As a school head, what is the most appropriate action to take?",
c:[{t:"Request technical assistance from the Schools Division Office.",x:0},{t:"Hold in-service training highlighting the discussion of the DepEd\u2019s vision and mission.",x:0},{t:"Instruct master teachers to provide technical assistance through Learning Action Cell.",x:0},{t:"Conduct vision sharing through reflective activities with the proponents.",x:1}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.1 Vision, mission and core values",
e:{w:"Effective school leadership requires shared vision and collective ownership. By conducting vision-sharing reflective activities, the school head helps teachers internalize the DepEd vision and mission, encourages alignment of school initiatives with institutional goals, and promotes collaborative planning and reflective practice.",
wr:[{l:"A",r:"Requesting SDO assistance is external and reactive. The school head should first address the alignment issue internally through vision sharing."},{l:"B",r:"In-service training is more formal and lecture-based. Vision sharing through reflective activities is more participative and promotes deeper internalization."},{l:"C",r:"Having master teachers provide LAC assistance addresses technical skills but does not directly address the fundamental issue of vision alignment."}]}},

{q:"A week after a destructive earthquake, the Schools Division Office (SDO) ordered the resumption of classes in all grade levels in the province. The buildings of a school located in the most devastated municipality all obtained significant damages, making the campus extremely dangerous for use. The school head decided to extend the suspension of face-to-face classes and on-site work until a suitable temporary learning shelter can be provided. He/she later informed the SDO and the municipal DRRMC of his decision. Is the action of the school head acceptable? Why or why not?",
c:[{t:"Yes, because the school heads of public and private schools have the authority to suspend classes.",x:0},{t:"Yes, because urgent action is needed to prevent loss of life or bodily harm in the situation.",x:1},{t:"No, because the school head should have informed the SDO and the municipal DRRMC before announcing the decision.",x:0},{t:"No, because the school head does not have the authority to suspend classes.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"The school head\u2019s action is acceptable because it was taken to prevent loss of life or bodily harm. When school buildings are significantly damaged and dangerous, the immediate safety of learners and personnel takes precedence. The school head exercised sound judgment in prioritizing safety, even if it meant acting before formal coordination.",
wr:[{l:"A",r:"While school heads do have some authority regarding class suspension, the basis is not general authority but the specific urgent need to prevent harm in this dangerous situation."},{l:"C",r:"In emergency situations where lives are at risk, acting immediately is the correct response. Waiting for prior approval could endanger lives. The school head informed the SDO and DRRMC after making the decision, which is acceptable in urgent situations."},{l:"D",r:"School heads do have authority to make emergency decisions regarding the safety of their school community, especially when buildings are structurally compromised."}]}},

{q:"Based on the Strength, Weakness, Opportunities, and Threats (SWOT) analysis, it was found that many learners incurred absences because of the proliferation of computer shops near the school vicinity. What appropriate actions should a school head take?\n\nI. Conduct a meeting with parents and inform them of the problem.\nII. Ask the help of LGU and suggest coming up with an ordinance.\nIII. Request the barangay captain for the revocation of the owners\u2019 permit to operate a computer business.\nIV. Talk to the computer shop owners and request them to close their shop during class hours.\nV. Ask the computer shop operators not to admit school-age children during class hours.",
c:[{t:"I, II, IV, and V",x:0},{t:"I, II and V",x:1},{t:"I, III and V",x:0},{t:"III, IV and V",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"The appropriate actions are: (I) Meeting with parents to inform them of the problem, (II) Asking LGU help for an ordinance, and (V) Asking operators not to admit school-age children during class hours. These actions are collaborative, legally sound, and respect the rights of business owners while protecting learners.",
wr:[{l:"A",r:"Talking to shop owners and requesting closure during class hours (IV) is overreach \u2014 the school head cannot dictate business operating hours."},{l:"C",r:"Requesting revocation of business permits (III) is excessive and beyond the school head\u2019s authority. It also may not be legally justified."},{l:"D",r:"Requesting permit revocation (III) and shop closure (IV) are both beyond the school head\u2019s authority and disproportionate responses."}]}},

{q:"The Supreme Student Government (SSG) Officers of a school requested from a school head if the SSG programs, projects, and activities for School Year 2021-2022 can be covered by the school MOOE. Should the school head allow such expenses?",
c:[{t:"Yes, since SSG\u2019s programs, projects, and activities can also be funded against MOOE.",x:1},{t:"Yes, since MOOE spending is upon the approval of the school head.",x:0},{t:"No, since the SSG fee is included in the authorized contributions.",x:0},{t:"No, since SSG can solicit donations from stakeholders.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"According to DepEd Order No. 013, s. 2022 (Omnibus Guidelines on Student Government) and related MOOE guidelines, SSG programs, projects, and activities may be charged to school MOOE, as long as they are included in the approved Annual Implementation Plan (AIP) and School Improvement Plan (SIP).",
wr:[{l:"B",r:"While the school head approves MOOE spending, the basis for allowing SSG expenses is the DepEd policy, not the school head\u2019s discretion alone."},{l:"C",r:"The existence of SSG fees does not preclude the use of MOOE for SSG activities. Both funding sources can support student government programs."},{l:"D",r:"The ability to solicit donations does not disqualify SSG from MOOE funding. MOOE can be used for SSG activities as a matter of policy."}]}},

{q:"Learning outcome is a statement of what students should know, understand and be able to demonstrate after completion of a process of learning. Which of the following should a school head do to ensure that the learning outcome supports the achievement of learners?",
c:[{t:"Provide programs that emphasize the enhancement of learners\u2019 abilities.",x:0},{t:"Monitor the alignment of the classroom objective, learning experiences, and teaching methods.",x:0},{t:"Encourage self-directed learner and teacher activities to achieve the desired learning outcome.",x:0},{t:"Provide teachers with technical assistance to ensure content, teaching practices, and assessment criteria alignment.",x:1}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"Providing technical assistance ensures that teachers align content (what is taught), teaching practices (how it is taught), and assessment criteria (how learning is measured). This comprehensive alignment is essential for achieving learning outcomes. The school head\u2019s role is to support teachers in maintaining this alignment through professional guidance.",
wr:[{l:"A",r:"Providing programs for learner enhancement is too broad and does not specifically address the alignment of instruction with learning outcomes."},{l:"B",r:"While monitoring alignment is important, it is a supervisory function. The question asks what the school head should do, and providing technical assistance is more proactive and supportive."},{l:"C",r:"Encouraging self-directed activities is a facilitative approach but does not ensure the systematic alignment of content, teaching, and assessment needed for learning outcomes."}]}},

{q:"Which statements are true about the roles of a Senior High School (SHS) school head based on the guidelines on the Organizational Structures and Staffing Patterns of Stand-alone and Integrated Public Senior High School?\n\nI. Spearheads the formulation and implementation of the School Improvement Plan and Annual Implementation Plan.\nII. Assumes leadership in planning, preparing, and delivering the instructional programs for the strands and subjects under his/her subject group.\nIII. Monitors and assesses learners\u2019 academic performance, attendance, and behavior in his/her classes.\nIV. Manages the fiscal and asset resources of the school.\nV. Ensures the effective implementation of the curriculum inside the classroom.\nVI. Facilitates organizational efficiency and the effective management of the people systems of the school.",
c:[{t:"I, II, and V",x:0},{t:"I, IV, and VI",x:1},{t:"II, IV, and VI",x:0},{t:"II, III, and V",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The SHS school head\u2019s roles include: (I) Spearheading SIP and AIP formulation and implementation, (IV) Managing fiscal and asset resources, and (VI) Facilitating organizational efficiency and people systems management. These are school-wide leadership and management functions, distinct from classroom-level roles.",
wr:[{l:"A",r:"Statements II (delivering instructional programs for subject groups) and V (curriculum implementation inside the classroom) describe teacher or department head roles, not school head functions."},{l:"C",r:"Statement II describes a department head or subject group leader role, not the school head\u2019s primary function."},{l:"D",r:"Statements II, III, and V all describe classroom-level or department-level functions, not the school-wide management role of the school head."}]}},

{q:"The Department of Education may grant Sabbatical leaves to teachers for the purpose of intensive study and research to improve their professional knowledge, skills, and abilities. Which of the following guidelines are correct?\n\nI. Sick leave or vacation leave is not accrued while on Sabbatical leave.\nII. Study leave of more than one (1) year may be permitted by the Secretary of Education with compensation.\nIII. Upon return from a sabbatical leave, a minimum period of seven (7) years of service must be completed to qualify for another year.\nIV. Teachers are required to sign an agreement to return to active service with the Department of Education for two (2) consecutive years immediately after they leave.\nV. A non-returning teacher from Sabbatical leave is not eligible to receive retirement benefits.\nVI. A non-returning teacher from Sabbatical leave is required to return 10% of the salary and benefits received during the leave.",
c:[{t:"II, IV, and V",x:0},{t:"II, V, and VI",x:0},{t:"III, IV, and VI",x:0},{t:"I, III, and IV",x:1}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The correct guidelines on Sabbatical leave are: (I) Sick and vacation leave are not accrued during sabbatical, (III) A minimum of seven years of service after return is required before qualifying for another sabbatical, and (IV) Teachers must sign an agreement to return to active service for two consecutive years after the leave.",
wr:[{l:"A",r:"Statement II is incorrect \u2014 study leave of more than one year requires specific conditions. Statement V about retirement benefit ineligibility is not accurate."},{l:"B",r:"Statements II, V, and VI contain inaccuracies about the conditions and consequences of sabbatical leave."},{l:"C",r:"While III and IV are correct, statement VI (returning 10% of salary) is not the accurate provision for non-returning teachers."}]}},

{q:"If a tobacco manufacturing company offers to donate the needed tools and equipment for SHS learners taking Commercial Cooking, claiming that the donation is a part of their corporate responsibility, should the school head accept the offer? Why or why not?",
c:[{t:"No, because there is an existing DepEd Order directing school officials to refrain from accepting gifts, donations, and sponsorships from tobacco companies.",x:1},{t:"No, because accepting donations from tobacco companies is like tolerating the act of smoking.",x:0},{t:"Yes, because the offer of the company is based on the principle of volunteerism and partnership, and it provides the much-needed facilities for the hands-on activity of the learners.",x:0},{t:"Yes, because the offer of the tobacco company is an act of goodwill.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"There is an existing DepEd Order that explicitly directs school officials to refrain from accepting gifts, donations, and sponsorships from tobacco companies. This policy-based prohibition is absolute and does not allow exceptions regardless of the nature or purpose of the donation.",
wr:[{l:"B",r:"While the moral argument has merit, the correct basis is the specific DepEd policy prohibition, not a general moral stance about smoking."},{l:"C",r:"Regardless of volunteerism principles or the school\u2019s needs, DepEd policy explicitly prohibits accepting anything from tobacco companies."},{l:"D",r:"Goodwill does not override the explicit DepEd policy against accepting donations from tobacco companies."}]}},

{q:"Teacher Jojo is applying for a promotion. He is told by a colleague that he must get a high score on the interview to be considered for the position. According to DepEd Order No. 007, s. 2023, what is a single, primary component used to evaluate a teacher\u2019s competence for promotion?",
c:[{t:"The number of professional awards received.",x:0},{t:"The length of service in the school.",x:0},{t:"The results of the comparative assessment.",x:1},{t:"The number of seminars attended.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"Under DepEd Order No. 007, s. 2023, the single primary component for evaluating teacher competence for promotion is the results of the comparative assessment. This assessment comprehensively evaluates qualifications, competencies, and performance, replacing the multi-component evaluation of previous guidelines.",
wr:[{l:"A",r:"Professional awards may contribute to a teacher\u2019s profile but are not the single primary component under DO 007, s. 2023."},{l:"B",r:"Length of service is a factor but not the primary component. The comparative assessment is the comprehensive evaluation tool."},{l:"D",r:"Seminars attended contribute to professional development but are not the primary evaluation component for promotion."}]}},

{q:"Every school shall maintain discipline inside and outside the school premises when learners are engaged in activities authorized by the school. Which Philippine law serves as a basis for instituting learner discipline in school?",
c:[{t:"Special Protection of Children Against Abuse, Exploitation, and Discrimination Act",x:0},{t:"An Act Providing for the Establishment and Maintenance of an Integrated System of Education",x:1},{t:"Policy Guidelines on Protecting Children in School from Abuse, Violence, Exploitation, Discrimination, Bullying, and other Forms of Abuse",x:0},{t:"An Act Enhancing the Philippine Basic Education System by Strengthening Its Curriculum and Increasing the Number of Years for Basic Education, Appropriating Funds Therefore and for other Purposes",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The Education Act of 1982 (Batas Pambansa Blg. 232), \u201CAn Act Providing for the Establishment and Maintenance of an Integrated System of Education,\u201D serves as the legal basis for learner discipline in schools. It establishes the framework for school governance including the maintenance of discipline.",
wr:[{l:"A",r:"The Special Protection of Children Act (RA 7610) focuses on protecting children from abuse, not on establishing the framework for learner discipline in schools."},{l:"C",r:"This is a DepEd policy guideline (DepEd Order No. 40, s. 2012), not a Philippine law. The question asks for the law, not a department policy."},{l:"D",r:"This describes the Enhanced Basic Education Act of 2013 (RA 10533), which focuses on curriculum reform and K to 12 implementation, not on learner discipline."}]}},

{q:"Mr. B, the owner of a general merchandise store, donated to a school various materials for classroom repair and learning support kits for Grade 7 learners.\n\nWhat is the best action that the school head should take to ensure Mr. B\u2019s continued support for the school?",
c:[{t:"Recognize stakeholders\u2019 valuable assistance through the school-based awards and incentives.",x:1},{t:"Allocate a \u2018feature page\u2019 on the school\u2019s publication for stakeholders\u2019 recognition.",x:0},{t:"Recommend the donors to the Adopt-A-School to avail of tax incentives.",x:0},{t:"Contact the external partnerships service, Adopt-A-School program, for further details on donations.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"Recognizing stakeholders through school-based awards and incentives is the most direct and effective way to ensure continued support. Recognition validates the donor\u2019s contribution, builds goodwill, and motivates ongoing partnership. It is within the school head\u2019s immediate capacity to implement.",
wr:[{l:"B",r:"A feature page provides recognition but is limited in scope and reach. School-based awards are more impactful and personal."},{l:"C",r:"Recommending to Adopt-A-School for tax incentives is a secondary benefit but does not directly address the relationship-building aspect of continued support."},{l:"D",r:"Contacting Adopt-A-School for donation details is procedural but does not address the immediate need to recognize and appreciate the donor\u2019s contribution."}]}},

{q:"In order to implement programs effectively and efficiently, teachers and staff should be involved in the realization of the plans. How will the school head develop the leadership potential of the teachers and staff?",
c:[{t:"Assume all the responsibilities in the implementation of the program.",x:0},{t:"Assign teachers to manage different committees during and after the conduct of School Learning Action Cells (SLAC).",x:1},{t:"Coach master teachers in conducting classroom observation and providing technical assistance during a video lesson demonstration.",x:0},{t:"Identify teachers who can implement the programs according to their rank, experiences, and length of service.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"Developing the leadership potential of teachers and staff requires giving them opportunities to lead and take responsibility in school initiatives. By assigning teachers to manage committees, the school head encourages shared leadership, builds decision-making and management skills, and allows teachers to gain experience in program implementation.",
wr:[{l:"A",r:"Assuming all responsibilities centralizes leadership and denies teachers the opportunity to develop their own leadership skills."},{l:"C",r:"Coaching master teachers focuses on instructional leadership skills for a specific group, not the broader development of leadership potential across all teachers and staff."},{l:"D",r:"Identifying teachers based on rank and experience is a selection process, not a developmental one. It does not build new leadership capacity."}]}},

{q:"The content of Learning Action Cell (LAC) sessions may be determined by teachers themselves under the general guidance of their respective school heads or LAC leaders. What areas of discussion should be included in LAC sessions as stipulated in RA No. 10533 and various policies of DepEd?\n\nI. Sustainable Development Goals of the United Nations (UN)\nII. Content and Pedagogy of the K to 12 Basic Education Program\nIII. Assessment and Reporting in the K to 12 Basic Education Program\nIV. Leadership Skills and Practices in the Philippines\nV. Curriculum contextualization, localization, and indigenization\nVI. Duties and Responsibilities of Non-Teaching Personnel",
c:[{t:"I, II, and III",x:0},{t:"II, III, and V",x:1},{t:"III, IV, and VI",x:0},{t:"I, IV, and VI",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"As stipulated in RA 10533 (Enhanced Basic Education Act) and DepEd policies, LAC sessions should cover: (II) Content and Pedagogy of K to 12, (III) Assessment and Reporting in K to 12, and (V) Curriculum contextualization, localization, and indigenization. These are directly related to the teaching-learning process and the K to 12 curriculum.",
wr:[{l:"A",r:"While II and III are correct, Sustainable Development Goals (I) is not a mandated LAC topic under RA 10533 or DepEd policies."},{l:"C",r:"Leadership Skills (IV) and Duties of Non-Teaching Personnel (VI) are not within the scope of LAC sessions, which focus on teaching-learning topics."},{l:"D",r:"SDGs (I), leadership skills (IV), and non-teaching duties (VI) are outside the scope of LAC sessions as defined by RA 10533."}]}},

{q:"To strengthen the Every Child A Reader Program, the Department of Education issued DepEd Memorandum no. 173 s. 2019 known as Hamon: Bawat Bata Bumbasa (3Bs Initiative). What strategies can the school head do to operationalize the department\u2019s initiative fully?\n\nI. Benchmark from the other schools division\u2019s literacy initiatives.\nII. Capacitate all teachers to become reading teachers.\nIII. Increase the literacy level of parents/guardians.\nIV. Engage stakeholders to support the reading program.\nV. Ask the district supervisor to orient the teachers.",
c:[{t:"I, II, III",x:0},{t:"I, II, IV",x:1},{t:"III, IV",x:0},{t:"III, V",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"To operationalize the 3Bs Initiative: (I) Benchmarking from other divisions provides best practices and models; (II) Capacitating all teachers as reading teachers ensures school-wide implementation; (IV) Engaging stakeholders provides community support for the reading program. These three create a comprehensive implementation strategy.",
wr:[{l:"A",r:"While I and II are correct, increasing parent literacy levels (III) is beyond the school\u2019s primary mandate and capacity. The school engages parents as partners, not as literacy students."},{l:"C",r:"Items III and IV alone are insufficient. Without benchmarking (I) and teacher capacitation (II), the program lacks implementation strategy and school-level readiness."},{l:"D",r:"Increasing parent literacy (III) and relying on the district supervisor (V) are passive approaches that do not demonstrate school-level ownership and leadership of the initiative."}]}},

{q:"A secondary school has been using a newly-constructed building for years when the school head was furnished with a copy of an Audit Observation Memorandum stating that the building was constructed using DepEd funds but was not recorded in the book of accounts. Which of the following did the school head fail to do?",
c:[{t:"Return the signed Property Transfer Report to the Assessment Management Division",x:1},{t:"Submit the complete documentary requirements for recording purposes",x:0},{t:"Record the School building in the property card",x:0},{t:"Keep the school copy of the signed Certificate of Acceptance",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"The school head failed to return the signed Property Transfer Report to the Assessment Management Division. This document is essential for the building to be recorded in the book of accounts. Without the PTR being returned, the asset cannot be properly captured in the government\u2019s financial records.",
wr:[{l:"B",r:"While submitting documentary requirements is part of the process, the specific failure identified in the audit is the non-return of the Property Transfer Report."},{l:"C",r:"Recording in the property card is a school-level action, but the audit finding concerns the book of accounts, which requires the PTR to be returned to the Assessment Management Division."},{l:"D",r:"Keeping the school copy is a records management practice but does not address the recording failure in the book of accounts."}]}},

{q:"Mr. Alvin Torres, a Senior High School teacher, is guiding his students through a career orientation session. He explains how the Philippine Qualifications Framework (PQF) helps align education, training, and job qualifications across sectors. He presents four individuals with different qualifications:\n\nPerson A completed a short-term technical-vocational course and holds a National Certificate II (NC II).\n\nPerson B earned a bachelor\u2019s degree and passed the licensure examination for teachers.\n\nPerson C finished Grade 10 and is currently enrolled in a TVET program.\n\nPerson D holds a doctoral degree and is engaged in advanced research and policy development.\n\nWhich of the following correctly matches each person to their corresponding PQF level?",img:"IMG78",
c:[{t:"Person A-Level 2, Person B-Level 6, Person C-Level 1, Person D-Level 8",x:1},{t:"Person A-Level 3, Person B-Level 5, Person C-Level 2, Person D-Level 7",x:0},{t:"Person A-Level 1, Person B-Level 6, Person C-Level 2, Person D-Level 8",x:0},{t:"Person A-Level 2, Person B-Level 7, Person C-Level 1, Person D-Level 6",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.4 Curriculum enrichment",
e:{w:"Under the Philippine Qualifications Framework: Person A (NC II holder) = Level 2; Person B (bachelor\u2019s degree + LET passer) = Level 6; Person C (Grade 10 completer in TVET) = Level 1; Person D (doctoral degree + advanced research) = Level 8. This is the correct mapping of qualifications to PQF levels.",
wr:[{l:"B",r:"Person A at Level 3 is incorrect \u2014 NC II corresponds to Level 2. Person B at Level 5 is too low for a licensed professional with a bachelor\u2019s degree. Person D at Level 7 is too low for a doctoral degree holder."},{l:"C",r:"Person A at Level 1 is incorrect \u2014 a Grade 10 completer (Person C) is Level 1, while an NC II holder is Level 2. Person C at Level 2 reverses the correct placement."},{l:"D",r:"Person B at Level 7 and Person D at Level 6 are reversed. A doctoral degree (Level 8) is higher than a bachelor\u2019s degree (Level 6)."}]}},

{q:"Mr. Alvin Torres, a Senior High School teacher, is guiding his students through a career orientation session. He explains how the Philippine Qualifications Framework (PQF) helps align education, training, and job qualifications across sectors.\n\nHe presents four individuals with different qualifications:\n\nPerson A completed a short-term technical-vocational course and holds a National Certificate II (NC II).\n\nPerson B earned a bachelor\u2019s degree and passed the licensure examination for teachers.\n\nPerson C finished Grade 10 and is currently enrolled in a TVET program.\n\nPerson D holds a doctoral degree and is engaged in advanced research and policy development.\n\nWhich of the following correctly matches each person to their corresponding PQF level?",
c:[{t:"Person A-Level 2, Person B-Level 6, Person C-Level 1, Person D-Level 8",x:1},{t:"Person A-Level 3, Person B-Level 5, Person C-Level 2, Person D-Level 7",x:0},{t:"Person A-Level 1, Person B-Level 6, Person C-Level 2, Person D-Level 8",x:0},{t:"Person A-Level 2, Person B-Level 7, Person C-Level 1, Person D-Level 6",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.4 Curriculum enrichment",
e:{w:"Under the Philippine Qualifications Framework: Person A (NC II holder) = Level 2; Person B (bachelor\u2019s degree + LET passer) = Level 6; Person C (Grade 10 completer in TVET) = Level 1; Person D (doctoral degree + advanced research) = Level 8.",
wr:[{l:"B",r:"NC II corresponds to Level 2, not Level 3. A licensed professional with a bachelor\u2019s degree is Level 6, not Level 5."},{l:"C",r:"Person A (NC II) is Level 2, not Level 1. Person C (Grade 10) is Level 1, not Level 2. The placements are reversed."},{l:"D",r:"Person B (bachelor\u2019s) is Level 6 and Person D (doctoral) is Level 8. These are reversed in this option."}]}},

{q:"Based on the criteria set by DepEd, a public school near an industrial park with a lot of Japanese manufacturing companies was selected by the division office to be the only school in the province to offer a Special Program for Foreign Language (SPFL) for Junior High School students, particularly Niponggo. How can the school head best promote the relevance of the said program?",
c:[{t:"Provide a monetary reward to students who will enroll in SPFL.",x:0},{t:"Request the LGU for a sponsorship of a tour to Japan for the top three performing learners in SPFL.",x:0},{t:"Hold an SPFL festival in the school with Japanese industries putting up booths and inviting parents, community members, and learners.",x:1},{t:"Require students who obtained a grade of 87% and above in English to enroll in SPFL.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"Holding an SPFL festival with Japanese industries, parents, and community members is the best promotional strategy because it: demonstrates the practical relevance of the program through industry presence, engages multiple stakeholders simultaneously, creates a visible and memorable event that showcases the program\u2019s value, and builds community-industry-school partnerships.",
wr:[{l:"A",r:"Monetary rewards may attract enrollment but do not promote the program\u2019s relevance or build sustainable interest in the language program."},{l:"B",r:"A Japan tour is expensive and benefits only three students. It does not promote the program\u2019s relevance to the broader school community."},{l:"D",r:"Requiring high-performing English students to enroll is coercive and does not promote the program\u2019s relevance. Enrollment should be voluntary and informed."}]}}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml=q.img?'<img class="q-img" src="'+q.img+'" alt="Question reference image">':'';
if(q.img==='IMG78') imgHtml='<img class="q-img" src="'+IMG78+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}
var r=document.getElementById('resultsArea');
r.innerHTML='<div class="trophy">'+em+'</div><div class="score-number" style="color:'+(p>=75?'var(--green)':p>=60?'var(--amber)':'var(--red)')+'" id="sn">0%</div><div class="score-subtitle">'+cor+' out of '+Q.length+' correct</div><div class="stat-boxes"><div class="stat-box green-tint"><div class="stat-box-num" style="color:var(--green)">'+cor+'</div><div class="stat-box-label">Correct</div></div><div class="stat-box red-tint"><div class="stat-box-num" style="color:var(--red)">'+wrn+'</div><div class="stat-box-label">Wrong</div></div><div class="stat-box accent-tint"><div class="stat-box-num" style="color:var(--accent)">'+p+'%</div><div class="stat-box-label">Score</div></div></div><div class="perf-pill '+bc+'">'+band+'</div><div class="motiv-msg">'+msg+'</div><div class="results-actions"><button class="btn-outline" onclick="restart()">\u21ba Restart This Set</button><button class="btn-filled" onclick="window.location.href=\'nash-05.html\'">Proceed to Set 5 \u2192</button></div>';
r.classList.add('show');
var c=0,el=document.getElementById('sn');var iv=setInterval(function(){c++;el.textContent=c+'%';if(c>=p)clearInterval(iv);},20);launchP();
}
function restart(){cur=0;cor=0;wrn=0;ans=false;document.getElementById('pCor').textContent=0;document.getElementById('pWrn').textContent=0;document.getElementById('pPct').textContent=0;document.getElementById('pFill').style.width='0%';var r=document.getElementById('resultsArea');r.classList.remove('show');r.innerHTML='';document.getElementById('quizArea').classList.remove('hidden');render();}
function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(232,160,32,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
render();
</script>
</body>
