<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 3 of 7 | Jade Emperor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#040e0c;--bg-mid:#081a18;--bg-end:#030c0a;--accent:#38847a;--accent2:#58a49a;--accent-glow:rgba(56,132,122,0.30);--card-bg:rgba(8,26,24,0.85);--text-primary:#b8e0d8;--text-secondary:#6a9e94;--border-glow:rgba(56,132,122,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(56,132,122,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:1080px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(56,132,122,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(56,132,122,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(56,132,122,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(56,132,122,0.4);background:rgba(56,132,122,0.30);box-shadow:0 0 20px rgba(56,132,122,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(56,132,122,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(56,132,122,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(56,132,122,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(56,132,122,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#fff}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(56,132,122,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:1080px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(56,132,122,0.4);background:rgba(56,132,122,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#fff;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

{q:"CJ\u2019s parents are both Overseas Filipino Workers (OFW), but he/she is lucky to have an uncle to depend on. His uncle is so supportive of his studies and co-curricular activities. Later, CJ\u2019s uncle was elected president of the Parent-Teacher Association (PTA) at the school level. In reference to the guidelines for the conduct of PTA elections, what can be inferred from this scenario?",
c:[{t:"Uncle R is a court-appointed guardian of CJ.",x:0},{t:"Uncle R is a relative within the fifth degree of consanguinity.",x:0},{t:"The biological parents authorized and entrusted CJ\u2019s care and custody to Uncle R.",x:1},{t:"Uncle R is a homeroom adviser in the school of CJ.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.2 Management of school organizations",
e:{w:"For CJ\u2019s uncle to be eligible for PTA membership and election as president, the biological parents (who are OFWs) must have authorized and entrusted CJ\u2019s care and custody to the uncle. Under DepEd guidelines for PTA elections, guardians entrusted with a learner\u2019s care by biological parents are eligible for PTA membership.",
wr:[{l:"A",r:"There is no indication of court-appointed guardianship. The scenario describes a family arrangement where parents entrusted custody."},{l:"B",r:"The key inference is not about the degree of consanguinity but the authorization from biological parents to exercise parental functions."},{l:"D",r:"Nothing suggests the uncle is a homeroom adviser. He is a supportive guardian who became PTA president."}]}},

{q:"A school head understands and implements laws, policies, guidelines, and issuances relating to managing human, financial and material resources. Which of the following concrete, observable and measurable school head behaviors/practices can be displayed to manage the systems and processes in the school?\n\nI. Management of Staff\nII. Management of School Organization\nIII. Management of Diverse Relations\nIV. Financial Management\nV. Records Management",
c:[{t:"II, III, IV",x:1},{t:"II, III",x:0},{t:"I, III, IV",x:0},{t:"I, II",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.5 Management of school information",
e:{w:"The strongest indicators of managing systems and processes involve: (II) Organizational management, (III) Stakeholder relations, and (IV) Financial/resource management. These reflect school-wide operational leadership.",
wr:[{l:"B",r:"While II and III are correct, this misses Financial Management (IV), a critical observable behavior in managing school systems."},{l:"C",r:"Management of Staff (I) focuses on individual personnel management rather than broader systems and processes."},{l:"D",r:"I and II alone are too limited for managing systems and processes across the school."}]}},

{q:"School A and School B are both qualified recipients of the Special Hardship Allowance. Teachers in School B are complaining that teachers in School A received a higher amount compared to them. How will the school head address this issue?",
c:[{t:"Explain that qualified recipients shall receive their allowance based on distance and basic monthly salary.",x:1},{t:"Advise the teachers to read the guidelines specified in DO 39, s. 2021.",x:0},{t:"Advise the teachers to post their concerns on social media.",x:0},{t:"Tell the teachers that only those in pure multi-grade schools shall be qualified to receive the allowance.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"The Special Hardship Allowance amount varies based on the distance of the school from the nearest population center and the teacher\u2019s basic monthly salary. Explaining these computation factors directly addresses the concern with a clear, policy-based rationale.",
wr:[{l:"B",r:"Simply telling teachers to read the DO does not proactively address their concern. A school head should explain the policy, not deflect."},{l:"C",r:"Advising teachers to post on social media is inappropriate and unprofessional."},{l:"D",r:"This is factually incorrect. Special Hardship Allowance is not limited to pure multi-grade schools."}]}},

{q:"When a school head was transferred to a multi-grade school, he/she discovered critical areas of concern. The school\u2019s key performance indicators were consistently declining, as shown by the table below.\n\nWhat process steps can the school head undertake to improve the performance of the failing school?",img:"IMG44",
c:[{t:"A. Diagnose \u2192 Motivate \u2192 Reform \u2192 Monitor",x:0},{t:"B. Diagnose \u2192 Plan \u2192 Implement \u2192 Monitor \u2192 Improve",x:1},{t:"C. Diagnose \u2192 Strategize \u2192 Act \u2192 Evaluate",x:0},{t:"D. Diagnose \u2192 Propose \u2192 Mobilize \u2192 Evaluate \u2192 Improve",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"Option B (Diagnose \u2192 Plan \u2192 Implement \u2192 Monitor \u2192 Improve) presents the most complete and logical process for school improvement. It follows the standard improvement cycle: diagnose problems, plan interventions, implement them, monitor progress, and continuously improve.",
wr:[{l:"A",r:"Diagnose \u2192 Motivate \u2192 Reform \u2192 Monitor skips planning and implementation phases and ends at monitoring without an improvement step."},{l:"C",r:"Diagnose \u2192 Strategize \u2192 Act \u2192 Evaluate lacks the explicit \u201CImprove\u201D step that closes the improvement loop."},{l:"D",r:"Diagnose \u2192 Propose \u2192 Mobilize \u2192 Evaluate \u2192 Improve uses less action-oriented terms than planning and implementing."}]}},

{q:"A school head pointed out that improved teachers\u2019 knowledge, skills, and attitude will contribute significantly to student learning and development. The school head can best advance this goal by letting teachers realize that __________.",
c:[{t:"No learner is left behind in this time of pandemic",x:0},{t:"Professional development of teachers is the call of the time",x:0},{t:"All learners have the capacity to learn and improve",x:0},{t:"Quality teachers means quality learners",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"The phrase \u201Cquality teachers means quality learners\u201D emphasizes a direct cause-and-effect relationship. If teachers enhance their knowledge, skills, and attitude, they will produce better learning results. This makes teachers\u2019 growth a direct part of the school\u2019s mission to improve student learning.",
wr:[{l:"A",r:"\u201CNo learner is left behind\u201D focuses on learner inclusion rather than the direct link between teacher quality and student outcomes."},{l:"B",r:"\u201CCall of the time\u201D frames development as a temporal obligation rather than establishing the fundamental cause-and-effect."},{l:"C",r:"Acknowledging learners\u2019 capacity is important but does not directly connect teacher improvement to student outcomes."}]}},

{q:"What does the table below imply about the organizational structures and staffing patterns of Stand-Alone and Integrated Senior High School (SHS)?",img:"IMG46",
c:[{t:"Schools A and D have the same number of staff and population.",x:0},{t:"The SHS staffing patterns consider the varying needs and contexts of the schools based on population.",x:1},{t:"The bigger the schools, the more staff will be assigned.",x:0},{t:"School Heads assume the responsibilities if not given Assistant School Head items.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The table shows different schools with different population sizes have different staffing configurations. This demonstrates that staffing patterns are context-responsive, considering the varying needs and sizes of schools rather than a one-size-fits-all approach.",
wr:[{l:"A",r:"Schools A and D clearly have different populations (1,112 vs. 3,578) and different staffing levels."},{l:"C",r:"Staffing is not purely proportional to size. The table shows context matters beyond just enrollment numbers."},{l:"D",r:"Empty cells indicate positions not allocated, not that existing personnel absorb those roles."}]}},

{q:"In a batch of 350 Grade 1 learners of a school in 2016, only 299, or 85%, completed the elementary curriculum in 2021. What Key Performance Indicator is illustrated in this figure?",
c:[{t:"Cohort Survival Rate",x:0},{t:"Completion Rate",x:1},{t:"Graduation Rate",x:0},{t:"Promotion Rate",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The data links an initial cohort (350 Grade 1 learners in 2016) to completion of the full elementary cycle in 2021 (299 or 85%). This corresponds to Completion Rate, which measures the proportion of a cohort that completes the entire education cycle.",
wr:[{l:"A",r:"Cohort Survival Rate measures the proportion remaining enrolled from one grade to the next, not completion of the entire cycle."},{l:"C",r:"Graduation Rate refers to the proportion completing requirements in a specific school year, regardless of when they started."},{l:"D",r:"Promotion Rate measures the proportion promoted to the next grade level within a school year."}]}},

{q:"A school head received a letter from five teachers who were absent during the faculty meeting complaining about the agreement that all personnel would report to school daily in a face-to-face modality instead of availing themselves of the work-from-home arrangement. How would a school head prevent this situation from recurring?",
c:[{t:"Provide minutes of meeting to all teachers.",x:1},{t:"Ensure the 100% attendance of teachers during meetings.",x:0},{t:"Provide a copy of the meeting agenda in advance to all teachers.",x:0},{t:"Reschedule the meeting if there are absent teachers.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"Providing minutes of meeting to all teachers \u2014 including those absent \u2014 ensures everyone is informed of decisions and agreements. This prevents misunderstandings and complaints from uninformed personnel.",
wr:[{l:"B",r:"Ensuring 100% attendance is impractical. Teachers may have valid reasons for absence; the goal is keeping everyone informed regardless."},{l:"C",r:"The agenda informs of topics but does not communicate the actual decisions and agreements reached."},{l:"D",r:"Rescheduling due to absences would delay decision-making. Better communication of outcomes is the solution."}]}},

{q:"Documents like Form 138-A and Supervisory reports are kept and preserved. How should a school head ensure that the school documents are properly protected?",
c:[{t:"Develop an offline system where data about the documents are stored for easy access.",x:0},{t:"Assign the Administrative Officer II in classifying and preserving the school records.",x:0},{t:"Find a classroom that will serve as the storage area for the records.",x:0},{t:"Create a system for preparing and archiving records both digitized and offline.",x:1}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"A dual system \u2014 both digitized and offline \u2014 provides comprehensive protection. Digital copies ensure accessibility and backup, while offline copies serve as primary records. This follows best practices by providing redundancy.",
wr:[{l:"A",r:"An offline-only system lacks backup protection that digitization provides."},{l:"B",r:"Assigning personnel addresses who manages records, not how they are systematically protected."},{l:"C",r:"Using a classroom for storage is basic but does not constitute a comprehensive records protection system."}]}},

{q:"As a learner-centered institution, DepEd includes Child Protection as one of the four themes of the Basic Education Research Agenda, upholding the premise that school children\u2019s protection significantly affects learning outcomes. Which of the following concepts are included in this theme?\n\nI. Addiction and Child Abuse\nII. Bullying and Teenage Pregnancy\nIII. Localization and Indigenization\nIV. Media Consumption\nV. Qualification standards and criteria for hiring\nVI. Contextualization of Teaching Materials",
c:[{t:"I, II, III",x:0},{t:"III, IV, V",x:0},{t:"I, II, IV",x:1},{t:"II, III, IV, V",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.4 Curriculum enrichment",
e:{w:"Under the Child Protection theme of the BERA: (I) Addiction and Child Abuse \u2014 directly related to child safety; (II) Bullying and Teenage Pregnancy \u2014 critical child protection issues; (IV) Media Consumption \u2014 addresses digital safety and its impact on children\u2019s well-being.",
wr:[{l:"A",r:"Localization and Indigenization (III) falls under a different BERA theme related to curriculum development."},{l:"B",r:"Qualification standards (V) relates to HR management, not child protection. Localization (III) is also under a different theme."},{l:"D",r:"This combination includes items from multiple BERA themes. Localization (III) and qualification standards (V) do not belong to Child Protection."}]}},

{q:"After doing professional reflections, a school head realized that there is a need for re-assignment of teachers based on their position, specialization, and experience.\n\nIn what PPSSH domain did the school head show improvement?",
c:[{t:"Leading Strategically",x:0},{t:"Managing School Operations",x:1},{t:"Focusing on Teaching and Learning",x:0},{t:"Developing Self and Others",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The scenario involves re-assignment of teachers based on position, specialization, and experience, which relates to efficient management of human resources. In the PPSSH, this falls under Managing School Operations, which focuses on managing human, financial, and material resources; organizing personnel assignments; ensuring efficient operations; and aligning staff deployment with school needs.",
wr:[{l:"A",r:"Leading Strategically involves vision-setting and strategic planning, not operational management of personnel assignments."},{l:"C",r:"Focusing on Teaching and Learning deals with curriculum, instruction, and assessment, not administrative reassignment."},{l:"D",r:"Developing Self and Others focuses on professional growth and mentoring, not operational deployment of human resources."}]}},

{q:"A school was included in the list of schools to be granted the SBM funds. Looking at the School Improvement Plan, the school head must have the following eligible activities to enjoy such grant:\n\nI. Enhancing the teaching and learning experience\nII. Hiring and payment of salaries of additional staff\nIII. Printing of National Achievement Test reviewers\nIV. Sponsoring field trips and other educational trips\nV. Improving school management and administrative processes\nVI. Strengthening resiliency of disadvantaged schools",
c:[{t:"I, III, and IV",x:0},{t:"II, III, and IV",x:0},{t:"I, V, and VI",x:1},{t:"II, V, and VI",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"Eligible SBM fund activities include: (I) Enhancing teaching and learning, (V) Improving management and administrative processes, and (VI) Strengthening resiliency of disadvantaged schools. These align with SBM funding objectives targeting institutional strengthening.",
wr:[{l:"A",r:"Printing NAT reviewers (III) and sponsoring field trips (IV) are not standard eligible SBM fund activities."},{l:"B",r:"Hiring/payment of salaries (II), printing reviewers (III), and sponsoring trips (IV) are not eligible."},{l:"D",r:"Hiring and payment of salaries (II) is not eligible for SBM funds. Personnel costs are covered by regular DepEd budget."}]}},

{q:"A school head assigned a teacher to lead one of the school project teams to address a Priority Improvement Area in the next cycle of the School Improvement Plan (SIP). Since he/she is a neophyte team leader, what would be the initial action of the school head to support the teacher?",
c:[{t:"Show the teacher process flow of the program implementation.",x:0},{t:"Provide the teacher the opportunity to hone leadership skills independently.",x:0},{t:"Ensure the teacher\u2019s better understanding of the assigned program.",x:0},{t:"Capacitate the teacher on team leadership.",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"Since the teacher is a neophyte (beginner) team leader, the most critical initial support is building their team leadership capacity. Before understanding program specifics, they need foundational skills to lead a team effectively.",
wr:[{l:"A",r:"Process flow knowledge comes after leadership skills. Without leadership capacity, knowing the process alone is insufficient."},{l:"B",r:"Providing independence to a neophyte without first building capacity could lead to failure."},{l:"C",r:"Program understanding is secondary to having the leadership skills to manage a team."}]}},

{q:"Interim policy guidelines for assessment and grading in light of the basic education learning continuity plan are grounded on the principle that assessment should be holistic and authentic. How can a school head ensure that his/her teachers are following this principle?",
c:[{t:"By religiously checking the teachers\u2019 weekly home learning plan.",x:0},{t:"By interviewing the parents about different assessments given by the teachers.",x:0},{t:"By checking the congruency of the learning objectives and learning assessment.",x:0},{t:"By conducting LAC sessions on different learning assessments.",x:1}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"Conducting LAC sessions on different learning assessments ensures teachers collectively understand and implement holistic and authentic assessment. LAC sessions provide collaborative professional development where teachers can align their assessment practices with policy guidelines.",
wr:[{l:"A",r:"Checking weekly plans monitors compliance but does not build understanding of holistic assessment principles."},{l:"B",r:"Interviewing parents provides external feedback but does not ensure teachers understand the principles."},{l:"C",r:"Checking congruency identifies gaps but does not address them through professional development."}]}},

{q:"What are the mandatory requirements in applying for a permanent senior high school teacher position?\n\nI. CSC Form 212, revised 2005\nII. National Bureau of Investigation (NBI) clearance\nIII. Certified photocopy of ratings obtained in the Licensure Examination for Teachers\nIV. Omnibus certification of authenticity and veracity of all documents submitted and signed by the applicant\nV. Certified photocopy of transcript of records with at least 15 units of specialization in relevant strand/specialized subject",
c:[{t:"I, II, III",x:0},{t:"I, II, IV",x:1},{t:"I, III, V",x:0},{t:"I, III, IV",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"Mandatory requirements include: (I) CSC Form 212 (Personal Data Sheet), (II) NBI clearance, and (IV) Omnibus certification of authenticity signed by the applicant. These are standard documentary requirements under DepEd hiring guidelines.",
wr:[{l:"A",r:"Certified photocopy of LET ratings (III) is not among the mandatory requirements for SHS teacher positions."},{l:"C",r:"LET ratings (III) and transcript with 15 units (V) are not listed as mandatory documentary requirements."},{l:"D",r:"While I and IV are correct, LET ratings (III) is not a mandatory requirement in the specific hiring guidelines."}]}},

{q:"The Civil Service Commission (CSC) sets guidelines in institutionalizing the Program to Institutionalize Meritocracy and Excellence in Human Resource Management. One of the enhanced maturity level indicators is the integration of the Equal Opportunity Principle (EOP) in four areas of the human resource system. How will a school head be able to best concretize and contextualize the EOP in performance management in his/her school?\n\nI. Involve all school-based personnel in four cycles of performance management.\nII. Allow teachers with spouses who are expecting to give birth to adjust in their targets.\nIII. Exempt the retiring teachers from setting targets considering their impending retirement from service.\nIV. Allow teachers with disabilities to set targets at their own convenience in consideration of their limitations.\nV. Allow nursing mothers to render six hours of service as part of the flexible working hours.\nVI. Allow pregnant teachers who are expecting to give birth during the performance period to have their targets adjusted.",
c:[{t:"III, IV, and V",x:0},{t:"I, III, and VI",x:0},{t:"I, II, and VI",x:1},{t:"III, V, and VI",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"EOP in performance management is best concretized through: (I) Involving ALL personnel in performance cycles \u2014 equal participation; (II) Allowing target adjustments for teachers whose spouses are expecting \u2014 recognizing family circumstances; (VI) Allowing pregnant teachers to adjust targets \u2014 gender-responsive accommodation.",
wr:[{l:"A",r:"Exempting retiring teachers (III) undermines equal participation. Targets \u201Cat their own convenience\u201D (IV) is vague."},{l:"B",r:"Exempting retiring teachers (III) from targets contradicts the EOP principle of equal participation."},{l:"D",r:"Exempting retiring teachers (III) contradicts EOP. The combination also misses the foundational requirement of involving all personnel (I)."}]}},

{q:"As part of performance management, the school head ensures that appropriate interventions are in place to guarantee high impact and result in employee development. The principle of the 70-20-10 Learning Model is used where 70% of the learning is through experience, 20% through others, and 10% through structural courses and programs. How can a school head apply the 70-20-10 Learning Model to improve his/her competencies/skills and those of his/her teachers?",
c:[{t:"Delegating the committee chairmanship to his teacher, letting the secretary prepare the memorandum, and asking a senior teacher to attend an executive meeting on his behalf.",x:0},{t:"Following the procurement process in school bidding activities, getting advice on the content of the School Report Card and participating in a seminar-workshop.",x:1},{t:"Asking for guidance on handling administrative complaints, participating in learning action cells, and undertaking mentoring on school-based action research.",x:0},{t:"Writing a memorandum guided by the Manual of Style learned in a workshop, deciding on a bullying incident, and getting 360\u00b0 feedback from experts.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The 70-20-10 Learning Model: 70% Experiential (from experience), 20% Social (from others), 10% Formal (structured courses). Option B correctly maps: following procurement process (70% experience), getting advice on SRC (20% from others), participating in a seminar-workshop (10% formal).",
wr:[{l:"A",r:"This describes delegation, not learning model application. Delegating work does not constitute experiential learning."},{l:"C",r:"All three activities fall primarily under social learning (20%). It does not properly represent the 70% experiential and 10% formal components."},{l:"D",r:"The activities do not clearly map to the 70-20-10 proportions. Writing guided by a workshop blends formal and experiential."}]}},

{q:"To ensure the realization and continuity of Oplan Kalusugan sa DepEd (OK sa DepEd), each of the levels of the Department has roles and responsibilities to perform. Which of the following is under the school\u2019s responsibility?\n\nI. Creation of Technical Working Group (TWG)\nII. Preparation of Implementation Plan\nIII. Provision of Technical Assistance\nIV. Identification and Preparation of Needed Resources\nV. Mobilization of Teachers, Parents, Community Members, Partners, and Stakeholders\nVI. Consolidation of Required Reports",
c:[{t:"I, IV, V",x:1},{t:"I, III, V",x:0},{t:"II, III, VI",x:0},{t:"II, IV, VI",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"School-level responsibilities under OK sa DepEd include: (I) Creation of TWG, (IV) Identification and preparation of resources, and (V) Mobilization of stakeholders to support the program.",
wr:[{l:"B",r:"Provision of Technical Assistance (III) is typically a division or regional office responsibility."},{l:"C",r:"Preparation of Implementation Plan (II) and Consolidation of Reports (VI) are higher-level responsibilities."},{l:"D",r:"While IV is correct, items II and VI are not school-level responsibilities under OK sa DepEd."}]}},

{q:"Student diversity requires teachers to consider individual differences in the preparation and implementation of the lesson. Which of the following will make the lesson more efficient and relevant to all students?\n\nI. Merging of competencies\nII. Localization of curriculum\nIII. Curriculum contextualization\nIV. Deepening curriculum contextualization through indigenization\nV. Unpacking of competencies",
c:[{t:"II, III, and IV",x:1},{t:"I and V",x:0},{t:"I, III, and V",x:0},{t:"II, III, IV and V",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"To address student diversity: (II) Localization \u2014 adapting content to local context; (III) Contextualization \u2014 making content relevant to learners\u2019 experiences; (IV) Indigenization \u2014 integrating indigenous knowledge. These ensure culturally responsive lessons.",
wr:[{l:"B",r:"Merging (I) and unpacking (V) competencies are curriculum development techniques that address competency organization, not student diversity."},{l:"C",r:"Merging (I) and unpacking (V) are technical curriculum processes, not strategies for making lessons relevant to diverse students."},{l:"D",r:"While II, III, and IV are correct, unpacking (V) addresses scope, not diversity responsiveness."}]}},

{q:"Establishing a strong partnership with stakeholders is key to earning their support for the different school programs and projects.\n\nWhat should a newly-designated school head do as an initial step to earn the trust of local leaders in the community where the school is located?",
c:[{t:"Attend the local school board meeting and present the school interventions for the identified priority areas in the school.",x:0},{t:"Make a courtesy call with the barangay captain and other barangay officials and present to them the plans and programs for school improvement.",x:1},{t:"Send a copy of the PTA resolution to the barangay captain in appreciation of his/her acceptance of the school head\u2019s designation.",x:0},{t:"Initiate a school program and invite the barangay captain and other barangay officials for the presentation of programs and plans for school improvement.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"Making a courtesy call to the barangay captain and officials is the most appropriate initial step. It demonstrates respect, builds personal rapport, and introduces the school head\u2019s vision. In Filipino culture, pakikipagkilala is essential for establishing trust with local leaders.",
wr:[{l:"A",r:"Presenting at the school board meeting is important but not the initial step. Personal rapport should come first."},{l:"C",r:"Sending a PTA resolution is formal but impersonal. It does not establish the personal connection needed."},{l:"D",r:"Initiating programs is premature. Relationships should be established through courtesy calls first."}]}}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml='';
if(q.img==='IMG44') imgHtml='<img class="q-img" src="'+IMG44T+'" alt="KPI Table"><img class="q-img" src="'+IMG44F+'" alt="Process Flowcharts">';
if(q.img==='IMG46') imgHtml='<img class="q-img" src="'+IMG46+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}
var r=document.getElementById('resultsArea');
r.innerHTML='<div class="trophy">'+em+'</div><div class="score-number" style="color:'+(p>=75?'var(--green)':p>=60?'var(--amber)':'var(--red)')+'" id="sn">0%</div><div class="score-subtitle">'+cor+' out of '+Q.length+' correct</div><div class="stat-boxes"><div class="stat-box green-tint"><div class="stat-box-num" style="color:var(--green)">'+cor+'</div><div class="stat-box-label">Correct</div></div><div class="stat-box red-tint"><div class="stat-box-num" style="color:var(--red)">'+wrn+'</div><div class="stat-box-label">Wrong</div></div><div class="stat-box accent-tint"><div class="stat-box-num" style="color:var(--accent)">'+p+'%</div><div class="stat-box-label">Score</div></div></div><div class="perf-pill '+bc+'">'+band+'</div><div class="motiv-msg">'+msg+'</div><div class="results-actions"><button class="btn-outline" onclick="restart()">\u21ba Restart This Set</button><button class="btn-filled" onclick="window.location.href=\'nash-04.html\'">Proceed to Set 4 \u2192</button></div>';
r.classList.add('show');
var c=0,el=document.getElementById('sn');var iv=setInterval(function(){c++;el.textContent=c+'%';if(c>=p)clearInterval(iv);},20);launchP();
}
function restart(){cur=0;cor=0;wrn=0;ans=false;document.getElementById('pCor').textContent=0;document.getElementById('pWrn').textContent=0;document.getElementById('pPct').textContent=0;document.getElementById('pFill').style.width='0%';var r=document.getElementById('resultsArea');r.classList.remove('show');r.innerHTML='';document.getElementById('quizArea').classList.remove('hidden');render();}
function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(56,132,122,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
render();
</script>
