<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 6 of 7 | Sapphire Sovereign</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#030814;--bg-mid:#060f20;--bg-end:#020610;--accent:#2060c0;--accent2:#4090e8;--accent-glow:rgba(32,96,192,0.30);--card-bg:rgba(6,15,32,0.85);--text-primary:#c0d8f8;--text-secondary:#6080a0;--border-glow:rgba(32,96,192,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(32,96,192,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:820px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(32,96,192,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(32,96,192,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(32,96,192,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(32,96,192,0.4);background:rgba(32,96,192,0.30);box-shadow:0 0 20px rgba(32,96,192,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(32,96,192,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(32,96,192,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(32,96,192,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(32,96,192,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#fff}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(32,96,192,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:820px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(32,96,192,0.4);background:rgba(32,96,192,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#fff;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

{q:"To be able to foster an enabling and supportive environment for learners, a school head encouraged his staff to work on their School-Based Management (SBM) practices. Which of the following premises will encourage his/her staff to start working on their SBM?\n\nI. Schools can exist at the mercy of the community.\nII. Community linkages should be prioritized for a supportive environment.\nIII. Schools should be ready to link with the community to facilitate infrastructure projects.\nIV. School partnership is essential for the creation and improvement of the learning environment.\nV. School\u2019s rapport with the community can lead to improved student achievement.\nVI. School achievement or success depends only on the school staff.",
c:[{t:"I, II, III",x:0},{t:"I, II, VI",x:0},{t:"II, III, IV",x:0},{t:"III, IV, V",x:1}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"SBM emphasizes school-community partnership, shared responsibility, and collaborative improvement. The correct premises are: (III) Schools linking with community for infrastructure, (IV) Partnership essential for learning environment, and (V) Community rapport leading to improved achievement. These reflect genuine SBM principles.",
wr:[{l:"A",r:"\u201CSchools exist at the mercy of the community\u201D (I) is a negative framing that contradicts SBM\u2019s principle of partnership and shared governance."},{l:"B",r:"Statement I is negative and VI (\u201Csuccess depends only on school staff\u201D) directly contradicts the SBM principle of shared responsibility with the community."},{l:"C",r:"While III and IV are correct, statement II (\u201Cprioritized for a supportive environment\u201D) is too narrow. SBM is about partnership for student achievement, not just a supportive environment."}]}},

{q:"Rewards and recognition programs encourage teaching and non-teaching personnel to perform their duties and responsibilities with utmost diligence. At the end of the school year, a recognition ceremony was held in a certain school. However, there is a group of teachers who challenged the qualifications of some awardees. What mechanism can the school head apply to resolve the issue?",
c:[{t:"The school should recognize all the personnel to avoid complaints.",x:0},{t:"The school should adopt locally crafted criteria that are validated by the stakeholders and communicated to the school personnel.",x:1},{t:"The school should adopt other schools\u2019 rewards and recognition criteria and align it with the school context.",x:0},{t:"The school should follow the division rewards and recognition criteria.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"Adopting locally crafted criteria that are validated by stakeholders and communicated to all personnel ensures transparency, ownership, and fairness. This participative approach prevents challenges because everyone understands and has agreed to the selection criteria beforehand.",
wr:[{l:"A",r:"Recognizing all personnel to avoid complaints defeats the purpose of recognition programs, which should reward exceptional performance."},{l:"C",r:"Adopting other schools\u2019 criteria may not fit the school\u2019s unique context and would lack local ownership and stakeholder validation."},{l:"D",r:"Division criteria provide a baseline but may not address school-specific needs. Locally crafted criteria with stakeholder validation are more effective and contextually appropriate."}]}},

{q:"DepEd Order No. 37, s. 2015 contains risk reduction and resilience education guidelines that integrate Disaster Risk Reduction Management (DRRM) in school curricula, extra-curricular or school activities and provide necessary material support. What actions operationalize this directive?\n\nI. Conduct capacity-building activities\nII. Preparation of Rapid Assessment and Damages Report (RADaR)\nIII. Allocation of funds for DRRM\nIV. Development of lesson exemplars on Education in Emergencies\nV. Establishment of rehabilitation centers",
c:[{t:"II and IV",x:0},{t:"I, III, and V",x:0},{t:"I, III, and IV",x:1},{t:"II and V",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"Actions that operationalize DRRM integration include: (I) Capacity-building activities for school personnel, (III) Allocating funds for DRRM implementation, and (IV) Developing lesson exemplars on Education in Emergencies. These directly support curriculum integration and preparedness.",
wr:[{l:"A",r:"RADaR (II) is a post-disaster reporting tool, not an operationalization of DRRM integration into curricula and activities."},{l:"B",r:"Establishing rehabilitation centers (V) is beyond the school\u2019s scope and not part of the school-level DRRM integration directive."},{l:"D",r:"RADaR (II) and rehabilitation centers (V) are reactive measures, not proactive operationalization of DRRM integration."}]}},

{q:"A teacher approached the school head as regards the lost School Form 10 of one of her learners in Grade 9. The teacher explained that she had searched all over her classroom and still could not find the missing document. What school record shall be used as an immediate substitute for the lost school form of the learner based on DepEd Order No. 54, s. 2016?",
c:[{t:"School Form 5",x:1},{t:"School Form 1",x:0},{t:"School Form 9",x:0},{t:"School Form 6",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"Under DepEd Order No. 54, s. 2016, School Form 5 (Report on Promotion and Level of Proficiency) serves as the immediate substitute for a lost School Form 10 (Learner\u2019s Permanent Academic Record). SF5 contains the learner\u2019s grades and promotion status, making it the most appropriate alternative record.",
wr:[{l:"B",r:"School Form 1 is the School Register, which contains enrollment data but not the detailed academic records needed to substitute for SF10."},{l:"C",r:"School Form 9 is the Learner\u2019s Progress Report Card given to parents, not an official school record that can substitute for the permanent academic record."},{l:"D",r:"School Form 6 is the Summary of Enrolment and other statistical data, not an individual learner\u2019s academic record."}]}},

{q:"A school head wanted to institutionalize the conduct of LAC seminars in the school. Which of the following are the roles and responsibilities that he/she should perform?\n\nI. Leads in organizing the LAC in ensuring that the practice of holding a regular seminar is established, maintained, and sustained.\nII. Facilitates and implements LACs within the school.\nIII. Provides administrative support and academic leadership to the LACs that will strengthen the school\u2019s development of professional learning communities.\nIV. Supports the school in establishing, maintaining, and sustaining their LAC practices.",
c:[{t:"I, II, III, and IV",x:0},{t:"IV only",x:0},{t:"II and III",x:0},{t:"I, II, III",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"The school head\u2019s roles in institutionalizing LAC include: (I) Leading the organization and ensuring sustainability, (II) Facilitating and implementing LACs, and (III) Providing administrative support and academic leadership. Statement IV describes the role of the Schools Division Office, not the school head.",
wr:[{l:"A",r:"Statement IV (\u201CSupports the school in establishing...\u201D) describes an external support role, typically that of the Division Office, not the school head who IS the school leader."},{l:"B",r:"IV alone describes the Division Office role, not the school head\u2019s role. The school head has a much more comprehensive set of responsibilities."},{l:"C",r:"While II and III are correct, this misses the crucial leadership role (I) of organizing and sustaining LAC practices."}]}},

{q:"A school head is assigned to a female-dominated school where 90% of the teachers and 85% of the learner population are females, with students belonging to different gender orientations. The school\u2019s Supreme Student Government president, who belongs to the LGBTQ community, won the presidential seat for the Federation of SSG Presidents. The parents, barangay officials, and the community also support the different school programs and activities. Recently, the school received an award for implementing outstanding GAD programs. What trait does the school head demonstrate?",
c:[{t:"Maintaining a solid connection with the community.",x:0},{t:"Actively advocating Gender and Development.",x:0},{t:"Showing commitment to implementing different programs and activities.",x:0},{t:"Providing equal opportunities for the learners, teachers, and stakeholders.",x:1}],
d:"Domain 5 \u2014 Building Connections",s:"5.3 Inclusive practice",
e:{w:"The scenario demonstrates a school where diverse gender orientations are respected, an LGBTQ student won a leadership position, and the school received a GAD award. The overarching trait is providing equal opportunities \u2014 ensuring that all learners, teachers, and stakeholders have fair access to participation and leadership regardless of gender.",
wr:[{l:"A",r:"While community connection exists, it is a result of the inclusive environment, not the primary trait demonstrated."},{l:"B",r:"GAD advocacy is present but is a specific program focus. The broader trait is providing equal opportunities across all dimensions, not just gender advocacy."},{l:"C",r:"Commitment to programs is evident but is too general. The specific trait demonstrated is the provision of equal opportunities in an inclusive environment."}]}},

{q:"A proficient teacher approached his/her school head to appeal for the final IPCRF rating she received. The teacher was expecting an outstanding (O) rating, not a very satisfactory (VS) one. What conclusions can the school head derive from the teacher\u2019s summary of rating for getting \u201CVS\u201D instead of \u201CO\u201D so that she can give the teacher the appropriate advice?",img:"IMG107",
c:[{t:"The teacher is actively involved in school activities, writes learning materials, and provides feedback on the learners\u2019 performance. He/she submits her reports on time. During classroom observation, the teacher utilizes a variety of instructional materials and resources but is not able to maximize them and shows very minimal integration with other disciplines.",x:1},{t:"The teacher utilizes effective teaching strategies in her WHLP/DLP and provides constructive criticism on the learners\u2019 activities. He/she sustains engagement with parents and the wider community and attends training and other school activities but performs poorly when observed by the rater.",x:0},{t:"The teacher excels in community linkages, professional engagement, personal growth, and professional development. He/she writes an impressive WHLP/DLP and prepares excellent PowerPoint presentations but makes a lot of errors in the content during observation.",x:0},{t:"The teacher performs various related tasks that contribute to the teaching-learning process, but he/she is unable to prepare for her classroom observation schedule.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The RPMS rating table shows: COT-requiring indicators (1,5,7) scored 3 on the 5-point scale, non-COT indicators (2,3,4,6) scored 4, and non-classroom indicators (8-12) scored 5. This pattern shows the teacher excels in non-classroom duties but underperforms during classroom observation. Option A correctly describes this pattern: active in school activities and timely reports (high non-classroom scores) but unable to maximize materials and minimal integration during observation (lower COT scores).",
wr:[{l:"B",r:"This describes a teacher who performs poorly during observation, but the data shows the teacher scored 3 (not failing) on COT indicators. The description is too extreme."},{l:"C",r:"This describes content errors during observation, but the rating pattern shows the issue is about maximizing materials and integration, not content errors."},{l:"D",r:"This describes inability to prepare for observation, but the data shows the teacher does participate in observation (scored 3), just at a lower level than other indicators."}]}},

{q:"Which of the following teachers\u2019 reflections give a school head a view of the students\u2019 progress for the current week\u2019s lesson?",
c:[{t:"3 out of 30 students need remediation classes",x:0},{t:"27 out of 30 students earned 80% and above in the evaluation",x:1},{t:"5 out of 30 students caught up with the required remediation",x:0},{t:"1 out of 30 students was observed to have a problem with their vision",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"A good reflection showing students\u2019 progress should include: learner achievement in the lesson, extent of mastery of the competency, and evidence from assessment results. \u201C27 out of 30 students earned 80% and above\u201D directly shows achievement data for the current week\u2019s lesson.",
wr:[{l:"A",r:"Identifying students needing remediation is useful but focuses on the minority who struggled rather than showing overall progress for the week\u2019s lesson."},{l:"C",r:"Students catching up with remediation refers to past lessons, not current week\u2019s progress."},{l:"D",r:"A vision problem is a health observation, not a reflection on students\u2019 academic progress for the current lesson."}]}},

{q:"Dissemination and utilization of research results are crucial in achieving learning outcomes and improving teaching, learning, and school governance. What mechanisms can a school head allow teacher-researchers to disseminate and utilize their research result?\n\nI. Learning Action Cell\nII. In-Service Training\nIII. School Implementation Plan\nIV. School Governing Council\nV. School Registration Card\nVI. Annual Improvement Plan",
c:[{t:"III, IV, and V",x:0},{t:"I, II and III",x:0},{t:"IV, V and VI",x:0},{t:"I, II, and IV",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.2 Professional reflection and learning",
e:{w:"Effective mechanisms for research dissemination include: (I) Learning Action Cell \u2014 collaborative platform for sharing research findings with peers, (II) In-Service Training \u2014 structured sessions to present research-based innovations, and (IV) School Governing Council \u2014 governance body where research results can inform policy decisions.",
wr:[{l:"A",r:"School Implementation Plan (III) and School Registration Card (V) are documents, not dissemination mechanisms. They do not provide platforms for sharing research."},{l:"B",r:"While I and II are correct, the School Implementation Plan (III) is a planning document, not a dissemination mechanism."},{l:"C",r:"School Registration Card (V) and Annual Improvement Plan (VI) are administrative documents, not platforms for research dissemination."}]}},

{q:"During a school-based monitoring visit, Principal Marlon Reyes observes four teachers in different classrooms. He takes note of their teaching styles, classroom management, and professional behavior.\n\nTeacher A frequently misses deadlines, avoids professional development activities, and shows little interest in student outcomes.\n\nTeacher B delivers lessons but often loses track of objectives and struggles with classroom control.\n\nTeacher C uses data to guide instruction, reflects on teaching practices, and collaborates with peers to improve learning.\n\nTeacher D has stopped attending classes altogether and has not submitted any teaching reports for months.\n\nPrincipal Reyes wants to classify each teacher based on observed traits.\n\nWhich of the following classifications best matches the teachers described?",
c:[{t:"Teacher A is dropout, Teacher B is unfocused, Teacher C is analytical, Teacher D is professional.",x:0},{t:"Teacher A is unfocused, Teacher B is dropout, Teacher C is professional, Teacher D is analytical.",x:0},{t:"Teacher A is unfocused, Teacher B is analytical, Teacher C is professional, Teacher D is dropout.",x:1},{t:"Teacher A is dropout, Teacher B is unfocused, Teacher C is professional, Teacher D is dropout.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"Based on observed behaviors: Teacher A (misses deadlines, avoids PD, disinterested) = unfocused; Teacher B (loses track of objectives, struggles with control) = analytical (tries but lacks focus and management skills); Teacher C (data-driven, reflective, collaborative) = professional; Teacher D (absent, no reports) = dropout.",
wr:[{l:"A",r:"Teacher A is not a dropout \u2014 they still attend but are disengaged. Teacher D who has stopped attending entirely is the actual dropout."},{l:"B",r:"Teacher A and B classifications are reversed. Teacher A\u2019s disengagement makes them unfocused, not Teacher B who actually delivers lessons."},{l:"D",r:"While Teacher D is correctly identified as dropout, having two teachers classified as \u201Cdropout\u201D doesn\u2019t match the distinct behavioral profiles described."}]}},

{q:"Literacy among children and youth is considered as one of the key factors that determine how well a country progresses in this rapidly changing world. At the school level, the support of teachers, parents, and the positive attitude of learners towards a literacy program like Brigada Pagbasa can promote quality learning outcomes, and eventually lead to the development of learners\u2019 potential. However, schools must also involve external stakeholders to ensure the success of the program. How can a school head convince external stakeholders like industries and businesses to support the implementation of Brigada Pagbasa?",
c:[{t:"Invite stakeholders to the school\u2019s Reading Festival to witness how the program is being implemented.",x:0},{t:"Present to the external stakeholders the school\u2019s annual accomplishment report in the School Reading Program.",x:0},{t:"Share success stories of learner-beneficiaries of the previous school year\u2019s Reading Program who, after graduation, have become employees of nearby industries and business establishments.",x:1},{t:"Encourage the internal stakeholders to patronize the products of the industries and nearby business establishments in exchange for their support of the school\u2019s Brigada Pagbasa Program.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"Sharing success stories of program beneficiaries who became employees of nearby industries creates a compelling, tangible connection between the reading program and the stakeholders\u2019 interests. Industries and businesses see the direct return on investment \u2014 literate graduates becoming productive employees \u2014 making them more likely to support the program.",
wr:[{l:"A",r:"Inviting stakeholders to witness implementation shows the program but does not connect it to their business interests or demonstrate tangible outcomes."},{l:"B",r:"Presenting accomplishment reports is informational but may not resonate with business stakeholders who want to see practical, employment-related outcomes."},{l:"D",r:"Exchanging patronage for support is transactional and potentially inappropriate. It does not build genuine partnership based on shared educational goals."}]}},

{q:"A constructivist classroom fosters critical thinking, flexibility, creativity, active learning, and more. Who among the following teachers promotes a 21st-century classroom and deserves to be tapped on demonstration teaching in the Learning Action Cell (LAC) session?",
c:[{t:"Mr. T, a grade 9 Mathematics teacher, allows learners to pair with a buddy to solve a math problem.",x:0},{t:"Mrs. S, a grade 11 Literature teacher, encourages students to use a variety of modalities to convey understanding.",x:1},{t:"Mrs. R, a grade 10 English teacher, presents her lessons using short video clips and slide presentations.",x:0},{t:"Mrs. Q, a grade 8 Science teacher, focuses on covering the content; thus, skills are learned out of context.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"Mrs. S encourages students to use a variety of modalities to convey understanding, which embodies constructivist principles: student-centered learning, multiple representations of knowledge, creativity, and active engagement. This reflects 21st-century skills of communication, creativity, and critical thinking.",
wr:[{l:"A",r:"Buddy pairing for problem-solving is collaborative but limited to one modality. A 21st-century classroom encourages multiple modalities and creative expression."},{l:"C",r:"Using video clips and slides makes the teacher the content presenter, not the students. This is teacher-centered technology use, not constructivist student-centered learning."},{l:"D",r:"Focusing on content coverage with skills learned out of context is the opposite of constructivism. It represents a traditional, content-driven approach."}]}},

{q:"Rapport with key stakeholders could be one source of job satisfaction among school leaders. Which of the following actions show good rapport?\n\nI. Assist the school community in sourcing funds for health-related needs of the school.\nII. Willingly take part in the school\u2019s maintenance week.\nIII. Provide professional development for teachers.\nIV. Be available in terms of urgent activities that need stakeholders\u2019 participation.\nV. Extend technical assistance to teachers in terms of teaching pedagogies.\nVI. Lead school efforts for beautification of areas.",
c:[{t:"I, II, III",x:0},{t:"II, III, V",x:0},{t:"I, II, IV",x:1},{t:"III, V, VI",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.1 Management of diverse relationships",
e:{w:"Good rapport with stakeholders is demonstrated through: (I) Assisting in sourcing funds for health needs \u2014 shows partnership; (II) Willingly participating in maintenance week \u2014 shows commitment; (IV) Being available for urgent stakeholder activities \u2014 shows responsiveness and reliability.",
wr:[{l:"A",r:"Professional development (III) is an internal school function, not a demonstration of rapport with external stakeholders."},{l:"B",r:"Professional development (III) and technical assistance (V) are internal teaching improvement activities, not stakeholder rapport indicators."},{l:"D",r:"Professional development (III), pedagogical assistance (V), and beautification (VI) are school management functions, not specifically stakeholder rapport actions."}]}},

{q:"A newly appointed school head reviewed the professional development records of teachers in preparation for implementing the Enhanced Career Progression System for Teachers (ECPS) and strengthening the Teacher Induction Program (TIP) for beginning teachers. Based on the Teacher Development Monitoring Report, what should the school head prioritize?",img:"IMG114",
c:[{t:"Require beginning teachers to complete the remaining TIP modules independently.",x:0},{t:"Assign highly proficient teachers to mentor beginning teachers and support their completion of the Teacher Induction Program.",x:1},{t:"Encourage proficient teachers to apply immediately for promotion under the ECPS.",x:0},{t:"Request the Schools Division Office to conduct another Teacher Induction Program orientation.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"When the item mentions Teacher Induction Program or beginning teachers, the best answer often includes: Mentoring + professional collaboration + support from experienced teachers. The table shows highly proficient teachers serving as master teachers but not yet mentoring beginners. Assigning them to mentor beginning teachers leverages existing expertise while addressing the TIP completion gap.",
wr:[{l:"A",r:"Requiring independent completion isolates beginning teachers who need guided support. The TIP is designed to be collaborative, not self-directed."},{l:"C",r:"Encouraging promotion focuses on career advancement rather than the immediate development need of supporting beginning teachers through TIP."},{l:"D",r:"Requesting another orientation repeats an activity rather than addressing the root issue: the need for sustained mentoring and support for beginning teachers."}]}},

{q:"A school is celebrating its 5th Founding Anniversary. The school head wants to have the school stage and the venue be uniquely decorated, as well as address other preparations. He/she plans to organize different committees relevant to the undertaking. How can the school head encourage immediate involvement from the stakeholders?",
c:[{t:"Request logistics from the local government unit through the Committee on Education Chair.",x:0},{t:"Call for a mini-conference with internal and external stakeholders to formulate a plan of action for the activity.",x:1},{t:"Assign the stage decoration to the student artists through the guidance of the Arts Adviser.",x:0},{t:"Send invitations to selected local partners in the community for information and possible fund assistance.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"Calling a mini-conference with internal and external stakeholders provides immediate, collaborative involvement in planning. It engages stakeholders from the start, creates shared ownership of the activity, and allows for coordinated action planning \u2014 the most effective way to mobilize stakeholder participation quickly.",
wr:[{l:"A",r:"Requesting logistics through a specific channel is a resource-seeking action, not stakeholder involvement in planning and preparation."},{l:"C",r:"Assigning decoration to students is task delegation within the school, not stakeholder involvement from the broader community."},{l:"D",r:"Sending invitations for information and funding is a one-way communication that does not encourage immediate active involvement in planning."}]}},

{q:"During a post-conference, the school head validated that the teacher indeed used identical strategies for two groups of learners, which caused most learners from one group to get bored with the lesson. Applying the coaching principle, the school head was able to motivate the teacher to reflect on his/her professional development needs and craft an action plan to address the performance gap. They further agreed to have a follow-up observation. Which of the following contributes to the effective implementation of the teacher\u2019s action plan?\n\nI. It allows the teacher to compare her performance with those of other teachers.\nII. It reinforces the improved habit and behavior of the teacher.\nIII. It helps the teacher to stay accountable, motivated and focused.\nIV. It ensures the attainment of a high-performance rating.\nV. It prevents setbacks from further occurring.\nVI. It reminds the teacher about the goals and the importance of achieving them.",
c:[{t:"I, II, IV",x:0},{t:"I, IV, V",x:0},{t:"II, III, IV",x:0},{t:"II, III, VI",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"Effective follow-up implementation is supported by: (II) Reinforcing improved habits and behavior, (III) Helping the teacher stay accountable, motivated, and focused, and (VI) Reminding the teacher about goals and their importance. These three create a supportive accountability framework.",
wr:[{l:"A",r:"Comparing with other teachers (I) is competitive, not developmental. Ensuring high ratings (IV) focuses on scores rather than genuine improvement."},{l:"B",r:"Comparing with others (I) and ensuring high ratings (IV) are extrinsic motivators. Preventing setbacks (V) is reactive rather than proactive."},{l:"C",r:"While II and III are correct, ensuring high-performance rating (IV) shifts the focus from professional growth to rating attainment."}]}},

{q:"The implementation of a supplementary feeding program reaches out to severely wasted learners in schools, emphasizing the significance of health and nutrition to learning outcomes. In a school-managed canteen, what percentage of the net income shall be utilized for the feeding program?",
c:[{t:"35%",x:1},{t:"25%",x:0},{t:"10%",x:0},{t:"5%",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"Under DepEd guidelines on school canteen management, 35% of the net income from school-managed canteens shall be allocated for the feeding program. This ensures a significant portion of canteen earnings directly supports the nutritional needs of learners.",
wr:[{l:"B",r:"25% is not the prescribed allocation for feeding programs under DepEd canteen guidelines."},{l:"C",r:"10% is significantly lower than the mandated allocation for feeding programs."},{l:"D",r:"5% is far below the required percentage for feeding program allocation from canteen income."}]}},

{q:"A group of learners got involved in a fight during class hours, and one was injured. How will the school head inform the parent of the injured learner if the phone is unattended?",
c:[{t:"Write a note to be delivered by the Guidance Counselor Designate to the parent after class hours.",x:0},{t:"Send a learner who is a relative of the injured learner to call the parent.",x:0},{t:"Call the Barangay Kagawad to inform the parent.",x:1},{t:"Text the salient details of the incident to the parent and wait for a reply.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.4 Communication",
e:{w:"In a situation where a student is injured and a parent cannot be reached directly, calling the Barangay Kagawad (Council Member) is the most appropriate action. The barangay serves as the smallest political unit and has a direct, often personal, link to the residents. This is the most reliable and protocol-driven method for reaching the parent.",
wr:[{l:"A",r:"Delivering a note after class hours delays notification of an injury that requires immediate parental awareness. The urgency of the situation demands faster action."},{l:"B",r:"Sending a learner to call the parent is inappropriate as it uses a student as a messenger for an official school matter involving an injury."},{l:"D",r:"Texting details and waiting for a reply is passive. The situation requires proactive, immediate notification through a reliable community channel."}]}},

{q:"As a mechanism to ensure learning continuity during the COVID-19 pandemic, DepEd released the Most Essential Learning Competencies (MELCs) to meet the challenges of the pandemic to respond to the call of Sustainable Development Goal (SDG) 4. Which of the following actions exemplify setting achievable learning outcomes?",
c:[{t:"Compressing the standards set by the K to 12 curriculum guides.",x:0},{t:"Addressing the instructional needs of learners while ensuring that curriculum standards are achieved.",x:1},{t:"Providing interventions to learners experiencing difficulty in answering self-learning modules.",x:0},{t:"Converting classroom-oriented learning resources to adapt to distance learning.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"Setting achievable learning outcomes means addressing instructional needs while still ensuring curriculum standards are met. The MELCs focus on the most essential competencies that learners must achieve, maintaining quality standards while being realistic about what can be accomplished during the pandemic.",
wr:[{l:"A",r:"Compressing standards implies reducing quality. The MELCs prioritize essential competencies rather than compressing all standards into a shorter period."},{l:"C",r:"Providing interventions for struggling learners is a support strategy, not an example of setting achievable learning outcomes."},{l:"D",r:"Converting resources to distance learning format is an adaptation strategy for delivery, not specifically about setting achievable learning outcomes."}]}},

{q:"The Special Education (SPED) support fund downloaded to the school shall be used to support the educational services of learners with disabilities/difficulties (LWDs). Which of the following are eligible expenses?\n\nI. Formal assessment or rehabilitation of LWDs by medical or allied medical specialists\nII. Acquisition of specialized materials, devices, and equipment intended for instructional purposes of LWDs without threshold\nIII. Development of learning materials for LWDs\nIV. Attendance of SPED and receiving teachers in specialized training on inclusive education conducted by NEAP-accredited providers.\nV. Communication expenses of SPED implementors",
c:[{t:"I, and II",x:0},{t:"II, and III",x:0},{t:"I, III, and IV",x:0},{t:"I, IV, and V",x:1}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"Eligible SPED support fund expenses include: (I) Formal assessment or rehabilitation by specialists, (IV) Attendance in specialized NEAP-accredited training for SPED and receiving teachers, and (V) Communication expenses of SPED implementors. These are specifically covered under SPED fund guidelines.",
wr:[{l:"A",r:"While I is correct, acquisition of materials without threshold (II) is not accurately stated \u2014 SPED fund expenditures have specific guidelines and thresholds."},{l:"B",r:"Neither II nor III are among the primary eligible expenses. Development of materials (III) may be covered under other funding sources."},{l:"C",r:"While I and IV are correct, development of learning materials (III) is not specifically listed among the primary SPED fund eligible expenses."}]}}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml='';
if(q.img==='IMG107') imgHtml='<img class="q-img" src="'+IMG107+'" alt="Data Table">';
if(q.img==='IMG114') imgHtml='<img class="q-img" src="'+IMG114+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}

function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(32,96,192,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
