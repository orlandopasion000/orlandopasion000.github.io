<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 2 of 7 | Titanium Fortress</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#080c12;--bg-mid:#0e1520;--bg-end:#060a10;--accent:#4a6a8e;--accent2:#6a8ab0;--accent-glow:rgba(74,106,142,0.30);--card-bg:rgba(14,21,32,0.85);--text-primary:#b8cce0;--text-secondary:#8aa0b8;--border-glow:rgba(74,106,142,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(74,106,142,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:1080px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(74,106,142,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(74,106,142,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(74,106,142,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(74,106,142,0.4);background:rgba(74,106,142,0.30);box-shadow:0 0 20px rgba(74,106,142,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(74,106,142,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(74,106,142,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(74,106,142,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(74,106,142,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#fff}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(74,106,142,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:1080px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(74,106,142,0.4);background:rgba(74,106,142,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#fff;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

{q:"During a classroom observation, while a teacher is animatedly explaining the lesson, the school head notices a slight commotion and murmuring among his/her learners. One of the learners raises a hand and complains about her confusion about the topic the teacher is discussing. What actions should the school head recommend for the teacher to do before delivering the lesson?\n\nI. Cite the learning objectives.\nII. Introduce the lesson.\nIII. Discuss the topic as a whole.\nIV. Use graphic organizers.\nV. Administer a short quiz.",
c:[{t:"II, III, IV",x:0},{t:"I, II, III, IV",x:1},{t:"II, III, V",x:0},{t:"I, II, III, V",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"The recommended actions before delivering a lesson include: (I) Cite the learning objectives to set direction, (II) Introduce the lesson to provide context, (III) Discuss the topic as a whole to give an overview, and (IV) Use graphic organizers to help learners visualize connections. These four steps create a comprehensive pre-lesson framework that prevents confusion.",
wr:[{l:"A",r:"Missing the citation of learning objectives (I) leaves students without a clear sense of what they are expected to learn, which contributes to the confusion observed."},{l:"C",r:"Administering a short quiz (V) before delivering the lesson is premature \u2014 the purpose is to prepare learners for the lesson, not assess them. Also missing learning objectives (I)."},{l:"D",r:"While I, II, and III are correct, administering a short quiz (V) is not appropriate before lesson delivery. Graphic organizers (IV) are more effective for pre-lesson preparation."}]}},

{q:"Research on DepEd\u2019s readiness for distance learning, specifically ICT investment, ICT maturity, and digital economic performance, placed the Philippines in the 59th rank out of 79 nations and is categorized as a \u201CStarter.\u201D The research was published by Huawei for the 2020 Global Connectivity Index. Based on the findings, which of the following proposals from the school head has a higher probability of being supported by potential partners?",
c:[{t:"Allocating funds to support DepEd Computerization Program",x:0},{t:"Providing technical assistance and capacity building on Digital Literacy for teachers and students",x:1},{t:"Focusing school-based management on digital technological development and innovations",x:0},{t:"Establishing technology-based education towards digitization and sustainable development",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"The key context is that the Philippines is categorized as a \u201CStarter\u201D in ICT readiness (Huawei Global Connectivity Index). This implies limited ICT maturity, meaning that capacity building and foundational skills development are the most urgent needs. Development partners commonly support digital literacy and capacity-building initiatives, making Option B the most feasible and attractive proposal.",
wr:[{l:"A",r:"Allocating funds for the Computerization Program is a government-level intervention, not something a school head would propose to external partners."},{l:"C",r:"Focusing SBM on digital technological development is too broad and ambitious for a \u201CStarter\u201D country. Partners prefer targeted, achievable interventions."},{l:"D",r:"Establishing technology-based education is a long-term systemic goal that exceeds what a school-level proposal can realistically deliver or what partners would fund at the school level."}]}},

{q:"A teacher shows an application of the cognitive process dimension in the conduct of the lesson. Which set of chronologically arranged learning assessment activities reflects this dimension?",
c:[{t:"Explaining concepts, listing facts, executing work, differentiating ideas, measuring data, and designing products.",x:0},{t:"Memorizing concepts, providing outputs, assembling projects, dramatizing scenarios, outlining information, and identifying solutions.",x:0},{t:"Listing facts, comparing ideas, solving problems, comparing data, evaluating outputs, and generating products.",x:1},{t:"Outlining information, repeating facts, explaining data, differentiating actions, designing products, and interpreting graphs.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.3 Assessment and reporting",
e:{w:"The cognitive process dimension follows Bloom\u2019s Revised Taxonomy in order: Remember, Understand, Apply, Analyze, Evaluate, Create. Option C matches this sequence: Listing facts (Remember) \u2192 Comparing ideas (Understand) \u2192 Solving problems (Apply) \u2192 Comparing data (Analyze) \u2192 Evaluating outputs (Evaluate) \u2192 Generating products (Create).",
wr:[{l:"A",r:"This sequence does not follow the correct chronological order of Bloom\u2019s taxonomy. Explaining (Understand) comes before listing (Remember), which reverses the first two levels."},{l:"B",r:"This set mixes activities from different cognitive levels without following the proper taxonomic order. Dramatizing and assembling do not align with the standard progression."},{l:"D",r:"This sequence is jumbled \u2014 repeating facts (Remember) comes after outlining (a higher-order skill), and the progression does not follow the taxonomic hierarchy."}]}},

{q:"The advent of digitalization presents new opportunities to prepare students to be lifelong learners. Still, the school is challenged by poor internet connection and unstructured learning spaces at home that may affect the teaching-learning process and academic achievement. What should the school head do to equip the learners with relevant skills in order to adapt to the economic and social changes despite the learners\u2019 environmental problems?",
c:[{t:"Integrate attitudes and values in the teaching-learning process using home-based online technology, acknowledging the contextualized competencies.",x:0},{t:"Integrate ethics in the teaching-learning process anchored to the contextualized competencies using technology and home-based learning materials.",x:0},{t:"Integrate attitude and values using the technology in the teaching-learning process anchored to the contextualized competencies.",x:0},{t:"Integrate attitudes and values in the teaching-learning process acknowledging contextualized competencies using the available home-based learning materials.",x:1}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"Given the constraints of poor internet and unstructured home learning spaces, the most appropriate approach uses \u201Cavailable home-based learning materials\u201D rather than technology-dependent solutions. This option acknowledges the reality of the learners\u2019 environment while still integrating attitudes, values, and contextualized competencies into the teaching-learning process.",
wr:[{l:"A",r:"This option relies on \u201Chome-based online technology,\u201D which contradicts the stated problem of poor internet connection."},{l:"B",r:"This option uses \u201Ctechnology and home-based learning materials,\u201D still relying on technology that the scenario identifies as a challenge."},{l:"C",r:"This option also centers on technology in the teaching-learning process, which is not feasible given the poor internet connectivity described in the scenario."}]}},

{q:"What would be the initial step of a school head in formulating the professional development plan for school personnel?",
c:[{t:"Give incentives/awards to employees with outstanding rating for the current school year.",x:0},{t:"Conduct a survey among learners on the performance of the teachers.",x:0},{t:"Identify the performance gaps among school personnel.",x:1},{t:"Look for a possible venue for the capacity building.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The initial step in formulating a professional development plan is to identify performance gaps. This is the diagnostic phase that determines what areas need improvement before any plans, programs, or logistics can be developed. Without knowing the gaps, any development activity would be directionless.",
wr:[{l:"A",r:"Giving incentives is a recognition activity that comes after performance evaluation, not at the beginning of development planning."},{l:"B",r:"Surveying learners about teacher performance may provide some data, but it is not the initial step in formulating a professional development plan. Gap analysis comes first."},{l:"D",r:"Looking for a venue is a logistical concern that comes much later in the planning process, after identifying needs and designing the program."}]}},

{q:"A teacher with six hours of actual classroom teaching and/or equivalent teaching-related activities and duties shall render the remaining two hours of work within or outside the school premises to comply with an eight-hour workday by engaging in teaching-related activities and duties. As a school head, which of the following activities are acceptable as teaching-related activities based on DepEd Memorandum No. 291, s. 2008?\n\nI. Preparation of lesson plan\nII. Development of assessment tool\nIII. Conduct of action research\nIV. Attendance to faculty club meetings\nV. Participation in religious activities\nVI. Accomplishment of graduate studies activities",
c:[{t:"I, IV, V",x:0},{t:"I, III, VI",x:0},{t:"I, II, III",x:1},{t:"IV, V, VI",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"Under DepEd Memorandum No. 291, s. 2008, acceptable teaching-related activities include: (I) Preparation of lesson plan, (II) Development of assessment tool, and (III) Conduct of action research. These are directly related to the teaching-learning process.",
wr:[{l:"A",r:"Faculty club meetings (IV) and religious activities (V) are not teaching-related activities under the memorandum."},{l:"B",r:"While I and III are correct, graduate studies activities (VI) are personal professional pursuits, not teaching-related activities covered under the two-hour provision."},{l:"D",r:"Faculty club meetings (IV), religious activities (V), and graduate studies (VI) are all non-teaching-related activities that do not qualify under the memorandum."}]}},

{q:"A school head quarterly monitors learning achievement to ensure that targets in the School\u2019s Annual Improvement and Work Financial Plans are attained.\n\nWhat is the most appropriate tool for monitoring the progress of the implementation of their programs, projects, and activities?",
c:[{t:"School Monitoring, Evaluation, and Assessment Tool",x:0},{t:"Monitoring, Evaluation, and Plan Adjustment Tool",x:0},{t:"School Monitoring, Evaluation, and Adjustment Tool",x:1},{t:"Project Monitoring Report Form",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"The School Monitoring, Evaluation, and Adjustment Tool (SMEAT) is the DepEd-prescribed instrument for monitoring the progress of programs, projects, and activities in the School Improvement Plan. It allows school heads to track implementation, evaluate effectiveness, and make necessary adjustments.",
wr:[{l:"A",r:"There is no official DepEd tool called \u201CSchool Monitoring, Evaluation, and Assessment Tool.\u201D The correct name includes \u201CAdjustment,\u201D not \u201CAssessment.\u201D"},{l:"B",r:"\u201CMonitoring, Evaluation, and Plan Adjustment Tool\u201D is not the official name. The correct tool specifically includes \u201CSchool\u201D at the beginning."},{l:"D",r:"The Project Monitoring Report Form is used for specific project tracking, not for the comprehensive monitoring of the School Improvement Plan\u2019s programs, projects, and activities."}]}},

{q:"The Department of Education (DepEd), with partner agencies, aims to generate the highest level of public awareness of Disaster Risk Reduction/Climate Change Adaptation (DRR/CA) concerns and to assess the capacity level of the School and Community. Which of the pertinent documents related to the school-based Earthquake and Fire Drill validates the school\u2019s awareness and preparedness level?",
c:[{t:"Guidelines on how to conduct Earthquake Drill in school",x:0},{t:"Narrative on Earthquake/Fire Drill",x:0},{t:"Earthquake/fire Drill Evaluation Form",x:1},{t:"Earthquake/Fire Drill Checklist of Requirements",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"The Earthquake/Fire Drill Evaluation Form is the document that validates the school\u2019s awareness and preparedness level. It is used to assess and evaluate the conduct of drills, measuring the school\u2019s capacity and readiness. Unlike guidelines or checklists, the evaluation form provides a validated assessment of actual performance.",
wr:[{l:"A",r:"Guidelines provide instructions on how to conduct drills but do not validate the school\u2019s awareness and preparedness level."},{l:"B",r:"A narrative describes what happened during the drill but does not provide a structured validation of preparedness."},{l:"D",r:"A checklist of requirements ensures materials and procedures are in place but does not evaluate the actual level of awareness and preparedness demonstrated during the drill."}]}},

{q:"As a school head, you are tasked with ensuring that the school property, including its land, is properly documented and valued for reporting and compliance purposes.\n\nConsider the following: The assessment level for institutional properties like schools is typically 15%. The assessed value is computed by multiplying the Fair Market Value (FMV) by the assessment level.\n\nIf the fair market value of a DepEd school\u2019s land is PhP 2,000,000, what is the assessed value of the land?",
c:[{t:"PhP 200,000",x:0},{t:"PhP 300,000",x:1},{t:"PhP 400,000",x:0},{t:"PhP 500,000",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.2 Financial management",
e:{w:"The assessed value is computed by multiplying the Fair Market Value (FMV) by the assessment level: PhP 2,000,000 \u00d7 15% = PhP 300,000. This is a straightforward application of property assessment computation used in government property management and reporting.",
wr:[{l:"A",r:"PhP 200,000 would result from a 10% assessment level, not the 15% specified in the problem."},{l:"C",r:"PhP 400,000 would result from a 20% assessment level, which is higher than the 15% for institutional properties."},{l:"D",r:"PhP 500,000 would result from a 25% assessment level, significantly higher than the correct 15%."}]}},

{q:"Human Resource Development is a framework for helping employees develop their personal and organizational skills, knowledge, and abilities. Which of the following standards should schools observe under Human Resource and Team Development?\n\nI. Promote collaboration and harmonious relationships among its personnel.\nII. Ensure a learning environment that fosters the health and well-being of learners and school personnel.\nIII. Foster a culture that encourages excellence and continuous improvement.\nIV. Provide a mechanism to help improve individual and group performance.\nV. Cultivate, nurture, and ensure personal growth, professional enhancement, and development.\nVI. Develop leadership skills among its personnel by providing opportunities to perform leadership roles and responsibilities.",
c:[{t:"I, II and IV",x:0},{t:"I, IV and V",x:1},{t:"II, III and VI",x:0},{t:"II, III and V",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"Under Human Resource and Team Development standards, the key elements are: (I) Promoting collaboration and harmonious relationships, (IV) Providing mechanisms for individual and group performance improvement, and (V) Cultivating personal growth and professional development. These three focus specifically on HR development functions.",
wr:[{l:"A",r:"While I and IV are correct, ensuring a learning environment for health and well-being (II) falls more under school management and welfare, not specifically HR development."},{l:"C",r:"Fostering excellence (III) and developing leadership skills (VI) are broader school management goals, not specifically HR development standards."},{l:"D",r:"While V is correct, items II and III relate to broader school management rather than the specific standards under Human Resource and Team Development."}]}},

{q:"A proficient teacher obtained a rating of 5.000 in the IPCR. The teacher and the rater agreed to two (2) development needs and immediately updated the IPCRF Development Plan. Could the rater be wrong in agreeing that the teacher still has development needs?",
c:[{t:"The rater is correct because the Core Behavioral Competencies of the teacher are also considered in identifying the development needs aside from the Teaching Competencies in the PPST.",x:1},{t:"The rater is wrong because obtaining a rating of 5.000 means that all MOVs presented by the teacher conformed with the required performance indicators for the maximum rating of 5 for Quality, Efficiency, and Timeliness.",x:0},{t:"The rater is wrong because a rating of 5.000 means that the teacher has no competencies to improve.",x:0},{t:"The rater is correct because a rating of 5.000 for a proficient teacher can still be improved into becoming a rating for a highly proficient teacher.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"A rating of 5.000 in the IPCRF means the teacher met all the indicators for a Proficient teacher. However, even with a perfect rating, professional growth is continuous. Teachers can still improve on Core Behavioral Competencies (CBCs) such as teamwork, innovation, service orientation, and professionalism, as well as movement towards the next career stage (e.g., from Proficient to Highly Proficient).",
wr:[{l:"B",r:"While the MOVs may have conformed to the indicators, development needs are not limited to IPCRF indicators. Core Behavioral Competencies and career stage progression are also considered."},{l:"C",r:"A perfect rating does not mean there are no areas for growth. Professional development is continuous, and teachers can always improve CBCs and prepare for the next career stage."},{l:"D",r:"While the aspiration to move from Proficient to Highly Proficient is valid, this is not the primary reason. The correct basis is that CBCs are also considered in identifying development needs, not just the IPCRF rating."}]}},

{q:"A last-mile school has low Cohort Survival Rate for the last three years. For a new school head, what actions should be prioritized to improve the school performance indicator?",
c:[{t:"Seek immediate technical assistance from the Schools Division Office to provide appropriate interventions.",x:0},{t:"Gather school data from the community profile, Nutritional Status Report, and Report on Learner Promotion to analyze the root cause(s).",x:1},{t:"Conduct interviews with teachers on the possible causes of transfers and drop-out of learners in the previous school years.",x:0},{t:"Adopt an effective intervention program conceptualized and implemented from the previous station of the school head.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"For a new school head addressing a persistent problem like low Cohort Survival Rate, the priority action is data gathering and root cause analysis. By examining the community profile, Nutritional Status Report, and Report on Learner Promotion, the school head can identify the specific factors contributing to the problem before designing interventions.",
wr:[{l:"A",r:"Seeking technical assistance is reactive rather than proactive. The school head should first understand the root causes through data analysis before requesting external help."},{l:"C",r:"While teacher interviews can provide insights, they offer only one perspective. A comprehensive data-driven approach using multiple data sources is more reliable for root cause analysis."},{l:"D",r:"Adopting an intervention from a previous station ignores the unique context of the current school. What worked in one school may not be appropriate for another with different challenges."}]}},

{q:"A newly promoted school head was assigned to a large school. As an outstanding master teacher prior to the promotion, what should the school head do to enhance administrative skills through professional networks?",
c:[{t:"Join the Facebook support group of school heads for motivation and resource sharing.",x:0},{t:"Listen to speeches of outstanding community leaders.",x:0},{t:"Pay membership dues to network groups for professional modules and video tutorials.",x:0},{t:"Attend regular sessions or meetings for School Head Organization to enhance leadership and management skills.",x:1}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.3 Professional networks",
e:{w:"Attending regular sessions or meetings of the School Head Organization provides structured, professional networking opportunities specifically designed for school leaders. This is the most direct and effective way to enhance administrative skills through professional networks, as it offers peer learning, mentoring, and leadership development in an organized setting.",
wr:[{l:"A",r:"While Facebook groups can provide some support, they are informal and lack the structured professional development that an official School Head Organization provides."},{l:"B",r:"Listening to speeches of community leaders may be inspirational but does not specifically enhance administrative skills through professional networking."},{l:"C",r:"Paying membership dues for modules and tutorials is a passive approach. Active participation in professional meetings provides more direct skill enhancement and networking."}]}},

{q:"The Division Office is conducting an assessment on the implementation of the Child-Friendly School Program. An elementary school head spearheaded an internal assessment as a mechanism to validate the readiness of the school. Which of the following principles should the school head apply in the school on the aspect of caring and making it child-friendly?\n\nI. Sets clear guidelines for conduct among learners.\nII. Safeguards and provides security for all children.\nIII. Develops projects that promote understanding among learners.\nIV. Promotes a curriculum that addresses community needs.\nV. Hires security personnel to guard the school 24/7.\nVI. Allows children to play in the different areas in the school.",
c:[{t:"II, III, and V",x:0},{t:"I, IV, and VI",x:0},{t:"I, II, and III",x:1},{t:"IV, V, and VI",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.3 Inclusive practice",
e:{w:"On the aspect of caring and making a school child-friendly, the principles are: (I) Setting clear guidelines for conduct provides structure and safety; (II) Safeguarding and providing security protects children; (III) Developing projects that promote understanding fosters a caring community. These three directly address the caring dimension of child-friendly schools.",
wr:[{l:"A",r:"While II and III are correct, hiring security personnel 24/7 (V) is an operational measure, not a principle of child-friendly caring. It also may not be feasible for most schools."},{l:"B",r:"While I is correct, promoting a curriculum for community needs (IV) is about relevance, not caring; and allowing play in all areas (VI) may pose safety concerns."},{l:"D",r:"These options mix operational logistics (V, VI) with curriculum concerns (IV), none of which directly address the caring dimension of child-friendly schools."}]}},

{q:"A school head called the attention of a teacher for the late submission of daily time records, school reports, and grade sheets. After a number of verbal reminders, the teacher still failed to submit on time. The school head interviewed the subject coordinator and the former school head, and was told that the teacher had been performing that way ever since he/she was hired by the school, but no written report had been filed. How should the school head address the matter?",
c:[{t:"Write a letter of reprimand to the teacher regarding his/her late submission of DTR, school reports, and grade sheets.",x:0},{t:"Issue an office memorandum seeking an explanation regarding the teacher\u2019s performance.",x:1},{t:"Seek appropriate advice from the division legal officer.",x:0},{t:"Refer the matter to the Schools Division Superintendent for appropriate action.",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"Since verbal reminders have failed and no written documentation exists, the appropriate next step is to issue an office memorandum seeking a written explanation. This creates a formal record, gives the teacher due process to explain, and follows the progressive discipline approach \u2014 moving from verbal to written communication before escalating.",
wr:[{l:"A",r:"A letter of reprimand is a more severe action that typically comes after a written explanation has been sought and the issue persists. Due process requires giving the teacher a chance to explain first."},{l:"C",r:"Seeking legal advice is premature at this stage. The school head should first follow internal administrative procedures before involving legal counsel."},{l:"D",r:"Referring to the SDS is premature. The school head should exhaust school-level remedies first, starting with a formal written communication to the teacher."}]}},

{q:"The Results-based Performance Management System (RPMS) cycle prescribes that classroom observations be conducted within a school year. Which description of classroom observation best provides its purpose in the RPMS cycle?",
c:[{t:"Classroom observation is used to assess a teacher\u2019s work performance accurately.",x:0},{t:"Classroom observation is conducted to conform with the RPMS cycle.",x:0},{t:"Classroom observation is used to provide feedback and quality input to a teacher\u2019s classroom practice.",x:1},{t:"Classroom observation provides an opportunity for a teacher to share ideas and expertise with the school head, head teacher, or master teacher.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The primary purpose of classroom observation in the RPMS cycle is to provide feedback and quality input to improve a teacher\u2019s classroom practice. It is a developmental tool, not merely an assessment or compliance mechanism. The focus is on professional growth through constructive feedback.",
wr:[{l:"A",r:"While classroom observation does involve assessment, its primary purpose is developmental \u2014 to provide feedback for improvement, not just to rate performance."},{l:"B",r:"Conducting observations merely to conform with the RPMS cycle reduces it to a compliance activity rather than a meaningful professional development tool."},{l:"D",r:"While sharing ideas may occur during post-observation conferences, the primary purpose is for the observer to provide feedback to the teacher, not for the teacher to share expertise."}]}},

{q:"Based on the meeting conducted by the School Planning Team (SPT), they were able to arrive at the Priority Improvement Areas (PIAs).\n\nWhat can be inferred from the given data on PIAs?",img:"assets/nash-images/nash-q038.png",
c:[{t:"A moderate number of learners are within the normal Body Mass Index (BMI); hence, they still need to undergo the Feeding Program.",x:0},{t:"All the Priority Improvement Areas (PIAs) have several ways of improving through effective and efficient programs, projects, and activities.",x:1},{t:"A moderate number of learners belong to both the frustration and independent level.",x:0},{t:"A greater number of learners are at risk of dropping out; hence, only a few performance indicators could benefit from it.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The data shows that all three PIAs (Absenteeism, Low English Literacy, and Nutritional Status) have average ratings ranging from Moderate Priority to Very High Priority. This means all areas have room for improvement and can be addressed through well-designed programs, projects, and activities. The scale interpretation confirms that all PIAs are actionable.",
wr:[{l:"A",r:"This inference focuses narrowly on nutritional status and misinterprets \u201CModerate Priority\u201D as meaning learners are within normal BMI. The MP rating means it still needs attention, not that learners are healthy."},{l:"C",r:"This inference about frustration and independent levels is not supported by the data presented in the PIAs table, which focuses on priority ratings, not reading levels."},{l:"D",r:"This inference is too narrow and pessimistic. The data shows all PIAs can be improved, not that only a few indicators would benefit from intervention."}]}},

{q:"The school head presented the number of facilities needed during the Stakeholders\u2019 Forum. The data is based on the Physical Facility Inventory with the given enrollment information. According to the school head, the school needs a handwashing facility. However, this was contradicted by the PTA President informing the group that the priority project was the construction of a school clinic since sponsors had already vouched to help. How should the school head convince the stakeholders to support the provision of a handwashing facility?",img:"assets/nash-images/nash-q039.png",
c:[{t:"Inform the stakeholders that the school is promoting the culture of handwashing as part of the infection and prevention control mechanism.",x:0},{t:"Inform the stakeholders that the project is required as it answers the pupil to group facility ratio of 1 is 200 for one shift.",x:1},{t:"Present to the stakeholders that prioritizing the project is a response to the Priority Improvement Areas indicated in the School Improvement Plan.",x:0},{t:"Assure the stakeholders that the handwashing facility will be constructed at the entrance of the school.",x:0}],
d:"Domain 5 \u2014 Building Connections",s:"5.5 Community engagement and networking",
e:{w:"The most convincing argument is data-driven: the enrollment data shows 400 total learners with only 2 handwashing facilities, creating a ratio of 1:200 per shift. This exceeds the standard pupil-to-facility ratio, making the construction a compliance requirement rather than a preference. Stakeholders are more likely to support projects backed by concrete data and standards.",
wr:[{l:"A",r:"While promoting handwashing culture is important, it is a health advocacy argument rather than a compliance-based justification. Data-driven reasoning is more persuasive in stakeholder forums."},{l:"C",r:"Referencing the SIP is valid but less compelling than showing the specific facility ratio that demonstrates a clear, measurable need."},{l:"D",r:"Assuring stakeholders about the location of construction does not address why the facility is needed. It answers \u201Cwhere\u201D but not \u201Cwhy,\u201D which is the core issue in the disagreement."}]}},

{q:"After reviewing the Learner Information System (LIS) generated data, the school head discovered a five percent (5%) enrollment dropout. Upon knowing the root causes of the problem, he/she meets with the School-Community Planning Team and the Project Team assigned to address issues related to Student-At-Risk of Dropping Out (SARDO). What key result area is the focus of the school head\u2019s action?",
c:[{t:"Access",x:1},{t:"Quality",x:0},{t:"Governance",x:0},{t:"Operations",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.2 School planning and implementation",
e:{w:"The school head\u2019s focus on enrollment dropout and SARDO falls under the Key Result Area of Access. Access in DepEd\u2019s framework refers to ensuring that all learners are enrolled and remain in school \u2014 addressing dropout, retention, and participation rates. Reducing dropout directly improves access to basic education.",
wr:[{l:"B",r:"Quality as a KRA focuses on learning outcomes, achievement rates, and the effectiveness of instruction \u2014 not enrollment and dropout issues."},{l:"C",r:"Governance as a KRA relates to organizational management, transparency, accountability, and stakeholder participation \u2014 not directly to enrollment retention."},{l:"D",r:"Operations is not one of the standard DepEd Key Result Areas. The correct KRAs include Access, Quality, and Governance."}]}}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml=q.img?'<img class="q-img" src="'+q.img+'" alt="Question reference image">':'';
if(q.img==='IMG38') imgHtml='<img class="q-img" src="'+IMG38+'" alt="Data Table">';
if(q.img==='IMG39') imgHtml='<img class="q-img" src="'+IMG39+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}
var r=document.getElementById('resultsArea');
r.innerHTML='<div class="trophy">'+em+'</div><div class="score-number" style="color:'+(p>=75?'var(--green)':p>=60?'var(--amber)':'var(--red)')+'" id="sn">0%</div><div class="score-subtitle">'+cor+' out of '+Q.length+' correct</div><div class="stat-boxes"><div class="stat-box green-tint"><div class="stat-box-num" style="color:var(--green)">'+cor+'</div><div class="stat-box-label">Correct</div></div><div class="stat-box red-tint"><div class="stat-box-num" style="color:var(--red)">'+wrn+'</div><div class="stat-box-label">Wrong</div></div><div class="stat-box accent-tint"><div class="stat-box-num" style="color:var(--accent)">'+p+'%</div><div class="stat-box-label">Score</div></div></div><div class="perf-pill '+bc+'">'+band+'</div><div class="motiv-msg">'+msg+'</div><div class="results-actions"><button class="btn-outline" onclick="restart()">\u21ba Restart This Set</button><button class="btn-filled" onclick="window.location.href=\'nash-03.html\'">Proceed to Set 3 \u2192</button></div>';
r.classList.add('show');
var c=0,el=document.getElementById('sn');var iv=setInterval(function(){c++;el.textContent=c+'%';if(c>=p)clearInterval(iv);},20);launchP();
}
function restart(){cur=0;cor=0;wrn=0;ans=false;document.getElementById('pCor').textContent=0;document.getElementById('pWrn').textContent=0;document.getElementById('pPct').textContent=0;document.getElementById('pFill').style.width='0%';var r=document.getElementById('resultsArea');r.classList.remove('show');r.innerHTML='';document.getElementById('quizArea').classList.remove('hidden');render();}
function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(74,106,142,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
render();
</script>
</body>
</html>
