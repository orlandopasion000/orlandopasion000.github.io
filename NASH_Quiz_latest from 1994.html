er": "D", "text": "III, IV, VI"}], "explanation": "Under the SBM framework, the school head must ensure that the School Governing Council (SGC) is organized and functional. The SGC participates in school planning, monitoring, and evaluation, and serves as the highest decision-making body for school-community governance.", "hasImage": false, "imageIdx": null, "intro": "A school principal is a part-time university teacher. What precise conditions must the school head meet in accordance with the provisions indicated in Civil Service Commission circulars and Republic Acts 6713, 3019?"}, {"num": 72, "officialAnswer": "A", "q": "A learning outcome is a concise statement that describes the knowledge, understanding, and skills that students should possess and be able to showcase upon finishing a learning experience. What actions should a school principal do to guarantee that the educational results align with the learners' accomplishments?", "romanItems": [], "choices": [{"letter": "A", "text": "Provide teachers with technical assistance to ensure content, teaching practices, and assessment criteria alignment."}, {"letter": "B", "text": "Provide programs that emphasize the enhancement of learners’ abilities."}, {"letter": "C", "text": "Monitor the alignment of the classroom objective, learning experiences, and teaching methods."}, {"letter": "D", "text": "Encourage self-directed learner and teacher activities to achieve the desired learning outcome."}], "explanation": "The DepEd policy on promotion and recognition under the RPMS requires that all performance ratings be based on the quality and quantity of outputs, efficiency, and timeliness. Ratings must be supported by verifiable accomplishments linked to the PPSSH indicators.", "hasImage": false, "imageIdx": null, "intro": "A learning outcome is a concise statement that describes the knowledge, understanding, and skills that students should possess and be able to showcase upon finishing a learning experience. What actions should a school principal do to guarantee that the educational results align with the learners' accomplishments?"}, {"num": 73, "officialAnswer": "C", "q": "Results of evaluation on teacher performance as rated by the school head and master teacher reflected that in the aspect of “applies a variety of assessment tools and strategies,” 12% of teachers got a 2.46 mean percentage score described as “unsatisfactory.” What does this imply?", "romanItems": [], "choices": [{"letter": "A", "text": "Teachers need intensive training on curriculum and planning."}, {"letter": "B", "text": "Teachers need to understand the diversity of learners fully."}, {"letter": "C", "text": "The school head must provide technical assistance on content knowledge and pedagogy."}, {"letter": "D", "text": "The school head must establish a learning environment responsive to the learners’ needs."}], "explanation": "Under the CSC MC No. 40, s. 1998 (Code of Conduct for Government Employees), government employees must render honest, effective, and efficient public service. The school head must ensure that all personnel observe proper work ethics, attendance, and professional conduct.", "hasImage": false, "imageIdx": null, "intro": "Results of evaluation on teacher performance as rated by the school head and master teacher reflected that in the aspect of “applies a variety of assessment tools and strategies,” 12% of teachers got a 2.46 mean percentage score described as “unsatisfactory.” What does this imply?"}, {"num": 74, "officialAnswer": "D", "q": "A strong typhoon hit a barangay, and a kagawad requested a school head to occupy the school as an evacuation center immediately. With the school’s limited water supply, how would the school head appropriately respond to the situation?", "romanItems": [], "choices": [{"letter": "A", "text": "Refuse the request of the kagawad politely due to insufficient water supply."}, {"letter": "B", "text": "Seek the support of a nearby school with a sufficient water supply to promote the bayanihan spirit."}, {"letter": "C", "text": "Respond to the request upon submission of required documents for the use of school facilities."}, {"letter": "D", "text": "Accommodate the request and coordinate with the local Bureau of Fire Protection Office for the water provision."}], "explanation": "The DepEd Child-Friendly School System (CFSS) framework requires that schools create a safe, inclusive, and child-centered learning environment. This involves ensuring that school policies, practices, and physical facilities are aligned with the best interests of the child.", "hasImage": false, "imageIdx": null, "intro": "A strong typhoon hit a barangay, and a kagawad requested a school head to occupy the school as an evacuation center immediately. With the school’s limited water supply, how would the school head appropriately respond to the situation?"}, {"num": 75, "officialAnswer": "C", "q": "Last SY 2020–2021, a school had been converted into an integrated school that offers seventh grade. In response to parental requests to maintain their children enrolled in Grade 8 for the current academic year, the school administrator, who was recently appointed, made the decision to commence Grade 8 instruction for the 2021-2022 academic year. Considering the prior year's approval of the conversion, what consequences might the school principal's action entail?", "romanItems": [], "choices": [{"letter": "A", "text": "Donations for the school's improvement will pour from the different stakeholders."}, {"letter": "B", "text": "Parents will commend the action of the School Head for his decision."}, {"letter": "C", "text": "The Schools Division Office will call his attention to allow the operation of Grade 8."}, {"letter": "D", "text": "The LGU will recognize his effort during the “Parangal ng Bayan sa mga Natatanging Guro”"}], "explanation": "Under the Government Procurement Reform Act (RA 9184, now updated by RA 12009), all government procurement must go through competitive and transparent processes. The Bids and Awards Committee (BAC) at the school or division level oversees compliance with procurement rules.", "hasImage": false, "imageIdx": null, "intro": "Last SY 2020–2021, a school had been converted into an integrated school that offers seventh grade. In response to parental requests to maintain their children enrolled in Grade 8 for the current academic year, the school administrator, who was recently appointed, made the decision to commence Grade 8 instruction for the 2021-2022 academic year. Considering the prior year's approval of the conversion, what consequences might the school principal's action entail?"}, {"num": 76, "officialAnswer": "C", "q": "A school head sold the condemnable textbooks that were not included in the inventory list as declared by the designated property custodian. He/she used proceeds amounting to ₱ 10,000.00 to purchase health kits for learners. Was the action of the school head correct?", "romanItems": [], "choices": [{"letter": "A", "text": "Yes, because the proceeds were used for the learner’s benefits."}, {"letter": "B", "text": "Yes, because the school head has the discretionary power to decide on what to do with the proceeds."}, {"letter": "C", "text": "No, because it violated the Commission on Audit Rule Circular No. 89-296."}, {"letter": "D", "text": "No, because it violated the Law of the National Archives Commission per Article III, Rule 3.1."}], "explanation": "The PPSSH Domain 5 emphasizes the school head's commitment to personal and professional development. Pursuing advanced degrees, engaging in action research, and participating in benchmarking activities demonstrate the school head's commitment to lifelong learning and improvement.", "hasImage": false, "imageIdx": null, "intro": "A school head sold the condemnable textbooks that were not included in the inventory list as declared by the designated property custodian. He/she used proceeds amounting to ₱ 10,000.00 to purc ant specializing in Computer Hardware Servicing. Who among the following applicants in the Registry of Qualified Applicants should first be recommended by the school head for the said position?"}, {"num": 80, "officialAnswer": "C", "q": "School initiatives shall be based on evidence from a scientific and systematic inquiry, thus, fostering a culture of research in schools. Which among the following contains the list of priority education research areas to guide DepEd and its stakeholders in conducting research?", "romanItems": [], "choices": [{"letter": "A", "text": "Research Theme"}, {"letter": "B", "text": "Research Compendium"}, {"letter": "C", "text": "Research Agenda"}, {"letter": "D", "text": "Research Colloquium"}], "explanation": "The Anti-Red Tape Act (RA 11032) and its IRR require government agencies to simplify and streamline transactions. School heads must ensure that all school processes, from enrollment to certificate issuance, comply with the prescribed service standards for timely and efficient service delivery.", "hasImage": false, "imageIdx": null, "intro": "School initiatives shall be based on evidence from a scientific and systematic inquiry, thus, fostering a culture of research in schools. Which among the following contains the list of priority education research areas to guide DepEd and its stakeholders in conducting research?"}, {"num": 81, "officialAnswer": "D", "q": "The Project Team of a national high school developed a project design to address learners’ low performance in Mathematics. The said project ran during the first year of School Improvement Plan (SIP) implementation. In order to ensure success, the team decided to have its implementation monitored and evaluated. Which of the following are the processes of SIP monitoring and evaluation? I. The Project Team submits a progress report to the School-Community Planning Team (SPT) on the status of the project at least twice a year. II. The School-Community Planning Team (SPT) and the Pr pandemic, all teachers from ABC NHS received laptops and printers, while the LGU gave each learner a tablet. The Brgy. Officials and PTA helped in the distribution and retrieval of modules and activity sheets. Teachers reached out to learners who were struggling in their studies through text messages and home visits in strict compliance with the health protocols. The school head led the school by providing appropriate interventions for both learners and teachers. At the end of the school year, the performance of learners in different subjects increased. What conclusion can be derived from the given situation?", "romanItems": [], "choices": [{"letter": "A", "text": "There was a well-crafted Learning Continuity Plan (LCP)."}, {"letter": "B", "text": "Parents were the ones who answered learners’ activities."}, {"letter": "C", "text": "Appropriate use of ICT is indispensable during a health crisis."}, {"letter": "D", "text": "It clearly manifests stakeholders’ support for the education system."}], "explanation": "The successful educational performance during the pandemic, as described in the scenario, resulted from the collaborative effort of multiple stakeholders — teachers, parents, LGU, and Brgy. officials. This clearly demonstrates that strong stakeholder support is a critical factor in sustaining educational quality during crises.", "hasImage": false, "imageIdx": null, "intro": "During the pandemic, all teachers from ABC NHS received laptops and printers, while the LGU gave each learner a tablet. The Brgy. Officials and PTA helped in the distribution and retrieval of modules and activity sheets. Teachers reached out to learners who were struggling in their studies through text messages and home visits in strict compliance with the health protocols. The school head led the school by providing appropriate interventions for both learners and teachers. At the end of the school year, the performance of learners in different subjects increased. What conclusion can be derived from the given situation?"}, {"num": 126, "officialAnswer": "C", "q": "In order to implement the programs effectively and efficiently, teachers and staff are involved in the realization of the plans. How will the school head develop the leadership potential of the teachers and staff?", "romanItems": [], "choices": [{"letter": "A", "text": "Assume all the responsibilities in the implementation of the program."}, {"letter": "B", "text": "Assign teachers to manage different committees during and after the conduct of School Learning Action Cells (SLAC)."}, {"letter": "C", "text": "Coach master teachers in conducting classroom observation and providing technical assistance during a video lesson demonstration."}, {"letter": "D", "text": "Identify teachers who can implement the programs according to their rank, experiences, and length of service."}], "explanation": "Under the PPSSH, developing the leadership potential of teachers involves coaching master teachers to conduct classroom observations and provide technical assistance. This builds distributed leadership capacity within the school and ensures that instructional improvement is sustained.", "hasImage": false, "imageIdx": null, "intro": "In order to implement the programs effectively and efficiently, teachers and staff are involved in the realization of the plans. How will the school head develop the leadership potential of the teachers and staff?"}, {"num": 127, "officialAnswer": "D", "q": "During the process of mapping the current state in a Continuous Improvement Project of School Y, the following are the identified areas that need improvement. 1. Alumni Involvement and Participation as Stakeholders of the School 2. School’s Performance in Academic and Non-Academic Contests 3. Student’s Academic Performance in Mathematics. Which of the following data best supports the identification of the third priority improvement area?", "romanItems": [], "choices": [{"letter": "A", "text": "The table of the Winnings of School Y in Mathematics Contests for three consecutive school years."}, {"letter": "B", "text": "Results of the Survey and Interview About the Different Causes of Challenges in Mathematics"}, {"letter": "C", "text": "The pie chart showing the Motivational Level of Students in Different Grade Levels in Mathematics"}, {"letter": "D", "text": "The table of the Mean, MPS, and SD of Mathematics 7 for Two Consecutive Years"}], "explanation": "For an improvement area focused on students' academic performance in Mathematics, the most relevant data is the Mean, MPS (Mean Percentage Score), and Standard Deviation of Mathematics scores across years. This quantitative data directly measures the magnitude and trend of the performance problem.", "hasImage": false, "imageIdx": null, "intro": "During the process of mapping the current state in a Continuous Improvement Project of School Y, the following are the identified areas that need improvement. 1. Alumni Involvement and Participation as Stakeholders of the School 2. School’s Performance in Academic and Non-Academic Contests 3. Student’s Academic Performance in Mathematics. Which of the following data best supports the identification of the third priority improvement area?"}, {"num": 128, "officialAnswer": "D", "q": "At the end of the 2nd Quarter of the current school year, a school head led a progress monitoring of their implementation of mandated processes and initiated interventions captured in their Operational Plans. They found out that some of their 2nd Quarter targets were not yet accomplished. What order of process should the school follow to accomplish the unmet targets? I. Perform a risk analysis. II. Prepare a catch-up plan. III. Conduct unaccomplished activities. IV. Mobilize the project owners concerned.", "romanItems": ["I. Perform a risk analysis.", "II. Prepare a catch-up plan.", "III. Conduct unaccomplished activities.", "IV. Mobilize the project owners concerned."], "choices": [{"letter": "A", "text": "I, II, IV, and III"}, {"letter": "B", "text": "II, I, IV and III"}, {"letter": "C", "text": "III, IV, II, and I"}, {"letter": "D", "text": "IV, I, II and III"}], "explanation": "When unmet quarterly targets are identified, the proper process is to first mobilize the project owners to understand the situation, then perform a risk analysis to identify obstacles, prepare a catch-up plan with adjusted timelines, and finally conduct the unaccomplished activities. This sequence (IV, I, II, III) ensures a systematic and informed response.", "hasImage": false, "imageIdx": null, "intro": "At the end of the 2nd Quarter of the current school year, a school head led a progress monitoring of their implementation of mandated processes and initiated interventions captured in their Operational Plans. They found out that some of their 2nd Quarter targets were not yet accomplished. What order of process should the school follow to accomplish the unmet targets?"}, {"num": 129, "officialAnswer": "D", "q": "In School-Based Management, which of the following are the indicators under leadership and governance? I. The school community regularly reviews the development plan to keep it responsive and relevant to emerging needs, challenges, and opportunities. II. The learning systems are regularly and collaboratively monitored by the community using appropriate tools to ensure the holistic growth and development of the learners. III. The roles and responsibilities of accountable persons are clearly defined and agreed upon by community stakeholders. IV. In place is a development plan crafted collaboratively by the school and community stakeholders. V. Operational is a long-term program that addresses the training and development needs of the school and community leaders.", "romanItems": ["I. The school community regularly reviews the development plan to keep it responsive and relevant to emerging needs, challenges, and opportunities.", "II. The learning systems are regularly and collaboratively monitored by the community using appropriate tools to ensure the holistic growth and development of the learners.", "III. The roles and responsibilities of accountable persons are clearly defined and agreed upon by community stakeholders.", "IV. In place is a development plan crafted collaboratively by the school and community stakeholders.", "V. Operational is a long-term program that addresses the training and development needs of the school and community leaders."], "choices": [{"letter": "A", "text": "II and III only"}, {"letter": "B", "text": "I and IV only"}, {"letter": "C", "text": "III, IV, and V"}, {"letter": "D", "text": "I, IV, and V"}], "explanation": "Under the SBM framework, leadership and governance indicators include having a development plan crafted collaboratively, a long-term program for training community leaders, and a community-reviewed development plan. Statements I, IV, and V align with these leadership and governance indicators.", "hasImage": false, "imageIdx": null, "intro": "In School-Based Management, which of the following are the indicators under leadership and governance?"}, {"num": 130, "officialAnswer": "C", "q": "A school head found out that a number of learners who are involved in the co-curricular activities of the school’s Performing Arts Troupe had a decrease in Science and Mathematics performance. These learners missed the competencies facilitated in class during their absence. Which of the following could be done by the school head to support these learners?", "romanItems": [], "choices": [{"letter": "A", "text": "Exempt the learners from all the summative assessments on the days they are absent in class."}, {"letter": "B", "text": "Encourage the Science and Mathematics teachers to participate in training on alternative delivery systems and modalities."}, {"letter": "C", "text": "Implement interventions or alternative modes of developing the competencies required in Science and Mathematics."}, {"letter": "D", "text": "Organize these learners under one section and adjust the schedule of classes for all learning areas."}], "explanation": "School heads must provide learning continuity for students whose class attendance is interrupted due to co-curricular activities. Implementing alternative modes of developing competencies — such as independent study, make-up sessions, or flexible learning — ensures that learners do not fall behind academically.", "hasImage": false, "imageIdx": null, "intro": "A school head found out that a number of learners who are involved in the co-curricular activities of the school’s Performing Arts Troupe had a decrease in Science and Mathematics performance. These learners missed the competencies facilitated in class during their absence. Which of the following could be done by the school head to support these learners?"}, {"num": 131, "officialAnswer": "D", "q": "A learner with visual impairment transfers to your school. How should the school head respond to ensure inclusion? I. Orient teachers on differentiated instruction. II. Request support services from the Division SPED coordinator. III. Ask parents to hire a personal aide before accepting the child. IV. Provide Braille materials through school partnerships.", "romanItems": ["I. Orient teachers on differentiated instruction.", "II. Request support services from the Division SPED coordinator.", "III. Ask parents to hire a personal aide before accepting the child.", "IV. Provide Braille materials through school partnerships."], "choices": [{"letter": "A", "text": "II, III only"}, {"letter": "B", "text": "I, III only"}, {"letter": "C", "text": "I, II only"}, {"letter": "D", "text": "I, II, IV"}], "explanation": "For a learner with visual impairment, the school head must orient teachers on differentiated instruction, request support services from the Division SPED coordinator, and provide appropriate Braille materials through partnerships. Asking parents to hire a personal aide as a precondition for acceptance violates the inclusive education policy.", "hasImage": false, "imageIdx": null, "intro": "A learner with visual impairment transfers to your school. How should the school head respond to ensure inclusion?"}, {"num": 132, "officialAnswer": "B", "q": "The Assistant Schools Division Superintendent (ASDS) reviewed and evaluated a school head’s portfolio to validate the 4.666 initial rating on the objective, “Focusing on improving the school environments.” As a result of the review, the ASDS reduced the rating to 4.333. Which of the following is the best action to be considered by the school head in the given situation?", "romanItems": [], "choices": [{"letter": "A", "text": "Request for reconsideration of rating and submit additional evidence to support the initial rating."}, {"letter": "B", "text": "Conform with the rating of the ASDS and apply the comments and suggestions."}, {"letter": "C", "text": "Appeal the rating to the Performance Management Team."}, {"letter": "D", "text": "Use the opportunity to present to ASDS the school’s programs and projects to be enhanced."}], "explanation": "Under the RPMS for school heads, the rater has the authority to adjust the initial self-rating based on the evidence review. The appropriate response of the ratee is to accept the rater's decision and use the feedback constructively for professional improvement, not to challenge or appeal without valid grounds.", "hasImage": false, "imageIdx": null, "intro": "The Assistant Schools Division Superintendent (ASDS) reviewed and evaluated a school head’s portfolio to validate the 4.666 initial rating on the objective, “Focusing on improving the school environments.” As a result of the review, the ASDS reduced the rating to 4.333. Which of the following is the best action to be considered by the school head in the given situation?"}, {"num": 133, "officialAnswer": "A", "q": "Grade 7 diagnostic results show 55% of learners are below mastery in Reading Comprehension. I. Assign more reading homework. II. Implement school-wide reading program. III. Schedule LAC sessions on differentiated instruction. IV. Request training from SDO Reading Coordinator. V. Conduct parental orientation on home-based reading. VI. Ignore results since it’s only diagnostic. VII. Monitor teachers’ remedial classes weekly. VIII. Celebrate learners with reading improvements.", "romanItems": ["I. Assign more reading homework.", "II. Implement school-wide reading program.", "III. Schedule LAC sessions on differentiated instruction.", "IV. Request training from SDO Reading Coordinator.", "V. Conduct parental orientation on home-based reading.", "VI. Ignore results since it’s only diagnostic.", "VII. Monitor teachers’ remedial classes weekly.", "VIII. Celebrate learners with reading improvements."], "choices": [{"letter": "A", "text": "II, III, IV, V, VII, VIII"}, {"letter": "B", "text": "I, II, V"}, {"letter": "C", "text": "II, VI, VIII"}, {"letter": "D", "text": "III, IV, VI"}], "explanation": "When diagnostic results show that 55% of learners are below mastery in Reading Comprehension, the school head must implement a school-wide response. Actions II (school-wide reading program), III (LAC on differentiated instruction), IV (SDO support), V (parental orientation), VII (monitoring remedial classes), and VIII (celebrating improvements) together constitute a comprehensive and positive intervention strategy.", "hasImage": false, "imageIdx": null, "intro": "Grade 7 diagnostic results show 55% of learners are below mastery in Reading Comprehension."}, {"num": 134, "officialAnswer": "A", "q": "A company, which is a center for career development, is offering a short-term course for school heads in the locality. A school head who has been a teacher-in-charge for two years would like to avail himself/herself of this learning opportunity. The result of his/her self-assessment on Core Behavioral Competencies revealed the following development needs in the order of priority: 1. Demonstrates an ability to think beyond the box; 2. Uses ingenious methods to accomplish responsibilities; 3. Translates creative thinking into tangible changes and solutions that improve the organization; and, 4. Prioritizes work tasks and schedules using Gantt charts and checklists Which of the following courses would best address the priority need of the school head?", "romanItems": [], "choices": [{"letter": "A", "text": "Innovation in the 21st Century"}, {"letter": "B", "text": "Self-Management in a Stressful Workplace"}, {"letter": "C", "text": "Developing a Result-Focus Leaders"}, {"letter": "D", "text": "People Development to Maximize Human Capital"}], "explanation": "The first three development needs of the school head — thinking beyond the box, using ingenious methods, and translating creative thinking into solutions — all point to the competency of innovation. The course on Innovation in the 21st Century directly addresses these needs and should be prioritized.", "hasImage": false, "imageIdx": null, "intro": "A company, which is a center for career development, is offering a short-term course for school heads in the locality. A school head who has been a teacher-in-charge for two years would like to avail himself/herself of this learning opportunity. The result of his/her self-assessment on Core Behavioral Competencies revealed the following development needs in the order of priority: 1. Demonstrates an ability to think beyond the box; 2. Uses ingenious methods to accomplish responsibilities; 3. Translates creative thinking into tangible changes and solutions that improve the organization; and, 4. Prioritizes work tasks and schedules using Gantt charts and checklists Which of the following courses would best address the priority need of the school head?"}, {"num": 135, "officialAnswer": "D", "q": "The administration of the affairs and management of activities of the Parents-Teachers Association (PTA) is vested with the Board of Directors and its officers. Which of the following is true about PTA? I. A class adviser is allowed to chair the Ways and Means Committee of the PTA. II. A board member can serve for more than two (2) consecutive terms. III. A school employee who is a homeroom president can participate in the election. IV. Half of the board members are parents elected from among homeroom presidents. V. A non-teaching personnel is considered a teacher-member.", "romanItems": ["I. A class adviser is allowed to chair the Ways and Means Committee of the PTA.", "II. A board member can serve for more than two (2) consecutive terms.", "III. A school employee who is a homeroom president can participate in the election.", "IV. Half of the board members are parents elected from among homeroom presidents.", "V. A non-teaching personnel is considered a teacher-member."], "choices": [{"letter": "A", "text": "IV & II"}, {"letter": "B", "text": "I, III & IV"}, {"letter": "C", "text": "V & II"}, {"letter": "D", "text": "I, III & V"}], "explanation": "Under DepEd's guidelines on PTA operations, a class adviser may serve as chair of the Ways and Means Committee, a school employee who is a homeroom president may participate in elections, and non-teaching personnel are considered teacher-members. These are the specific provisions that make statements I, III, and V correct.", "hasImage": false, "imageIdx": null, "intro": "The administration of the affairs and management of activities of the Parents-Teachers Association (PTA) is vested with the Board of Directors and its officers. Which of the following is true about PTA?"}, {"num": 136, "officialAnswer": "A", "q": "The school head encourages the teachers to perform duties and responsibilities effectively and efficiently so that the school plans are realized and performance indicators are achieved. How can the school head ensure a high level of motivation among teachers in terms of rewards and recognition?", "romanItems": [], "choices": [{"letter": "A", "text": "Explore possible means and other mechanisms to reward and recognize teachers’ performance."}, {"letter": "B", "text": "Use school-based mechanisms on rewards and recognition that assess teachers’ overall performance."}, {"letter": "C", "text": "Inform the teachers about the criteria for promotion to align performance and practice."}, {"letter": "D", "text": "Recommend performing teachers for a promotion that recognizes teachers’ level of competence."}], "explanation": "Under the PPSSH Domain 4, school heads must be creative in recognizing and rewarding teacher performance. Exploring various mechanisms for recognition — beyond standard promotion — motivates teachers and fosters a culture of excellence and recognition within the school.", "hasImage": false, "imageIdx": null, "intro": "The school head encourages the teachers to perform duties and responsibilities effectively and efficiently so that the school plans are realized and performance indicators are achieved. How can the school head ensure a high level of motivation among teachers in terms of rewards and recognition?"}, {"num": 137, "officialAnswer": "C", "q": "A teacher, who is a newly-designated Student Supreme Government (SSG) adviser, is worried about the challenges posed by the pandemic in the conduct of student government elections. Which of the following should the school head do to help the teacher?", "romanItems": [], "choices": [{"letter": "A", "text": "Give assurance that following the guidelines will lead to the fair and successful conduct of the elections"}, {"letter": "B", "text": "Discuss the SSG Adviser’s role in supervising the conduct of the election."}, {"letter": "C", "text": "Mentor teachers on applying the SSG Standard Election Code guidelines consistent with the revised SSG Constitution and By-Laws."}, {"letter": "D", "text": "Reduce the teaching load and consider SSG Advisership as one load"}], "explanation": "The school head's role in this situation is to mentor the teacher by providing guidance on applying the SSG Standard Election Code and the revised SSG Constitution and By-Laws. Simply offering assurance or discussing the adviser's role is insufficient; the teacher needs practical guidance on how to implement the guidelines.", "hasImage": false, "imageIdx": null, "intro": "A teacher, who is a newly-designated Student Supreme Government (SSG) adviser, is worried about the challenges posed by the pandemic in the conduct of student government elections. Which of the following should the school head do to help the teacher?"}, {"num": 138, "officialAnswer": "A", "q": "Which of the following are the benefits of utilizing learners’ voices in policy development and decision-making towards school improvement? I. A deeper understanding of the real needs and problems of the learners II. An excellent feedback mechanism on existing school interventions III. An insight into what school processes need further analysis IV. An opportunity for learners to express their grievances V. An avenue to conduct research on learners’ opinions", "romanItems": ["I. A deeper understanding of the real needs and problems of the learners", "II. An excellent feedback mechanism on existing school interventions", "III. An insight into what school processes need further analysis", "IV. An opportunity for learners to express their grievances", "V. An avenue to conduct research on learners’ opinions"], "choices": [{"letter": "A", "text": "I, II, III"}, {"letter": "B", "text": "I, II, IV"}, {"letter": "C", "text": "IV, V"}, {"letter": "D", "text": "III, V"}], "explanation": "Utilizing learners' voices in policy development contributes to a deeper understanding of learners' real needs, provides an excellent feedback mechanism on existing interventions, and offers insights into what school processes need analysis. These three benefits (I, II, III) directly relate to improving school policies and decision-making.", "hasImage": false, "imageIdx": null, "intro": "Which of the following are the benefits of utilizing learners’ voices in policy development and decision-making towards school improvement?"}, {"num": 139, "officialAnswer": "B", "q": "Research on DepEd’s readiness for distance learning, specifically ICT investment, ICT maturity, and digital economic performance, placed the Philippines in the 59th rank out of 79 nations and is categorized as a “Starter.” The research was published by Huawei for the 2020 Global Connectivity Index. Based on the findings, which of the following proposals from the school head has a higher probability of being supported by potential partners?", "romanItems": [], "choices": [{"letter": "A", "text": "Establishing technology-based education towards digitization and sustainable development"}, {"letter": "B", "text": "Providing technical assistance and capacity building on Digital Literacy for teachers and students."}, {"letter": "C", "text": "Allocating funds to support DepEd Computerization Program"}, {"letter": "D", "text": "Focusing school-based management on digital technological development and innovations"}], "explanation": "Given that the Philippines is categorized as a Starter in ICT readiness, the most realistic and impactful proposal is providing technical assistance and capacity building on Digital Literacy for teachers and students. This directly addresses the country's current ICT maturity level and is more likely to attract partner support than large infrastructure investments.", "hasImage": false, "imageIdx": null, "intro": "Research on DepEd’s readiness for distance learning, specifically ICT investment, ICT maturity, and digital economic performance, placed the Philippines in the 59th rank out of 79 nations and is categorized as a “Starter.” The research was published by Huawei for the 2020 Global Connectivity Index. Based on the findings, which of the following proposals from the school head has a higher probability of being supported by potential partners?"}, {"num": 140, "officialAnswer": "B", "q": "Which statements are true about the roles of a Senior High School (SHS) school head based on the guidelines on the Organizational Structures and Staffing Patterns of Stand-alone and Integrated Public Senior High School? I. Spearheads the formulation and implementation of the School Improvement Plan and Annual Implementation Plan. II. Assumes leadership in planning, preparing, and delivering the instructional programs for the strands and subjects under his/her subject group. III. Monitors and assesses learners' academic performance, attendance, and behavior in his/her classes. IV. Manages the fiscal and asset resources of the school. V. Ensures the effective implementation of the curriculum inside the classroom. VI. Facilitates organizational efficiency and the effective management of the people systems of the school.", "romanItems": ["I. Spearheads the formulation and implementation of the School Improvement Plan and Annual Implementation Plan.", "II. Assumes leadership in planning, preparing, and delivering the instructional programs for the strands and subjects under his/her subject group.", "III. Monitors and assesses learners' academic performance, attendance, and behavior in his/her classes.", "IV. Manages the fiscal and asset resources of the school.", "V. Ensures the effective implementation of the curriculum inside the classroom.", "VI. Facilitates organizational efficiency and the effective management of the people systems of the school."], "choices": [{"letter": "A", "text": "I, II, V"}, {"letter": "B", "text": "I, IV, VI"}, {"letter": "C", "text": "II, IV, VI"}, {"letter": "D", "text": "II, III, V"}], "explanation": "Under the guidelines on SHS organizational structures, the school head's roles are to spearhead the SIP and AIP formulation and implementation, manage the school's fiscal and asset resources, and facilitate organizational efficiency and people systems management. These correspond to statements I, IV, and VI, which define the school-level administrative and governance functions.", "hasImage": false, "imageIdx": null, "intro": "Which statements are true about the roles of a Senior High School (SHS) school head based on the guidelines on the Organizational Structures and Staffing Patterns of Stand-alone and Integrated Public Senior High School?"}]</script>

<script>
const RAW_Q = JSON.parse(document.getElementById('Q_DATA').textContent);
const IMG   = JSON.parse(document.getElementById('IMG_DATA').textContent);

// ── STATE ──
let questions = [], answers = {}, idx = 0, answered = false;
let correctCount = 0, mode = 'sequential';
let streak = 0, maxStreak = 0;
let wrongSet = new Set(), flagSet = new Set();
let confidence = {}; // itemNum -> 1-3
let startTime, qStartTime, timerInterval;
let explOpen = false;

// ── DOMAIN MAP (approximate by item range) ──
function getDomain(num) {
  if (num <= 28)  return 'School Leadership';
  if (num <= 56)  return 'Instructional Leadership';
  if (num <= 84)  return 'Creating a Learning Environment';
  if (num <= 112) return 'Human Resource Mgmt.';
  return 'Community Partnership';
}

// ── PERSIST ──
function persist() {
  try {
    localStorage.setItem('nash_answers',   JSON.stringify(answers));
    localStorage.setItem('nash_wrong',     JSON.stringify([...wrongSet]));
    localStorage.setItem('nash_flags',     JSON.stringify([...flagSet]));
    localStorage.setItem('nash_confidence',JSON.stringify(confidence));
    localStorage.setItem('nash_streak',    maxStreak);
  } catch(e) {}
}
function restore() {
  try {
    const a = localStorage.getItem('nash_answers');
    const w = localStorage.getItem('nash_wrong');
    const f = localStorage.getItem('nash_flags');
    const c = localStorage.getItem('nash_confidence');
    const ms= localStorage.getItem('nash_streak');
    if (a) answers    = JSON.parse(a);
    if (w) wrongSet   = new Set(JSON.parse(w));
    if (f) flagSet    = new Set(JSON.parse(f));
    if (c) confidence = JSON.parse(c);
    if (ms) maxStreak = parseInt(ms)||0;
  } catch(e) {}
}
restore();

// ── MODE ──
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function updateSplashCounts() {
  const lines = [];
  if (wrongSet.size) lines.push(`❌ Wrong items tracked: <b style="color:#e87070">${wrongSet.size}</b>`);
  if (flagSet.size)  lines.push(`🚩 Flagged items: <b style="color:#f39c12">${flagSet.size}</b>`);
  if (maxStreak)     lines.push(`🔥 Best streak so far: <b style="color:var(--gold2)">${maxStreak}</b>`);
  document.getElementById('splash-counts').innerHTML = lines.join('<br>');
}
updateSplashCounts();

// ── SHUFFLE ──
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── START ──
function startQuiz() {
  idx = 0; answered = false; correctCount = 0; streak = 0; explOpen = false;
  // Reset per-session answer tracking (keep persistent wrong/flag)
  const sessionAnswers = {};

  let pool = [...RAW_Q];
  if (mode === 'wrong-only') {
    if (wrongSet.size) pool = pool.filter(q => wrongSet.has(q.num));
    else { alert('No wrong items tracked yet. Complete a quiz first!'); return; }
  }
  if (mode === 'flagged') {
    if (flagSet.size) pool = pool.filter(q => flagSet.has(q.num));
    else { alert('No flagged items yet. Flag some questions during a quiz!'); return; }
  }
  if (mode === 'shuffle') {
    pool = shuffle(pool).map(q => {
      const tagged   = q.choices.map(c => ({...c, isOff: c.letter === q.officialAnswer}));
      const shuffled = shuffle(tagged).map((c,i)=>({...c, letter: String.fromCharCode(65+i)}));
      const newOff   = shuffled.find(c=>c.isOff)?.letter || q.officialAnswer;
      return {...q, choices: shuffled, officialAnswer: newOff};
    });
  }

  questions = pool;
  answers = sessionAnswers;

  document.getElementById('splash').style.display   = 'none';
  document.getElementById('quiz').style.display     = 'block';
  document.getElementById('summary').style.display  = 'none';
  document.getElementById('tb-tot').textContent = questions.length;

  startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  renderQ();
}

// ── TIMER ──
function tickTimer() {
  const s = Math.floor((Date.now()-startTime)/1000);
  document.getElementById('tb-timer').textContent =
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

// ── RENDER ──
function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderQ() {
  const q = questions[idx];
  answered = !!(answers[q.num]);
  explOpen = false;
  qStartTime = Date.now();

  // Bottom info bar
  const pct = (idx/questions.length)*100;
  document.getElementById('bi-fill').style.width = pct+'%';
  document.getElementById('bi-item').textContent = 'Item ' + String(q.num).padStart(3,'0');
  document.getElementById('tb-cur').textContent  = idx+1;
  document.getElementById('tb-c').textContent    = correctCount;
  document.getElementById('tb-w').textContent    = Object.values(answers).filter(a=>!a.correct).length;

  // Nav buttons
  document.getElementById('btn-prev').disabled = idx===0;
  document.getElementById('btn-expl').disabled = !answered;
  document.getElementById('btn-expl').textContent = '💡 Explain';

  const isFlagged = flagSet.has(q.num);
  const flagBtn = document.getElementById('btn-flag');
  flagBtn.textContent = isFlagged ? '🚩' : '🏳';
  flagBtn.classList.toggle('flagged', isFlagged);

  const pctDone = Math.round((idx/questions.length)*100);
  document.getElementById('bstatus').textContent = pctDone + '% done';

  // ── BUILD HTML ──
  let html = '';

  // Item header — answer HIDDEN
  const prevAns = answers[q.num];
  const revealedClass = prevAns ? (prevAns.correct ? 'correct-rev' : 'wrong-rev') : '';
  const revealedText  = prevAns ? `✓ Official: <b>${q.officialAnswer}</b>` : '';







  // Intro
  if (q.intro) html += `<div class="q-intro">${escH(q.intro)}</div>`;

  // Image
  if (q.hasImage && IMG[q.num]) {
    html += `<div class="q-image">
      <img src="${IMG[q.num]}" alt="Reference figure for Item ${q.num}" loading="lazy">
      <div class="img-cap">↑ Reference table/figure for this item</div>
    </div>`;
  }

  // Roman items
  if (q.romanItems && q.romanItems.length) {
    html += '<div class="roman-list">';
    q.romanItems.forEach(item => {
      const m = item.match(/^([IVX]+)\.\s+(.+)$/);
      if (m) html += `<div class="roman-item"><span class="roman-num">${m[1]}.</span><span>${escH(m[2])}</span></div>`;
      else   html += `<div class="roman-item"><span>${escH(item)}</span></div>`;
    });
    html += '</div>';
  }

  // Choices
  html += '<div class="choices" id="choices-wrap">';
  q.choices.forEach((c, ci) => {
    let cls = '';
    if (prevAns) {
      if (c.letter === q.officialAnswer) cls = ci===parseInt(prevAns.choiceIdx) ? 'correct-pick' : 'show-correct';
      else if (ci===parseInt(prevAns.choiceIdx)) cls = 'wrong-pick';
    }
    html += `<button class="choice-btn ${cls}" id="cbtn-${ci}" onclick="selectAnswer(${ci})" ${prevAns?'disabled':''}>
      <div class="cletter-wrap"><span class="cletter">${c.letter}</span></div>
      <div class="ctext">${escH(c.text)}</div>
    </button>`;
  });
  html += '</div>';

  // Feedback (if previously answered)
  if (prevAns) {
    const officialText = q.choices.find(c=>c.letter===q.officialAnswer)?.text||'';
    html += `<div class="feedback-bar ${prevAns.correct?'fb-correct':'fb-wrong'}">
      <span class="fb-icon">${prevAns.correct?'✅':'❌'}</span>
      <span>${prevAns.correct
        ? 'Correct! Well done, Sir Orlando.'
        : `Incorrect. Official answer: <strong>${q.officialAnswer}. ${escH(officialText)}</strong>`
      }</span>
    </div>`;
  } else {
    html += `<div class="feedback-bar" id="feedback-bar"></div>`;
  }

  // Explanation box
  html += `<div class="expl-box" id="expl-box">
    <div class="expl-label">📖 Explanation</div>
    <div id="expl-text">${escH(q.explanation||'No explanation available for this item.')}</div>
  </div>`;

  // Domain + Confidence at bottom — out of the way
  const conf = confidence[q.num] || 0;
  html += `<div class="bottom-meta">
    <span class="domain-badge">📚 ${getDomain(q.num)}</span>
    ${!prevAns ? `<div class="confidence-wrap">
      <span class="conf-label">Confidence:</span>
      <div class="conf-dots">
        <div class="conf-dot ${conf===1?'selected':''}" onclick="setConf(${q.num},1)" title="Low — guessing">😰</div>
        <div class="conf-dot ${conf===2?'selected':''}" onclick="setConf(${q.num},2)" title="Medium — unsure">🤔</div>
        <div class="conf-dot ${conf===3?'selected':''}" onclick="setConf(${q.num},3)" title="High — confident">💪</div>
      </div>
    </div>` : ''}
  </div>`;

  document.getElementById('q-wrap').innerHTML = html;
  window.scrollTo({top:0,behavior:'instant'});
}

// ── SELECT ANSWER ──
// ── AUDIO ENGINE ──
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playCorrect() {
  // Warm chime: two pleasant ascending tones
  [[523.25, 0, 0.08], [659.25, 0.08, 0.08], [783.99, 0.16, 0.1], [1046.5, 0.24, 0.18]].forEach(([freq, when, dur]) => {
    const osc  = AC.createOscillator();
    const gain = AC.createGain();
    osc.connect(gain); gain.connect(AC.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, AC.currentTime + when);
    gain.gain.setValueAtTime(0, AC.currentTime + when);
    gain.gain.linearRampToValueAtTime(0.28, AC.currentTime + when + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
    osc.start(AC.currentTime + when);
    osc.stop(AC.currentTime + when + dur + 0.05);
  });
}

function playWrong() {
  // Low buzzy error thud
  [[180, 0, 0.12, 'sawtooth', 0.3], [90, 0.1, 0.18, 'square', 0.2]].forEach(([freq, when, dur, type, vol]) => {
    const osc  = AC.createOscillator();
    const gain = AC.createGain();
    const dist = AC.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i=0;i<256;i++) curve[i] = (i/128-1) * 0.5;
    dist.curve = curve;
    osc.connect(dist); dist.connect(gain); gain.connect(AC.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, AC.currentTime + when);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, AC.currentTime + when + dur);
    gain.gain.setValueAtTime(vol, AC.currentTime + when);
    gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
    osc.start(AC.currentTime + when);
    osc.stop(AC.currentTime + when + dur + 0.05);
  });
}

function flashScreen(isCorrect) {
  const el = document.getElementById('flash-overlay');
  el.className = '';
  void el.offsetWidth; // reflow to restart animation
  el.className = isCorrect ? 'flash-correct' : 'flash-wrong';
}

function selectAnswer(ci) {
  if (answered) return;
  // Resume audio context if suspended (browser autoplay policy)
  if (AC.state === 'suspended') AC.resume();
  answered = true;
  const q = questions[idx];
  const chosen = q.choices[ci];
  const isCorrect = chosen.letter === q.officialAnswer;
  const timeSec = Math.round((Date.now()-qStartTime)/1000);

  if (isCorrect) { correctCount++; streak++; maxStreak = Math.max(maxStreak,streak); }
  else           { streak = 0; wrongSet.add(q.num); }

  answers[q.num] = { correct: isCorrect, choiceIdx: ci, yourLetter: chosen.letter, timeSec };
  persist();

  // 🔊 Sound + 💡 Flash — immediate, simultaneous
  isCorrect ? playCorrect() : playWrong();
  flashScreen(isCorrect);

  // Highlight choices
  q.choices.forEach((c, i) => {
    const btn = document.getElementById('cbtn-'+i);
    if (!btn) return;
    btn.disabled = true;
    if (c.letter === q.officialAnswer) btn.classList.add(i===ci?'correct-pick':'show-correct');
    else if (i===ci) btn.classList.add('wrong-pick');
  });



  // Feedback bar
  const fb = document.getElementById('feedback-bar');
  const officialText = q.choices.find(c=>c.letter===q.officialAnswer)?.text||'';
  fb.className = 'feedback-bar '+(isCorrect?'fb-correct':'fb-wrong');
  fb.innerHTML = isCorrect
    ? `<span class="fb-icon">✅</span><span>Correct! <span class="fb-streak">🔥 Streak: ${streak}</span></span>`
    : `<span class="fb-icon">❌</span>
       <div>
         <div style="font-size:17px;margin-bottom:6px;opacity:.85;">Incorrect — the official answer is:</div>
         <div class="fb-correct-ans">${q.officialAnswer}. &nbsp;${escH(officialText)}</div>
       </div>`;

  // Streak toast
  if (isCorrect && streak > 1 && streak % 3 === 0) showStreakToast(streak);

  // Update top bar
  document.getElementById('tb-c').textContent = correctCount;
  document.getElementById('tb-w').textContent = Object.values(answers).filter(a=>!a.correct).length;
  document.getElementById('btn-expl').disabled = false;
  document.getElementById('bi-fill').style.width = ((idx+1)/questions.length*100)+'%';

  // ⏭ Auto-advance: correct=900ms, wrong=1600ms (extra time to absorb correct answer)
  const delay = isCorrect ? 900 : 1600;
  setTimeout(() => {
    if (idx < questions.length - 1) { idx++; renderQ(); }
    else showSummary();
  }, delay);
}

function showStreakToast(n) {
  const t = document.getElementById('streak-toast');
  t.innerHTML = `🔥 ${n}-answer streak! Keep it up, Sir Orlando!`;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

// ── EXPLANATION ──
function toggleExpl() {
  if (!answered) return;
  explOpen = !explOpen;
  const box = document.getElementById('expl-box');
  const btn = document.getElementById('btn-expl');
  box.classList.toggle('open', explOpen);
  btn.textContent = explOpen ? '🙈 Hide' : '💡 Explain';
}

// ── FLAG ──
function toggleFlag() {
  const q = questions[idx];
  if (flagSet.has(q.num)) flagSet.delete(q.num);
  else flagSet.add(q.num);
  persist();
  const isFlagged = flagSet.has(q.num);
  const btn = document.getElementById('btn-flag');
  btn.textContent = isFlagged ? '🚩' : '🏳';
  btn.classList.toggle('flagged', isFlagged);
}

// ── CONFIDENCE ──
function setConf(num, val) {
  confidence[num] = val;
  persist();
  document.querySelectorAll('.conf-dot').forEach((d,i)=>d.classList.toggle('selected',i+1===val));
}

// ── NAV ──
function goNext() {
  if (idx < questions.length-1) { idx++; renderQ(); }
  else showSummary();
}
function goPrev() {
  if (idx > 0) { idx--; renderQ(); }
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (document.getElementById('quiz').style.display !== 'block') return;
  const k = e.key.toUpperCase();
  if (!answered) {
    if (k==='A') document.getElementById('cbtn-0')?.click();
    if (k==='B') document.getElementById('cbtn-1')?.click();
    if (k==='C') document.getElementById('cbtn-2')?.click();
    if (k==='D') document.getElementById('cbtn-3')?.click();
    if (k==='F') toggleFlag();
  } else {
    if (k==='ENTER'||k==='ARROWRIGHT') goNext();
    if (k==='ARROWLEFT') goPrev();
    if (k==='E') toggleExpl();
    if (k==='F') toggleFlag();
  }
});

// Swipe
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  if (document.getElementById('quiz').style.display!=='block') return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60&&answered){dx<0?goNext():goPrev();}
});

// ── SUMMARY ──
function showSummary() {
  clearInterval(timerInterval);
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('summary').style.display = 'block';
  window.scrollTo({top:0,behavior:'instant'});

  const allAns = Object.entries(answers).map(([num, a]) => ({num:parseInt(num),...a}));
  const total  = allAns.length;
  const correct= allAns.filter(a=>a.correct).length;
  const wrong  = total-correct;
  const pct    = total?Math.round((correct/total)*100):0;
  const totalSec=Math.floor((Date.now()-startTime)/1000);
  const avgSec = total?Math.round(totalSec/total):0;
  const mins=Math.floor(totalSec/60), secs=totalSec%60;

  // Domain breakdown
  const domains = {};
  allAns.forEach(a => {
    const q = RAW_Q.find(q=>q.num===a.num);
    if (!q) return;
    const d = getDomain(q.num);
    if (!domains[d]) domains[d] = {correct:0,total:0};
    domains[d].total++;
    if (a.correct) domains[d].correct++;
  });

  let domHtml = '';
  Object.entries(domains).forEach(([d,v]) => {
    const dp = v.total?Math.round((v.correct/v.total)*100):0;
    domHtml += `<div class="db-row">
      <div class="db-label">${d}</div>
      <div class="db-bar-outer"><div class="db-bar-inner" style="width:${dp}%;background:${dp>=75?'var(--correct)':'var(--wrong)'}"></div></div>
      <div class="db-pct">${dp}%</div>
    </div>`;
  });

  const remark = pct>=90?'🏆 Outstanding! Excellent!'
    : pct>=75?'🎉 Passing Score — Great job, Sir Orlando!'
    : pct>=60?'📚 Almost there — review the wrong items!'
    : '💪 Keep studying — you\'ve got this!';

  document.getElementById('summary').innerHTML = `
    <div class="score-hero">
      <h2>Exam Complete!</h2>
      <div><span class="score-big">${correct}</span><span class="score-den">/${total}</span></div>
      <div class="score-pct">${pct}%</div>
      <div class="sbar-outer"><div class="sbar-inner" id="sbar" style="width:0%"></div></div>
      <div class="tally">
        <div class="tally-item c"><div class="tv">${correct}</div><div class="tl">Correct</div></div>
        <div class="tally-item w"><div class="tv">${wrong}</div><div class="tl">Incorrect</div></div>
      </div>
      <div class="stats-grid">
        <div>⏱ Total time: <span>${mins}m ${secs}s</span></div>
        <div>⌀ Per question: <span>${avgSec}s</span></div>
        <div>🔥 Best streak: <span>${maxStreak}</span></div>
        <div>🚩 Flagged: <span>${flagSet.size}</span></div>
      </div>
      <div class="remark">${remark}</div>
      <button class="btn-start" onclick="showSplash()">↺ &nbsp;Back to Menu</button>
    </div>
    ${domHtml?`<div class="domain-break"><h3>Performance by Domain</h3>${domHtml}</div>`:''}
    <div class="filter-row">
      <button class="filt-btn active" onclick="filterSum('all',this)">All (${total})</button>
      <button class="filt-btn" onclick="filterSum('wrong',this)">❌ Wrong (${wrong})</button>
      <button class="filt-btn" onclick="filterSum('correct',this)">✅ Correct (${correct})</button>
      <button class="filt-btn" onclick="filterSum('flagged',this)">🚩 Flagged (${flagSet.size})</button>
    </div>
    <div class="sum-list" id="sum-list"></div>`;

  setTimeout(()=>{ const b=document.getElementById('sbar'); if(b) b.style.width=pct+'%'; },150);
  filterSum('all', document.querySelector('.filt-btn.active'));
}

function filterSum(filter, btn) {
  document.querySelectorAll('.filt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const allAns = Object.entries(answers).map(([num,a])=>({num:parseInt(num),...a}));
  let list = allAns;
  if (filter==='wrong')   list=allAns.filter(a=>!a.correct);
  if (filter==='correct') list=allAns.filter(a=>a.correct);
  if (filter==='flagged') list=allAns.filter(a=>flagSet.has(a.num));
  const el=document.getElementById('sum-list');
  if (!list.length) { el.innerHTML='<p style="color:var(--muted);text-align:center;padding:30px;font-size:18px;">No items in this category.</p>'; return; }
  el.innerHTML=list.map(a=>{
    const q=RAW_Q.find(q=>q.num===a.num);
    const yourChoice=q?.choices.find(c=>c.letter===a.yourLetter);
    const offChoice =q?.choices.find(c=>c.letter===q.officialAnswer);
    return `<div class="sum-item ${a.correct?'c':'w'} ${flagSet.has(a.num)?'flagged':''}">
      <div class="sum-n">#${String(a.num).padStart(3,'0')}${flagSet.has(a.num)?' 🚩':''}</div>
      <div class="sum-body">
        <div class="sum-q">${escH((q?.intro||'').substring(0,100))}${(q?.intro||'').length>100?'…':''}</div>
        ${!a.correct?`<div class="sum-your">✗ Your: ${a.yourLetter}. ${escH((yourChoice?.text||'').substring(0,70))}</div>`:''}
        <div class="sum-ans">✓ Official: ${q?.officialAnswer}. ${escH((offChoice?.text||'').substring(0,70))}</div>
        <div class="sum-meta">⏱ ${a.timeSec}s &nbsp;|&nbsp; ${getDomain(a.num)}</div>
      </div>
      <div class="sum-icon">${a.correct?'✅':'❌'}</div>
    </div>`;
  }).join('');
}

function showSplash() {
  document.getElementById('summary').style.display='none';
  document.getElementById('quiz').style.display='none';
  document.getElementById('splash').style.display='flex';
  updateSplashCounts();
  window.scrollTo({top:0,behavior:'instant'});
}
</script>
