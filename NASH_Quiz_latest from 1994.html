<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test — May 2026</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07111f;
  --surface: #0d1e32;
  --surface2: #122840;
  --border: #1e3a55;
  --gold: #c9a84c;
  --gold2: #e8c97a;
  --gold3: #f5e4b0;
  --cream: #f0ead8;
  --muted: #7a98b4;
  --correct: #27ae60;
  --correct-bg: #062415;
  --wrong: #c0392b;
  --wrong-bg: #240606;
  --reveal: #1565c0;
  --reveal-bg: #0a1e38;
  --radius: 12px;
  --text-q: 34px;
  --text-choice: 32px;
  --text-roman: 30px;
}

html { scroll-behavior: auto; }
body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--cream); min-height: 100vh; padding-bottom: 160px; }

/* ─── SPLASH ─── */
#splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
.splash-card { background: var(--surface); border: 2px solid var(--gold); border-radius: 20px; padding: 50px 44px; max-width: 700px; width: 100%; text-align: center; box-shadow: 0 0 60px rgba(201,168,76,0.1); }
.splash-card h1 { font-size: 40px; color: var(--gold2); letter-spacing: 3px; margin-bottom: 6px; }
.splash-sub { font-size: 17px; color: var(--muted); font-style: italic; margin-bottom: 28px; }
.gold-rule { height: 1px; background: linear-gradient(to right,transparent,var(--gold),transparent); margin: 20px 0; }
.stat-row { display: flex; justify-content: center; gap: 50px; margin-bottom: 30px; flex-wrap: wrap; }
.stat .n { font-size: 54px; font-weight: bold; color: var(--gold); line-height: 1; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
.mode-label { font-size: 15px; color: var(--muted); margin-bottom: 12px; }
.mode-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
.mode-btn { padding: 12px 24px; font-size: 16px; font-family: Georgia,serif; border-radius: 10px; cursor: pointer; border: 2px solid var(--border); background: var(--surface2); color: var(--cream); transition: all .2s; }
.mode-btn.active, .mode-btn:hover { border-color: var(--gold); background: #1a3050; color: var(--gold2); }
.btn-start { background: linear-gradient(135deg,#7a5c14,var(--gold) 60%,#e8c97a); color: #000; border: none; padding: 20px 64px; font-size: 22px; font-family: Georgia,serif; font-weight: bold; border-radius: 10px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: transform .1s,opacity .2s; box-shadow: 0 4px 24px rgba(201,168,76,.3); }
.btn-start:hover { opacity: .92; transform: translateY(-2px); }

/* ─── TOP BAR ─── */
#quiz { display: none; }


/* ─── Q WRAP ─── */
.q-wrap { max-width: 920px; margin: 0 auto; padding: 20px 22px 10px; }

/* ITEM HEADER */

.domain-badge { font-size: 13px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); padding: 4px 14px; border-radius: 20px; font-style: italic; }

/* Official answer — hidden until answered */

/* QUESTION */
.q-intro { font-size: var(--text-q); line-height: 1.65; color: var(--cream); margin-bottom: 22px; }
.q-image { margin: 14px 0 22px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface2); padding: 10px; text-align: center; }
.q-image img { max-width: 100%; height: auto; border-radius: 6px; }
.q-image .img-cap { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 8px; }

/* ROMAN LIST */
.roman-list { margin-bottom: 28px; }
.roman-item { display: flex; gap: 14px; font-size: var(--text-roman); line-height: 1.55; color: var(--cream); padding: 10px 0; border-top: 1px solid var(--border); }
.roman-item:first-child { border-top: none; padding-top: 0; }
.roman-num { font-weight: bold; color: var(--gold); min-width: 56px; flex-shrink: 0; }

/* CHOICES */
.choices { display: flex; flex-direction: column; gap: 14px; }
.choice-btn { display: flex; align-items: flex-start; gap: 18px; padding: 20px 22px; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: left; width: 100%; transition: border-color .15s,background .15s,transform .08s; }
.choice-btn:not(:disabled):hover { border-color: var(--gold); background: var(--surface2); transform: translateX(4px); }
.choice-btn:not(:disabled):active { transform: translateX(2px) scale(.995); }
.cletter-wrap { min-width: 52px; height: 52px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.cletter { font-size: 22px; font-weight: bold; color: var(--gold2); }
.ctext { font-size: var(--text-choice); line-height: 1.55; color: var(--cream); padding-top: 7px; flex: 1; }

/* State classes */
.choice-btn.correct-pick { background: var(--correct-bg); border-color: var(--correct); }
.choice-btn.correct-pick .cletter-wrap { background: var(--correct); border-color: var(--correct); }
.choice-btn.correct-pick .cletter { color: #fff; }
.choice-btn.wrong-pick { background: var(--wrong-bg); border-color: var(--wrong); }
.choice-btn.wrong-pick .cletter-wrap { background: var(--wrong); border-color: var(--wrong); }
.choice-btn.wrong-pick .cletter { color: #fff; }
.choice-btn.show-correct { background: var(--correct-bg); border-color: var(--correct); }
.choice-btn.show-correct .cletter-wrap { background: var(--correct); border-color: var(--correct); }
.choice-btn.show-correct .cletter { color: #fff; }
.choice-btn:disabled { cursor: default; }

/* FEEDBACK */
.feedback-bar { display: none; margin-top: 20px; padding: 20px 24px; border-radius: var(--radius); font-size: 22px; align-items: flex-start; gap: 16px; line-height: 1.5; }
.feedback-bar.fb-correct { display: flex; background: var(--correct-bg); border: 2px solid var(--correct); color: #5dda8e; }
.feedback-bar.fb-wrong   { display: flex; background: var(--wrong-bg);   border: 2px solid var(--wrong);   color: #e87070; }
.fb-icon { font-size: 32px; flex-shrink: 0; margin-top: 2px; }
.fb-streak { font-size: 18px; opacity: .8; margin-left: 6px; }
.fb-correct-ans { font-size: 26px; font-weight: bold; color: #5dda8e; line-height: 1.45; margin-top: 2px; }

/* EXPLANATION */
.expl-box { display: none; margin-top: 14px; padding: 20px 22px; background: var(--reveal-bg); border: 2px solid var(--reveal); border-radius: var(--radius); font-size: 20px; line-height: 1.65; color: #b3d4f8; }
.expl-box.open { display: block; }
.expl-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #5b9bd5; margin-bottom: 10px; font-weight: bold; }

/* STREAK TOAST */
.streak-toast { position: fixed; top: 70px; right: 20px; z-index: 999; background: linear-gradient(135deg,#062415,#0a3520); border: 2px solid var(--correct); border-radius: 12px; padding: 14px 20px; font-size: 18px; color: #5dda8e; font-weight: bold; display: none; animation: slideIn .3s ease; box-shadow: 0 4px 20px rgba(39,174,96,.3); }
@keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
@keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
#flash-overlay {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; opacity: 0;
  transition: opacity 0.05s ease;
}
@keyframes flashCorrect {
  0%   { opacity: 0; }
  15%  { opacity: 0.45; }
  100% { opacity: 0; }
}
@keyframes flashWrong {
  0%   { opacity: 0; }
  15%  { opacity: 0.5; }
  100% { opacity: 0; }
}
#flash-overlay.flash-correct {
  background: radial-gradient(ellipse at center, #00ff6a 0%, #1aff7a 40%, transparent 100%);
  animation: flashCorrect 0.75s ease-out forwards;
}
#flash-overlay.flash-wrong {
  background: radial-gradient(ellipse at center, #ff2222 0%, #ff5555 40%, transparent 100%);
  animation: flashWrong 0.75s ease-out forwards;
}

/* CONFIDENCE DOTS */
.bottom-meta { margin-top: 32px; padding: 18px 0 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.confidence-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.conf-label { font-size: 14px; color: var(--muted); }
.conf-dots { display: flex; gap: 8px; }
.conf-dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface2); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.conf-dot:hover { border-color: var(--gold); transform: scale(1.1); }
.conf-dot.selected { border-color: var(--gold); background: rgba(201,168,76,.2); }

/* ─── BOTTOM BAR ─── */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; display: flex; flex-direction: column; padding: 8px 16px 10px; background: rgba(7,17,31,.92); backdrop-filter: blur(16px); border-top: 1px solid rgba(201,168,76,.22); gap: 6px; }
.bbar-info { display: flex; align-items: center; gap: 10px; width: 100%; }
.bbar-nav  { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.bnav { display: flex; gap: 8px; align-items: center; }
.bpbar-outer { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.bpbar-inner { height: 100%; background: linear-gradient(to right,var(--gold),#27ae60); border-radius: 2px; transition: width .4s; }
.bi-item  { font-size: 13px; font-weight: bold; color: var(--gold2); white-space: nowrap; }
.bi-q     { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bi-score { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bi-score .c { color: #5dda8e; font-weight: bold; }
.bi-score .w { color: #e87070; font-weight: bold; }
.bi-timer { font-size: 13px; color: var(--muted); font-family: monospace; background: var(--surface2); padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
.nav-btn { padding: 8px 16px; font-size: 14px; font-family: Georgia,serif; border-radius: 8px; cursor: pointer; border: 1px solid rgba(201,168,76,.25); background: rgba(255,255,255,.04); color: rgba(240,234,216,.65); transition: all .2s; white-space: nowrap; }
.nav-btn:hover:not(:disabled) { background: rgba(201,168,76,.15); border-color: var(--gold); color: var(--gold2); }
.nav-btn:disabled { opacity: .28; cursor: default; }
.nav-btn.expl-btn { color: rgba(100,160,220,.8); border-color: rgba(100,160,220,.25); }
.nav-btn.expl-btn:hover:not(:disabled) { background: rgba(21,101,192,.2); border-color: var(--reveal); color: #90caf9; }
.nav-btn.next-btn { color: rgba(201,168,76,.9); border-color: rgba(201,168,76,.35); }
.nav-btn.next-btn:hover:not(:disabled) { background: rgba(201,168,76,.15); border-color: var(--gold); color: var(--gold2); }
.nav-btn.flag-btn.flagged { color: #f39c12; border-color: #f39c12; background: rgba(243,156,18,.12); }
.bstatus { font-size: 12px; color: #5b9bd5; text-align: center; flex: 1; min-width: 0; }

/* FLAGGED indicator */
.flag-indicator { position: absolute; top: 10px; right: 10px; font-size: 20px; display: none; }
.flag-indicator.visible { display: block; }

/* ─── SUMMARY ─── */
#summary { display: none; padding: 30px 22px 140px; max-width: 920px; margin: 0 auto; }
.score-hero { background: var(--surface); border: 2px solid var(--gold); border-radius: 20px; padding: 44px; text-align: center; margin-bottom: 24px; box-shadow: 0 0 60px rgba(201,168,76,.1); }
.score-hero h2 { font-size: 26px; color: var(--gold2); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; }
.score-big { font-size: 90px; font-weight: bold; color: var(--gold); line-height: 1; }
.score-den { font-size: 32px; color: var(--muted); }
.score-pct { font-size: 38px; color: var(--gold2); margin: 8px 0 20px; }
.sbar-outer { width: 100%; height: 18px; background: var(--surface2); border-radius: 9px; overflow: hidden; margin-bottom: 24px; }
.sbar-inner { height: 100%; background: linear-gradient(to right,var(--correct),var(--gold)); border-radius: 9px; transition: width 1.2s ease; }
.tally { display: flex; justify-content: center; gap: 60px; flex-wrap: wrap; margin-bottom: 20px; }
.tally-item .tv { font-size: 46px; font-weight: bold; }
.tally-item .tl { font-size: 15px; color: var(--muted); }
.tally-item.c .tv { color: #5dda8e; }
.tally-item.w .tv { color: #e87070; }
.stats-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 40px; font-size: 16px; color: var(--muted); margin-bottom: 26px; }
.stats-grid span { color: var(--gold2); }
.remark { font-size: 20px; margin-bottom: 24px; }

/* DOMAIN BREAKDOWN */
.domain-break { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 22px 26px; margin-bottom: 24px; }
.domain-break h3 { font-size: 18px; color: var(--gold2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
.db-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-size: 16px; }
.db-label { min-width: 180px; color: var(--cream); }
.db-bar-outer { flex: 1; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
.db-bar-inner { height: 100%; border-radius: 5px; background: var(--gold); transition: width 1s ease; }
.db-pct { min-width: 44px; text-align: right; color: var(--gold2); font-size: 15px; }

.filter-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
.filt-btn { padding: 10px 22px; font-size: 16px; border-radius: 20px; border: 2px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all .2s; }
.filt-btn.active { background: var(--gold); border-color: var(--gold); color: #000; font-weight: bold; }
.sum-list { display: flex; flex-direction: column; gap: 10px; }
.sum-item { display: flex; gap: 14px; background: var(--surface); border-radius: 10px; padding: 16px 18px; border-left: 4px solid var(--border); align-items: flex-start; font-size: 17px; line-height: 1.5; }
.sum-item.c { border-left-color: var(--correct); }
.sum-item.w { border-left-color: var(--wrong); }
.sum-item.flagged { outline: 1px solid #f39c12; }
.sum-n { font-size: 14px; color: var(--muted); min-width: 44px; }
.sum-body { flex: 1; }
.sum-q { color: #ccc; margin-bottom: 5px; font-size: 15px; }
.sum-your { color: #e87070; font-size: 15px; }
.sum-ans { color: #5dda8e; font-size: 15px; }
.sum-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.sum-icon { font-size: 24px; }

@media(max-width:640px){
  :root{--text-q:25px;--text-choice:23px;--text-roman:21px;}
  .score-big{font-size:64px;}
  .splash-card{padding:36px 20px;}
  .db-label{min-width:130px;font-size:14px;}
}
</style>
</head>
<body>

<!-- ─── SPLASH ─── -->
<div id="splash">
  <div class="splash-card">
    <h1>NASH Mock Test</h1>
    <p class="splash-sub">National Assessment for School Heads · May 2026</p>
    <div class="gold-rule"></div>
    <div class="stat-row">
      <div class="stat"><div class="n">140</div><div class="l">Items</div></div>
      <div class="stat"><div class="n">A–D</div><div class="l">Choices</div></div>
      <div class="stat"><div class="n">75%</div><div class="l">Passing</div></div>
    </div>
    <div class="gold-rule"></div>
    <p class="mode-label">Select Mode</p>
    <div class="mode-grid">
      <button class="mode-btn active" id="mode-seq"   onclick="setMode('sequential',this)">📋 Sequential</button>
      <button class="mode-btn"        id="mode-shuf"  onclick="setMode('shuffle',this)">🔀 Shuffle All</button>
      <button class="mode-btn"        id="mode-wrong" onclick="setMode('wrong-only',this)">❌ Wrong Items Only</button>
      <button class="mode-btn"        id="mode-flag"  onclick="setMode('flagged',this)">🚩 Flagged Items</button>
    </div>
    <button class="btn-start" onclick="startQuiz()">▶ &nbsp;Begin Exam</button>
    <div id="splash-counts" style="margin-top:18px;font-size:15px;color:var(--muted);line-height:1.8;"></div>
  </div>
</div>

<!-- STREAK TOAST -->
<div class="streak-toast" id="streak-toast"></div>
<div id="flash-overlay"></div>

<!-- ─── QUIZ ─── -->
<div id="quiz">


  <div class="q-wrap" id="q-wrap"><!-- JS renders here --></div>

  <div class="bottom-bar">
    <!-- Info row: item · progress bar · q# · score · timer -->
    <div class="bbar-info">
      <span class="bi-item" id="bi-item">Item 001</span>
      <div class="bpbar-outer"><div class="bpbar-inner" id="bi-fill" style="width:0%"></div></div>
      <span class="bi-q">Q <b id="tb-cur">1</b>/<b id="tb-tot">140</b></span>
      <span class="bi-score">✓ <span class="c" id="tb-c">0</span> &nbsp;✗ <span class="w" id="tb-w">0</span></span>
      <span class="bi-timer" id="tb-timer">00:00</span>
    </div>
    <!-- Nav row: Prev · Explain · [pct] · Next -->
    <div class="bbar-nav">
      <div class="bnav">
        <button class="nav-btn" id="btn-prev" onclick="goPrev()" disabled>◀ Prev</button>
        <button class="nav-btn flag-btn" id="btn-flag" onclick="toggleFlag()" title="Flag for review">🚩</button>
        <button class="nav-btn expl-btn" id="btn-expl" onclick="toggleExpl()" disabled>💡 Explain</button>
      </div>
      <div class="bstatus" id="bstatus"></div>
      <div class="bnav">
        <button class="nav-btn next-btn" id="btn-next" onclick="goNext()">Next ▶</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── SUMMARY ─── -->
<div id="summary"></div>

ce in specific disciplines."}, {"letter": "C", "text": "The department head awarded medals and certificates to Grade 10 Academic Excellence Awardees during the Completion Program."}, {"letter": "D", "text": "The school’s division superintendent awarded medals and certificates to Grade 12 Leadership awardees"}], "explanation": "DepEd Order No. 18, s. 2021 specifies that Certificates of Academic Achievement for honor students in Grades 7 to 9 and Grade 11 are awarded by the class adviser. Medals and certificates for Grade 10 and Grade 12 awardees are handled at higher levels, not the department head or division superintendent.", "hasImage": false, "imageIdx": null, "intro": "DepEd Order No. 18, s. 2021 outlines the Interim Guidelines on Giving of Awards and Recognition in Light of the Basic Education Learning Continuity Plan. Which of the following practices was in accordance with the guidelines?"}, {"num": 5, "officialAnswer": "D", "q": "From the given self-rating assessment table below, which school performance indicator should the school head prioritize to improve the level of leadership practice? Table 1: Levels of challenges encountered", "romanItems": [], "choices": [{"letter": "A", "text": "Setting the direction, goals, and objectives of the school"}, {"letter": "B", "text": "Managing school systems and processes in school"}, {"letter": "C", "text": "Promoting quality teaching and learning"}, {"letter": "D", "text": "Engaging stakeholders in initiatives towards the improvement of school communities"}], "explanation": "Based on the self-rating assessment table, the indicator with the lowest performance rating reflects the area needing most attention. Engaging stakeholders is a key dimension of school leadership that directly impacts school community improvement and is often the most challenging for school heads.", "hasImage": true, "imageIdx": 1, "intro": "From the given self-rating assessment table below, which school performance indicator should the school head prioritize to improve the level of leadership practice? Table 1: Levels of challenges encountered"}, {"num": 6, "officialAnswer": "D", "q": "Classroom assessment is an ongoing process of identifying, gathering, organizing, and interpreting quantitative and qualitative information about what learners know and can do, which can be generally categorized into formative and summative assessments. Which of the following statements are true about formative assessment? I. It creates opportunities for the teacher to gather pieces of evidence of learners’ progressive learning. II. It gives the teacher insights into the learners’ strengths, needs, and weaknesses. III. It allows learners to constructively suggest to teachers the best way to handle their class. IV. It enables the teacher to evaluate the effectiveness of the classroom instruction adopted. V. It measures whether the learners have met the content and performance standards. VI. It occurs toward the end of a period of learning to describe the competencies covered by the teacher.", "romanItems": ["I. It creates opportunities for the teacher to gather pieces of evidence of learners’ progressive learning.", "II. It gives the teacher insights into the learners’ strengths, needs, and weaknesses.", "III. It allows learners to constructively suggest to teachers the best way to handle their class.", "IV. It enables the teacher to evaluate the effectiveness of the classroom instruction adopted.", "V. It measures whether the learners have met the content and performance standards.", "VI. It occurs toward the end of a period of learning to describe the competencies covered by the teacher."], "choices": [{"letter": "A", "text": "III, V and VI"}, {"letter": "B", "text": "II, IV and V"}, {"letter": "C", "text": "II, III and VI"}, {"letter": "D", "text": "I, II and IV"}], "explanation": "Formative assessment, as defined in DepEd Order No. 8, s. 2015, is ongoing and designed to gather evidence of learning progress, provide insights into learners' strengths and weaknesses, and evaluate instruction effectiveness. Statements I, II, and IV correctly describe its purpose, while V and VI describe summative assessment.", "hasImage": false, "imageIdx": null, "intro": "Classroom assessment is an ongoing process of identifying, gathering, organizing, and interpreting quantitative and qualitative information about what learners know and can do, which can be generally categorized into formative and summative assessments. Which of the following statements are true about formative assessment?"}, {"num": 7, "officialAnswer": "D", "q": "How is DO 31 s. 2020 (Interim Assessment and Grading) monitored and evaluated at school level? I. School head prepares quarterly report on challenges. II. School head provides PSDS feedback for policy evaluation and improvement. III. Quarterly report on issues submitted to SDO for analysis. IV. School prepares bi‑annual analysis report for District Office.", "romanItems": ["I. School head prepares quarterly report on challenges.", "II. School head provides PSDS feedback for policy evaluation and improvement.", "III. Quarterly report on issues submitted to SDO for analysis.", "IV. School prepares bi‑annual analysis report for District Office."], "choices": [{"letter": "A", "text": "I and III"}, {"letter": "B", "text": "II and IV"}, {"letter": "C", "text": "I, III and IV"}, {"letter": "D", "text": "II, III and IV"}], "explanation": "Under DO 31, s. 2020, monitoring at school level involves the school head providing feedback to the PSDS for policy evaluation, submitting quarterly reports to the SDO for analysis, and preparing bi-annual analysis. The school head does not prepare a separate quarterly report on challenges as a standalone mechanism.", "hasImage": false, "imageIdx": null, "intro": "How is DO 31 s. 2020 (Interim Assessment and Grading) monitored and evaluated at school level?"}, {"num": 8, "officialAnswer": "C", "q": "Which statements are true about reflective thinking? I. Leads to engagement, creativity, and innovation. II. Considers only the self to improve practice. III. Most effective only after something happens. IV. Challenges the status quo and level of practice. V. Enhances awareness of one’s environment.", "romanItems": ["I. Leads to engagement, creativity, and innovation.", "II. Considers only the self to improve practice.", "III. Most effective only after something happens.", "IV. Challenges the status quo and level of practice.", "V. Enhances awareness of one’s environment."], "choices": [{"letter": "A", "text": "II and III"}, {"letter": "B", "text": "II and V"}, {"letter": "C", "text": "I, III and IV"}, {"letter": "D", "text": "I, IV and V"}], "explanation": "Reflective thinking involves examining one's practice critically, leading to creativity and innovation, and challenging the status quo. It is not limited to only after events occur, and it considers both self and environment. Statements I, III, and IV best capture the nature of reflective practice in professional development.", "hasImage": false, "imageIdx": null, "intro": "Which statements are true about reflective thinking?"}, {"num": 9, "officialAnswer": "B", "q": "At year‑end recognition, some teachers challenge awardees’ qualifications. What mechanism should the school head apply?", "romanItems": [], "choices": [{"letter": "A", "text": "Recognize all personnel to avoid complaints."}, {"letter": "B", "text": "Adopt locally crafted criteria validated by stakeholders and communicated clearly to personnel."}, {"letter": "C", "text": "Adopt other schools’ criteria and align with school context."}, {"letter": "D", "text": "Follow division rewards and recognition criteria only."}], "explanation": "To prevent conflicts during recognition activities, the school head must establish transparent, locally crafted criteria that are validated by stakeholders and communicated clearly in advance. This practice aligns with good governance and due process under DepEd's human resource management principles.", "hasImage": false, "imageIdx": null, "intro": "At year‑end recognition, some teachers challenge awardees’ qualifications. What mechanism should the school head apply?"}, {"num": 10, "officialAnswer": "D", "q": "After DPWH turned over a 2‑classroom building, students move in and find non‑functional lights and broken jalousies on day one. Which procedure did the school head fail to perform?", "romanItems": [], "choices": [{"letter": "A", "text": "Acceptance of construction materials upon delivery"}, {"letter": "B", "text": "Conduct of size and material strength test"}, {"letter": "C", "text": "Monitoring of the development of the project through the School Building Coordinator or property custodian"}, {"letter": "D", "text": "Post-technical inspection before the acceptance of the completed project"}], "explanation": "Before formally accepting a completed infrastructure project, the school head must conduct a post-technical inspection to verify that the construction meets specifications and is functional. Skipping this step results in accepting defective facilities, as described in the scenario where lights and jalousies were non-functional on day one.", "hasImage": false, "imageIdx": null, "intro": "After DPWH turned over a 2‑classroom building, students move in and find non‑functional lights and broken jalousies on day one. Which procedure did the school head fail to perform?"}, {"num": 11, "officialAnswer": "C", "q": "A school head wanted to employ transformational leadership. He/she planned to use his energy, enthusiasm, and passion to inspire positive changes among his/her colleagues. How could the school head help his colleagues succeed in leading their respective schools?", "romanItems": [], "choices": [{"letter": "A", "text": "Model to fellow school heads how to execute a more systematic process of reflecting on past experiences to improve practices."}, {"letter": "B", "text": "Provide an avenue for them to clarify their practices' gray areas to recalibrate or totally change."}, {"letter": "C", "text": "Share best practices and encourage them to implement programs, projects, and activities suitable to their schools."}, {"letter": "D", "text": "Motivate them to accomplish programs, projects, and activities within the timeline"}], "explanation": "Transformational leadership involves inspiring and empowering others through shared best practices and encouraging contextually-appropriate innovations. Sharing best practices and encouraging colleagues to implement suitable programs, projects, and activities motivates them and builds collective leadership capacity.", "hasImage": false, "imageIdx": null, "intro": "A school head wanted to employ transformational leadership. He/she planned to use his energy, enthusiasm, and passion to inspire positive changes among his/her colleagues. How could the school head help his colleagues succeed in leading their respective schools?"}, {"num": 12, "officialAnswer": "C", "q": "Which reflection gives the clearest view of weekly progress?", "romanItems": [], "choices": [{"letter": "A", "text": "3 out of 30 students need remediation classes."}, {"letter": "B", "text": "27 out of 30 students earned 80% and above in the evaluation."}, {"letter": "C", "text": "5 out of 30 students caught up with the required remediation."}, {"letter": "D", "text": "1 out of 30 students was observed to have a vision problem."}], "explanation": "The most meaningful reflection on weekly progress focuses on learner growth and improvement — specifically, students who caught up through remediation. This directly measures the effectiveness of instructional interventions, making it the clearest indicator of weekly progress compared to static data points.", "hasImage": false, "imageIdx": null, "intro": "Which reflection gives the clearest view of weekly progress?"}, {"num": 13, "officialAnswer": "B", "q": "Most teachers are rated 4 on “plan and deliver teaching strategies responsive to learners in difficult circumstances.” What practice does this indicate?", "romanItems": [], "choices": [{"letter": "A", "text": "Teacher’s instructional strategies respond to individual and group learners’ backgrounds, thus creating an environment where learners feel equally involved."}, {"letter": "B", "text": "Teacher provides thoughtful and appropriate instructional adaptation for individual learner needs to actively engage them in various learning activities."}, {"letter": "C", "text": "Teacher demonstrates an understanding of the purpose and value of learning about learners’ backgrounds to inform instructions."}, {"letter": "D", "text": "Teacher displays familiarity with learners’ background but sometimes lacks responsiveness in addressing them."}], "explanation": "A rating of 4 on this RPMS indicator suggests that the teacher consistently plans and delivers strategies responsive to learners in difficult circumstances, reflecting advanced proficiency. This indicates the teacher regularly differentiates instruction and applies context-sensitive approaches without needing guidance.", "hasImage": false, "imageIdx": null, "intro": "Most teachers are rated 4 on “plan and deliver teaching strategies responsive to learners in difficult circumstances.” What practice does this indicate?"}, {"num": 14, "officialAnswer": "D", "q": "The school head presented the number of facilities needed during the Stakeholders’ Forum. The data is based on the Physical Facility Inventory with the given enrollment information below. According to the school head, the school needs a handwashing facility. However, this was contradicted by the PTA President informing the group that the priority project was the construction of a school clinic since sponsors had already vouched to help. How should the school head convince the stakeholders to support the provision of a handwashing facility?", "romanItems": [], "choices": [{"letter": "A", "text": "Inform the stakeholders that the school is promoting the culture of handwashing as part of the infection and prevention control mechanism."}, {"letter": "B", "text": "Present to the stakeholders that prioritizing the project is a response to the Priority Improvement Areas indicated in the School Improvement Plan."}, {"letter": "C", "text": "Assure the stakeholders that the handwashing facility will be constructed at the entrance of the school."}, {"letter": "D", "text": "Inform the stakeholders that the project is required as it answers the pupil to group facility ratio of 1 is 200 for one shift."}], "explanation": "Under DepEd's guidelines on class suspension, a school head may suspend classes in emergency situations without prior coordination when there is an imminent threat to life and safety. The authority to act immediately in life-threatening situations takes precedence over the normal procedure of notifying the SDO first.", "hasImage": true, "imageIdx": 2, "intro": "The school head presented the number of facilities needed during the Stakeholders’ Forum. The data is based on the Physical Facility Inventory with the given enrollment information below. According to the school head, the school needs a handwashing facility. However, this was contradicted by the PTA President informing the group that the priority project was the construction of a school clinic since sponsors had already vouched to help. How should the school head convince the stakeholders to support the provision of a handwashing facility?"}, {"num": 15, "officialAnswer": "C", "q": "To be able to foster an enabling and supportive environment for learners, a school head encouraged his staff to work on their School-Based Management (SBM) practices. Which of the following premises will encourage his/her staff to start working on their SBM? I. Schools can exist at the mercy of the community. II. Community linkages should be prioritized for a supportive environment. III. Schools should be ready to link with the community to facilitate infrastructure projects. IV. School partnership is essential for the creation and improvement of the learning environment. V. School’s rapport with the community can lead to improved student achievement. VI. School achievement or success depends only on the school staff.", "romanItems": ["I. Schools can exist at the mercy of the community.", "II. Community linkages should be prioritized for a supportive environment.", "III. Schools should be ready to link with the community to facilitate infrastructure projects.", "IV. School partnership is essential for the creation and improvement of the learning environment.", "V. School’s rapport with the community can lead to improved student achievement.", "VI. School achievement or success depends only on the school staff."], "choices": [{"letter": "A", "text": "I, II, III"}, {"letter": "B", "text": "III, IV, V"}, {"letter": "C", "text": "II, III, IV"}, {"letter": "D", "text": "I, II, VI"}], "explanation": "In addressing school-community issues identified through SWOT analysis, the school head must take systemic and collaborative action. Working with the LGU, PTA, and other stakeholders to implement interventions addresses the root cause of student absenteeism linked to external factors like computer shops.", "hasImage": false, "imageIdx": null, "intro": "To be able to foster an enabling and supportive environment for learners, a school head encouraged his staff to work on their School-Based Management (SBM) practices. Which of the following premises will encourage his/her staff to start working on their SBM?"}, {"num": 16, "officialAnswer": "A", "q": "What does the table below imply about the organizational structures and staffing patterns of Stand-Alone and Integrated Senior High School (SHS)? Table: Organizational Structures and Staffing Patterns", "romanItems": [], "choices": [{"letter": "A", "text": "The SHS staffing patterns consider the varying needs and contexts of the schools based on population."}, {"letter": "B", "text": "Schools A and D have the same number of staff and population."}, {"letter": "C", "text": "The bigger the schools, the more staff will be assigned."}, {"letter": "D", "text": "School Heads assume the responsibilities if not given Assistant School Head items."}], "explanation": "In inclusive education, the school head must respect and affirm all students' cultural identities. Eliminating discrimination due to cultural identity ensures psychological safety and a supportive learning environment, which is essential for the academic and social development of indigenous peoples and minority learners.", "hasImage": true, "imageIdx": 3, "intro": "What does the table below imply about the organizational structures and staffing patterns of Stand-Alone and Integrated Senior High School (SHS)? Table: Organizational Structures and Staffing Patterns"}, {"num": 17, "officialAnswer": "B", "q": "The Division property disposal team will visit a school to inspect the reported school property for disposal. Which of the following needs to be performed by the school disposal team before the scheduled division inspection? I. Determine if the property is economically repairable or subject to disposal. II. Validate if the item for disposal is listed in the property inventory. III. Determine the current market value of the property. IV. Check the depreciated value of the property based on DepEd issuance. V. Prepare a list of accredited bidders. VI. Convene the Bids and Awards Committee to discuss the bidding procedure.", "romanItems": ["I. Determine if the property is economically repairable or subject to disposal.", "II. Validate if the item for disposal is listed in the property inventory.", "III. Determine the current market value of the property.", "IV. Check the depreciated value of the property based on DepEd issuance.", "V. Prepare a list of accredited bidders.", "VI. Convene the Bids and Awards Committee to discuss the bidding procedure."], "choices": [{"letter": "A", "text": "I, III, V"}, {"letter": "B", "text": "I, II, IV"}, {"letter": "C", "text": "II, III, VI"}, {"letter": "D", "text": "III, V, VI"}], "explanation": "Under the Compensation and Position Classification Act and DBM-CSC-CESB Joint Circular, performance-based incentives are awarded to employees who meet the overall agency performance targets. Employees with at least Satisfactory ratings may qualify if the agency as a whole performs well.", "hasImage": false, "imageIdx": null, "intro": "The Division property disposal team will visit a school to inspect the reported school property for disposal. Which of the following needs to be performed by the school disposal team before the scheduled division inspection?"}, {"num": 18, "officialAnswer": "A", "q": "In designing the class program, the school head assigns six 1‑hour teaching loads to fully utilize the 6‑hour teaching load. Which option follows DM 291 s. 2008 on teachers’ 6‑hour workday?", "romanItems": [], "choices": [{"letter": "A", "text": "With due regard for possible intervals and two-hour teaching-related activities within or outside the school premises to complete the eight-hour daily service requirement."}, {"letter": "B", "text": "Regardless of class intervals and two hours of teaching-related activities, complete the eight-hour requirement."}, {"letter": "C", "text": "In consecutive time slots and two hours of teaching-related activities outside the school to complete eight hours."}, {"letter": "D", "text": "With 2 hours interval per class to be used for teaching-related activities to complete the eight hours."}], "explanation": "Under DepEd Order No. 7, s. 2015, MAPEH teachers with a full teaching load of maximum six hours daily are not required to render additional work after school hours unless otherwise assigned. The school head should explain this policy to the newly-hired colleague to clarify the teacher's obligation.", "hasImage": false, "imageIdx": null, "intro": "In designing the class program, the school head assigns six 1‑hour teaching loads to fully utilize the 6‑hour teaching load. Which option follows DM 291 s. 2008 on teachers’ 6‑hour workday?"}, {"num": 19, "officialAnswer": "A", "q": "After a destructive earthquake, SDO orders resumption of classes. A school in the most devastated area has severely damaged buildings. The school head extends suspension of face‑to‑face classes and on‑site work until a temporary learning shelter is ready, then later informs SDO and the municipal DRRMC. Is the action acceptable?", "romanItems": [], "choices": [{"letter": "A", "text": "Yes, because urgent action is needed to prevent loss of life or bodily harm in the situation."}, {"letter": "B", "text": "Yes, because all school heads have blanket authority to suspend classes anytime."}, {"letter": "C", "text": "No, because he/she should have informed SDO and the DRRMC before announcing the decision."}, {"letter": "D", "text": "No, because the school head does not have authority to suspend classes."}], "explanation": "Under DepEd's criteria for school site ownership, a school site must be covered by a Transfer Certificate of Title, Deed of Donation, or similar legal instrument. An LGU resolution and tax declaration are not sufficient proof of ownership and do not meet the documentary requirements for site validation.", "hasImage": false, "imageIdx": null, "intro": "After a destructive earthquake, SDO orders resumption of classes. A school in the most devastated area has severely damaged buildings. The school head extends suspension of face‑to‑face classes and on‑site work until a temporary learning shelter is ready, then later informs SDO and the municipal DRRMC. Is the action acceptable?"}, {"num": 20, "officialAnswer": "C", "q": "Based on the Strength, Weakness, Opportunities, and Threats (SWOT) analysis, it was found that many learners incurred absences because of the proliferation of computer shops near the school vicinity. Which of the following actions should a school head take? I. Conduct a meeting with parents and inform them of the problem. II. Ask the help of LGU and suggest coming up with an ordinance. III. Request the Barangay Captain for the revocation of the owners’ permit to operate a computer business IV. Talk to the computer shop owners and request them to close their shop during class hours. V. Ask the computer shop operators not to admit school-age children during class hours.", "romanItems": ["I. Conduct a meeting with parents and inform them of the problem.", "II. Ask the help of LGU and suggest coming up with an ordinance.", "III. Request the Barangay Captain for the revocation of the owners’ permit to operate a computer business", "IV. Talk to the computer shop owners and request them to close their shop during class hours.", "V. Ask the computer shop operators not to admit school-age children during class hours."], "choices": [{"letter": "A", "text": "I, II, IV and V"}, {"letter": "B", "text": "I, III and V"}, {"letter": "C", "text": "I, II and V"}, {"letter": "D", "text": "III, IV and V"}], "explanation": "COA Circular No. 89-296 prohibits the use of public school property or resources for generating income that bypasses proper government accounting and auditing procedures. Using school equipment for income-generating projects without complying with this circular constitutes a violation of government accounting rules.", "hasImage": false, "imageIdx": null, "intro": "Based on the Strength, Weakness, Opportunities, and Threats (SWOT) analysis, it was found that many learners incurred absences because of the proliferation of computer shops near the school vicinity. Which of the following actions should a school head take?"}, {"num": 21, "officialAnswer": "C", "q": "A Muslim out-of-school adult and a repeater approached the school head for possible readmission to the school. His/her last level of attendance was at Grade 4. What specific program can the school head offer?", "romanItems": [], "choices": [{"letter": "A", "text": "Madrasah Program"}, {"letter": "B", "text": "Special Education Program"}, {"letter": "C", "text": "Alternative Learning System (ALS)"}, {"letter": "D", "text": "Indigenous Peoples Education"}], "explanation": "Under the PPSSH (Philippine Professional Standards for School Heads), school heads are expected to coach and mentor teachers on data-driven instruction and analysis. Providing training on interpreting diagnostic results helps teachers understand learning gaps and design appropriate interventions.", "hasImage": false, "imageIdx": null, "intro": "A Muslim out-of-school adult and a repeater approached the school head for possible readmission to the school. His/her last level of attendance was at Grade 4. What specific program can the school head offer?"}, {"num": 22, "officialAnswer": "D", "q": "A teacher has been sent to a training that has affected her class performance. As his/her way of coping with the missed lessons, she gave numerous assignments to the learners every weekend. The Science club president reported the situation to the school head. How can the school head address this issue so that it will not recur?", "romanItems": [], "choices": [{"letter": "A", "text": "Advise the teacher to continue giving assignments on weekends so that the competencies for the quarter will be met."}, {"letter": "B", "text": "Advise the teacher to minimize the giving of assignments so that the learners can spend quality time with their families."}, {"letter": "C", "text": "Tell the club president that the teacher will be reprimanded for doing such practice."}, {"letter": "D", "text": "Provide a Learning Support Aide to take over the class whenever the teacher is out for official business."}], "explanation": "The SIP (School Improvement Plan) must be crafted collaboratively with all stakeholders and must be grounded on data from school performance indicators. A properly developed SIP ensures that goals are responsive to the school's needs and aligned with DepEd's thrust.", "hasImage": false, "imageIdx": null, "intro": "A teacher has been sent to a training that has affected her class performance. As his/her way of coping with the missed lessons, she gave numerous assignments to the learners every weekend. The Science club president reported the situation to the school head. How can the school head address this issue so that it will not recur?"}, {"num": 23, "officialAnswer": "C", "q": "Professional networking offers a lot of opportunities for professional growth. Which among the practices of professional networking are most desirable? I. Opportunity to travel II. Benchmarking III. Sponsorship of school projects for professional development IV. Professional connection V. Career Progression", "romanItems": ["I. Opportunity to travel", "II. Benchmarking", "III. Sponsorship of school projects for professional development", "IV. Professional connection", "V. Career Progression"], "choices": [{"letter": "A", "text": "I and IV"}, {"letter": "B", "text": "I and III"}, {"letter": "C", "text": "II, IV and V"}, {"letter": "D", "text": "I, IV and V"}], "explanation": "Under DepEd's Child Protection Policy (DO 40, s. 2012), school heads must immediately act on reports of abuse or bullying by conducting an initial assessment, referring the case to the Child Protection Committee, and ensuring the safety of the child involved.", "hasImage": false, "imageIdx": null, "intro": "Professional networking offers a lot of opportunities for professional growth. Which among the practices of professional networking are most desirable?"}, {"num": 24, "officialAnswer": "D", "q": "The school was able to accomplish several feats, such as recognition of learners and teachers in contests, implementations of school-based innovations, and celebration of partnership endeavors. Which of the following can the school head do to communicate the school’s achievements to stakeholders? I. Post promotional and advocacy materials on the school’s bulletin boards. II. Publish the school’s n  for this endeavor?"}, {"num": 29, "officialAnswer": "A", "q": "The School Division Superintendent announced that the school has been chosen to be converted into an Agricultural School. This is a much-anticipated development in the community. However, as the Municipal Disaster Risk Management Office identified, the school site is in a landslide-prone area. What should the school head do to pursue the said conversion?", "romanItems": [], "choices": [{"letter": "A", "text": "Coordinate with the Local Government Unit to address the identified imminent danger."}, {"letter": "B", "text": "Seek support from the Local Government Unit through a resolution recommending the conversion into an agricultural school."}, {"letter": "C", "text": "Adjust the work and financial plan to include the resources needed in the operation of an agricultural school."}, {"letter": "D", "text": "Prepare an inventory of learning materials, teachers, and facilities for planning and allocation of resources"}], "explanation": "The PPSSH Domain 2 on Learning and Teaching covers the school head's role in ensuring effective instructional leadership. Conducting classroom observations, providing technical assistance, and modeling best practices are key behaviors expected of school heads to improve teaching and learning outcomes.", "hasImage": false, "imageIdx": null, "intro": "The School Division Superintendent announced that the school has been chosen to be converted into an Agricultural School. This is a much-anticipated development in the community. However, as the Municipal Disaster Risk Management Office identified, the school site is in a landslide-prone area. What should the school head do to pursue the said conversion?"}, {"num": 30, "officialAnswer": "C", "q": "A school head is invited to benchmark best practices in another country. The division AO says the superintendent will not sign the travel order unless the trip is on official time (not official business), and there are no funds. What sho icialAnswer": "A", "q": "In modular distance learning, several considerations must be taken before deciding on the type of formative assessment that will help the teacher adjust or prepare for the next lessons. Given the profile of Grade 5 learners below, which alternative way can the school head propose to teachers in getting immediate feedback from learners about a particular concept in the Self-Learning Module?", "romanItems": [], "choices": [{"letter": "A", "text": "Send the question/instruction through the parents' contact number. Let the learners, through the help of parents, send back their understanding of the concept to the teacher thru a text message."}, {"letter": "B", "text": "Send the question/instruction written on a piece of paper to each of the learners' homes and request the parents to bring the learners’ answers to the school."}, {"letter": "C", "text": "Create a group chat for all learners including parents. Post the question and let the learners in turn post their understanding of the concept."}, {"letter": "D", "text": "Assign a focal person from among the parents and request him/her to gather the answers and bring them to the school."}], "explanation": "Under the DepEd Localization Policy, school heads must support teachers in developing locally relevant instructional materials that reflect the learners' community context. Localized materials improve engagement and comprehension by connecting learning to familiar experiences.", "hasImage": false, "imageIdx": null, "intro": "In modular distance learning, several considerations must be taken before deciding on the type of formative assessment that will help the teacher adjust or prepare for the next lessons. Given the profile of Grade 5 learners below, which alternative way can the school head propose to teachers in getting immediate feedback from learners about a particular concept in the Self-Learning Module?"}, {"num": 45, "officialAnswer": "B", "q": "The school head received a report from the  "text": "I, II, and III"}, {"letter": "B", "text": "II, III, and V"}, {"letter": "C", "text": "I, IV, and V"}, {"letter": "D", "text": "III, IV, and VI"}], "explanation": "Under DepEd Order No. 8, s. 2015 on classroom assessment, assessment must be standards-based and aligned with learning competencies. The school head ensures that all summative assessments used by teachers are quality-checked and aligned with the Most Essential Learning Competencies.", "hasImage": false, "imageIdx": null, "intro": "The practice of hazing in school is prohibited under DepEd Order no. 6, s.1954; DepEd Order no.20, s.1991; DepEd Order no. 7, s.2006; and RA 8049. To avoid juvenile violence among the learners, the school head is directed to coordinate with the local government units. Which of the following government agencies should be involved in monitoring and controlling the proliferation of fraternities, sororities, and similar organizations in school?"}, {"num": 47, "officialAnswer": "C", "q": "A newly hired teacher, Mr. Lim, is completing the TIP. He notices that the school has a very active School Governing Council (SGC) that influences many school activities. He is confused about how his role as a new teacher fits into this SBM-driven culture. Question: How can Mr. Lim's knowledge from the TIP, combined with the principles of SBM, help him understand and contribute to the school's collaborative culture?", "romanItems": [], "choices": [{"letter": "A", "text": "The TIP is an individual program, so Mr. Lim should avoid engaging with the SBM structure until he is a veteran teacher."}, {"letter": "B", "text": "Mr. Lim's role is to follow orders, not to participate in SBM, as he is still new to the school."}, {"letter": "C", "text": "The TIP introduces Mr. Lim to DepEd's core values, which include collaboration. He can use this knowledge to embrace SBM by viewing the SGC as a resource and a partner in achieving school goals, aligning his work with the school's decentralized approach."}, {"letter": "D", "text": "Mr. Lim can only contribute to SBM if he is elected as a representative in the SGC."}], "explanation": "The DepEd Learner Information System (LIS) requires accurate and updated enrollment data to be submitted within prescribed timelines. The school head is responsible for ensuring the completeness, accuracy, and timely submission of LIS data for all learners enrolled in the school.", "hasImage": false, "imageIdx": null, "intro": "A newly hired teacher, Mr. Lim, is completing the TIP. He notices that the school has a very active School Governing Council (SGC) that influences many school activities. He is confused about how his role as a new teacher fits into this SBM-driven culture. Question: How can Mr. Lim's knowledge from the TIP, combined with the principles of SBM, help him understand and contribute to the school's collaborative culture?"}, {"num": 48, "officialAnswer": "C", "q": "Upon checking the research findings of certain school-based action research, the school head decided to prioritize the improvement of school facilities and equipment which are conducive to teaching and learning processes. What leadership practice should the school head apply to realize the objectives of the school priority?", "romanItems": [], "choices": [{"letter": "A", "text": "Conduct follow-up action research to ascertain management of the learning environment."}, {"letter": "B", "text": "Include priorities in the School Improvement Plan to ensure the implementation of school projects."}, {"letter": "C", "text": "Discuss with the PTA about school projects to improve the school’s physical aspect."}, {"letter": "D", "text": "Implement the Child-Friendly School System tool to assess the school’s condition."}], "explanation": "Under RA 9155 and the PPSSH, the school head leads the formulation, implementation, and monitoring of the School Improvement Plan in partnership with all school stakeholders. The SIP must reflect the school's vision, mission, and goals aligned with DepEd's thrusts.", "hasImage": false, "imageIdx": null, "intro": "Upon checking the research findings of certain school-based action research, the school head decided to prioritize the improvement of school facilities and equipment which are conducive to teaching and learning processes. What leadership practice should the school head apply to realize the objectives of the school priority?"}, {"num": 49, "officialAnswer": "B", "q": "DepEd sets the guidelines for establishing and implementing RPMS, stipulating the strategies, methods, tools, and rewards for assessing the accomplishments, including the commitments. Which phases of the performance management system cycle should the school head follow for the continuous and consistent work improvement and individual growth of teachers and staff?", "romanItems": [], "choices": [{"letter": "A", "text": "Planning and commitment; review and evaluation; rewarding and development planning; and monitoring and coaching"}, {"letter": "B", "text": "Planning and commitment; monitoring and coaching; review and evaluation; rewarding and development planning"}, {"letter": "C", "text": "Rewarding and development planning; review and evaluation; monitoring and coaching; and planning and commitment"}, {"letter": "D", "text": "Planning and commitment; monitoring and coaching; rewarding and development planning; and review and evaluation"}], "explanation": "The SBM framework emphasizes community participation as a key principle of school governance. The school head must actively involve parents, alumni, LGUs, and other partners in school decision-making, resource mobilization, and program implementation.", "hasImage": false, "imageIdx": null, "intro": "DepEd sets the guidelines for establishing and implementing RPMS, stipulating the strategies, methods, tools, and rewards for assessing the accomplishments, including the commitments. Which phases of the performance management system cycle should the school head follow for the continuous and consistent work improvement and individual growth of teachers and staff?"}, {"num": 50, "officialAnswer": "B", "q": "A Grade 8 MAPEH teacher renders a maximum of six hours of actual classroom teaching per day and leaves the school after work. A newly-hired colleague came to the school head's office and requested an explanation regarding the practice of the said teacher. If you were the school head, what would be your response?", "romanItems": [], "choices": [{"letter": "A", "text": "He/she is subjected to salary deduction for he/she is not exempted from the eight-hour workday based on CSC resolution 080096, revised 2008."}, {"letter": "B", "text": "He/she may choose to render the remaining two hours of work outside the school premises as stated in DO 16, s. 2009."}, {"letter": "C", "text": "He/she can render the remaining two hours of work outside the school premises with 2 hours equivalent to salary deduction per day."}, {"letter": "D", "text": "He/she may choose to render the remaining two hours of work outside the school premises without salary deduction if he/she can submit means of verification."}], "explanation": "Under the NEAP (National Educators Academy of the Philippines) framework, professional development for school heads must be needs-based, evidence-driven, and linked to the PPSSH indicators. LAC sessions, peer learning, and action research are recognized modalities for school-based professional development.", "hasImage": false, "imageIdx": null, "intro": "A Grade 8 MAPEH teacher renders a maximum of six hours of actual classroom teaching per day and leaves the school after work. A newly-hired colleague came to the school head's office and requested an explanation regarding the practice of the said teacher. If you were the school head, what would be your response?"}, {"num": 51, "officialAnswer": "C", "q": "The Department of Education is launching a new program to promote mental health awareness for students. The school principal is tasked with leading the implementation of this program. In the context of the new program, how can a school head use the principles of SBM and their leadership competencies from PPSSH to empower teachers, guided by the PPST, to create a successful and sustainable mental health initiative?", "romanItems": [], "choices": [{"letter": "A", "text": "The school head can use SBM to delegate the entire project to the PTA, as it is a community-based concern."}, {"letter": "B", "text": "The school head can directly instruct all teachers to use the same lesson plan provided by the central office, enforcing the PPST."}, {"letter": "C", "text": "The school head, using competencies from PPSSH, can create a collaborative team under SBM, allowing teachers to use their PPST skills (e.g., Domain 2) to design specific, school-based interventions and activities that address the unique mental health needs of their learners."}, {"letter": "D", "text": "The school head should only focus on administrative tasks and wait for the teachers to independently implement the program based on their understanding of the PPST."}], "explanation": "The PPSSH Domain 1 on School Leadership focuses on the school head's role in setting direction, creating a shared vision, and establishing a positive school culture. All initiatives must be grounded on the school's mission-vision and aligned with DepEd's overall goals for quality education.", "hasImage": false, "imageIdx": null, "intro": "The Department of Education is launching a new program to promote mental health awareness for students. The school principal is tasked with leading the implementation of this program. In the context of the new program, how can a school head use the principles of SBM and their leadership competencies from PPSSH to empower teachers, guided by the PPST, to create a successful and sustainable mental health initiative?"}, {"num": 52, "officialAnswer": "D", "q": "Teacher Jojo is applying for a promotion. He is told by a colleague that he must get a high score on the interview to be considered for the position. According to DepEd Order No. 007, s. 2023, what is a single, primary component used to evaluate a teacher's competence for promotion?", "romanItems": [], "choices": [{"letter": "A", "text": "The number of professional awards received."}, {"letter": "B", "text": "The length of service in the school."}, {"letter": "C", "text": "The number of seminars attended."}, {"letter": "D", "text": "The results of the comparative assessment."}], "explanation": "Under the MOOE utilization guidelines, the school head must strictly follow the approved budget and procurement plan. Any modification in the utilization of MOOE funds must comply with COA rules, DepEd regulations, and the applicable provisions of the Government Procurement Reform Act.", "hasImage": false, "imageIdx": null, "intro": "Teacher Jojo is applying for a promotion. He is told by a colleague that he must get a high score on the interview to be considered for the position. According to DepEd Order No. 007, s. 2023, what is a single, primary component used to evaluate a teacher's competence for promotion?"}, {"num": 53, "officialAnswer": "B", "q": "A teacher is planning a lesson and wants to incorporate a project that requires students to research a local environmental issue and present solutions to the community. Explain how this teacher's lesson plan integrates the principles of School-Based Management (SBM) and the Philippine Professional Standards for Teachers (PPST).", "romanItems": [], "choices": [{"letter": "A", "text": "The lesson plan only aligns with the PPST's focus on curriculum, but not with SBM."}, {"letter": "B", "text": "The lesson plan embodies SBM by involving the community as a learning resource, while also aligning with the PPST's domains on community engagement and curriculum planning."}, {"letter": "C", "text": "The lesson plan is a direct result of SBM, as all lesson plans must be approved by the SGC."}, {"letter": "D", "text": "This lesson plan is not appropriate as it goes beyond the scope of the DepEd curriculum."}], "explanation": "The DepEd Canteen Policy (DO 13, s. 2017) prohibits the sale of unhealthy food and beverages in school canteens. The school head must ensure compliance by regularly monitoring the canteen's menu and enforcing the guidelines on nutritional standards for school food services.", "hasImage": false, "imageIdx": null, "intro": "A teacher is planning a lesson and wants to incorporate a project that requires students to research a local environmental issue and present solutions to the community. Explain how this teacher's lesson plan integrates the principles of School-Based Management (SBM) and the Philippine Professional Standards for Teachers (PPST)."}, {"num": 54, "officialAnswer": "A", "q": "Elsa is a Grade 9 student. She is smart and she loves to sing. However, she has cerebral palsy and uses a wheelchair to move around. Which is the best action that the school head can do to make school life easier for learners like Elsa?", "romanItems": [], "choices": [{"letter": "A", "text": "Set up local support groups for parents with special needs."}, {"letter": "B", "text": "Provide training for teachers and parents of students with special needs."}, {"letter": "C", "text": "Reduce physical barriers by constructing ramps for students with special needs."}, {"letter": "D", "text": "Raise awareness of students’ special needs in the community."}], "explanation": "Under the PPSSH, the school head is expected to demonstrate ethical leadership by upholding integrity, transparency, and accountability in all school transactions. This includes ensuring proper documentation of all financial transactions and reporting any irregularities to appropriate authorities.", "hasImage": false, "imageIdx": null, "intro": "Elsa is a Grade 9 student. She is smart and she loves to sing. However, she has cerebral palsy and uses a wheelchair to move around. Which is the best action that the school head can do to make school life easier for learners like Elsa?"}, {"num": 55, "officialAnswer": "B", "q": "Learning Action Cell (LAC) is comprised of a group of teachers engaging in collaborative learning sessions to solve shared challenges encountered in the school. It is led by the school head or a designated LAC facilitator. What key indicator measures the effectiveness of the LAC? I. Critical reflection among teachers leading to change in classroom practice. II. Sustained relationship between and among colleagues in the department. III. Increased understanding and knowledge of the curriculum. IV. Changes in teachers' pedagogy or practices that are aimed at improving learners' participation and achievement in school. V. Improved teacher quality and career development.", "romanItems": ["I. Critical reflection among teachers leading to change in classroom practice.", "II. Sustained relationship between and among colleagues in the department.", "III. Increased understanding and knowledge of the curriculum.", "IV. Changes in teachers' pedagogy or practices that are aimed at improving learners' participation and achievement in school.", "V. Improved teacher quality and career development."], "choices": [{"letter": "A", "text": "II and V only"}, {"letter": "B", "text": "II and IV only"}, {"letter": "C", "text": "I, III, and IV"}, {"letter": "D", "text": "I, II, and III"}], "explanation": "The LAC (Learning Action Cell) is the school's primary professional development platform under DepEd Order No. 35, s. 2016. The school head facilitates the LAC by identifying learning needs of teachers, securing technical assistance, and ensuring that outputs are applied in classroom practice.", "hasImage": false, "imageIdx": null, "intro": "Learning Action Cell (LAC) is comprised of a group of teachers engaging in collaborative learning sessions to solve shared challenges encountered in the school. It is led by the school head or a designated LAC facilitator. What key indicator measures the effectiveness of the LAC?"}, {"num": 56, "officialAnswer": "D", "q": "DepEd institutionalizes an effective data management system, including Enrollment Data Management, necessary for daily operations. This is integral in planning, resources allocation, policy formulation, and development interventions. Which of the following should be observed in the management of the DepEd Learner Information System?", "romanItems": [], "choices": [{"letter": "A", "text": "The school head should encode the enrolment data on the first and last day of the school year in the LIS under the Quick Count Module."}, {"letter": "B", "text": "The school ICT coordinator should encode the results of the Early Registration in the LIS under the Early Registration Module."}, {"letter": "C", "text": "Only one unique and permanent LRN should be issued to a learner all throughout the entire Basic Education Program."}, {"letter": "D", "text": "All educational institutions offering basic education should ensure that all learners enrolled in the school are registered in the LIS."}], "explanation": "Under the DepEd Inclusive Education policy, school heads must ensure access, equity, and quality education for all learners, including those with special needs. This requires adapting the school environment, providing appropriate instructional materials, and building teachers' capacity in inclusive practices.", "hasImage": false, "imageIdx": null, "intro": "DepEd institutionalizes an effective data management system, including Enrollment Data Management, necessary for daily operations. This is integral in planning, resources allocation, policy formulation, and development interventions. Which of the following should be observed in the management of the DepEd Learner Information System?"}, {"num": 57, "officialAnswer": "D", "q": "The Results-based Performance Management System (RPMS) cycle prescribes that classroom observations be conducted within a school year. Which description of c , V"}, {"letter": "C", "text": "III, IV"}, {"letter": "D", "text": "III, V"}], "explanation": "Under RA 9155, the school head has authority over the use of the school's human, physical, and fiscal resources. However, this authority is exercised within the framework of applicable laws, DepEd policies, and COA regulations to ensure accountability and proper stewardship of public resources.", "hasImage": false, "imageIdx": null, "intro": "To strengthen the Every Child A Reader Program, the Department of Education issued DepEd Memorandum no. 173 s. 2019 known as Hamon: Bawat Bata Bumbasa (3Bs Initiative). What strategies can the school head do to operationalize the department’s initiative fully?"}, {"num": 60, "officialAnswer": "D", "q": "A school head found out that a teacher lacks skills in relating subject matter to the enabling competencies from other disciplines. At times, he/she delivered the lessons with integration but failed to attain the lesson objectives. Which of the following should the school head advise the teacher to improve his/her teaching practice? I. Apply a range of teaching strategies to develop critical and creative thinking. II. Use assessment strategies consistent with curriculum requirements. III. Use differentiated and developmentally appropriate learning experiences. IV. Apply knowledge of content within and across teaching areas.", "romanItems": ["I. Apply a range of teaching strategies to develop critical and creative thinking.", "II. Use assessment strategies consistent with curriculum requirements.", "III. Use differentiated and developmentally appropriate learning experiences.", "IV. Apply knowledge of content within and across teaching areas."], "choices": [{"letter": "A", "text": "I, II, III, and IV"}, {"letter": "B", "text": "II and IV"}, {"letter": "C", "text": "I, III, and IV"}, {"letter": "D", "text": "II, III, and IV"}], "explanation": "The DepEd Anti-Graft and Corruption guidelines require school heads to observe the principle of transparency in all procurement activities. Purchases must go through the proper procurement process in accordance with RA 9184 (Government Procurement Reform Act) regardless of the amount.", "hasImage": false, "imageIdx": null, "intro": "A school head found out that a teacher lacks skills in relating subject matter to the enabling competencies from other disciplines. At times, he/she delivered the lessons with integration but failed to attain the lesson objectives. Which of the following should the school head advise the teacher to improve his/her teaching practice?"}, {"num": 61, "officialAnswer": "B", "q": "A school head wanted to institutionalize the conduct of LAC seminars in the school. Which of the following are the roles and responsibilities that he/she should perform? I. Leads in organizing the LAC in ensuring that the practice of holding a regular seminar is established, maintained, and sustained. II. Supports the school in establishing, maintaining, and sustaining their LAC practices. III. Provides administrative support and academic leadership to the LACs that will strengthen the school's development of professional learning communities. IV. Facilitates and implements LACs within the school.", "romanItems": ["I. Leads in organizing the LAC in ensuring that the practice of holding a regular seminar is established, maintained, and sustained.", "II. Supports the school in establishing, maintaining, and sustaining their LAC practices.", "III. Provides administrative support and academic leadership to the LACs that will strengthen the school's development of professional learning communities.", "IV. Facilitates and implements LACs within the school."], "choices": [{"letter": "A", "text": "I, II, III, and IV"}, {"letter": "B", "text": "I, III, and IV"}, {"letter": "C", "text": "IV only"}, {"letter": "D", "text": "II and III"}], "explanation": "Under the PPSSH Domain 3 on School Management, school heads must ensure that fiscal management complies with legal and policy requirements. Proper liquidation of funds, preparation of financial reports, and compliance with COA auditing standards are key accountability measures.", "hasImage": false, "imageIdx": null, "intro": "A school head wanted to institutionalize the conduct of LAC seminars in the school. Which of the following are the roles and responsibilities that he/she should perform?"}, {"num": 62, "officialAnswer": "C", "q": "Attendance Trends Average daily attendance: SY 2020–2021: 95% SY 2021–2022: 87% SY 2022–2023: 80% What is the best response? I. Investigate causes of decline. II. Implement recognition for perfect attendance. III. Intensify school feeding programs. IV. Suspend chronically absent learners. V. Reduce class hours to improve attendance. VI. Engage parents in awareness programs.", "romanItems": ["I. Investigate causes of decline.", "II. Implement recognition for perfect attendance.", "III. Intensify school feeding programs.", "IV. Suspend chronically absent learners.", "V. Reduce class hours to improve attendance.", "VI. Engage parents in awareness programs."], "choices": [{"letter": "A", "text": "II, III, IV"}, {"letter": "B", "text": "I and III only"}, {"letter": "C", "text": "I, II, III, VI"}, {"letter": "D", "text": "I, II only"}], "explanation": "The DepEd policy on teachers' welfare and benefits requires school heads to advocate for teachers' rights and facilitate access to government benefits. This includes endorsing applications for GSIS loans, step increments, and other entitlements in a timely and efficient manner.", "hasImage": false, "imageIdx": null, "intro": "Attendance Trends Average daily attendance: SY 2020–2021: 95% SY 2021–2022: 87% SY 2022–2023: 80% What is the best response?"}, {"num": 63, "officialAnswer": "D", "q": "The manner by which teachers respond to and act on specific instruction and communication depends largely on the way school heads relay the information to them. How can a school head best ensure that the teachers clearly understand his/her instructions? I. Make the teachers understand what they are expected to do. II. Always use their mother tongue when presenting the instructions/information. III. Discuss the standards of performance expected of them. IV. Present to teachers how much time they are allotted to do the tasks assigned to them. V. Clearly specify the consequence of not following an instruction. VI. Remind teachers that as professionals, they must have the willingness to follow instructions to the letter.", "romanItems": ["I. Make the teachers understand what they are expected to do.", "II. Always use their mother tongue when presenting the instructions/information.", "III. Discuss the standards of performance expected of them.", "IV. Present to teachers how much time they are allotted to do the tasks assigned to them.", "V. Clearly specify the consequence of not following an instruction.", "VI. Remind teachers that as professionals, they must have the willingness to follow instructions to the letter."], "choices": [{"letter": "A", "text": "II, V, VI"}, {"letter": "B", "text": "III, V, VI"}, {"letter": "C", "text": "I, II, III"}, {"letter": "D", "text": "I, III, IV"}], "explanation": "Under the K to 12 curriculum framework, assessment of learning outcomes must be holistic, encompassing cognitive, affective, and psychomotor domains. School heads must ensure that teachers assess learners across all domains as prescribed in the curriculum guides.", "hasImage": false, "imageIdx": null, "intro": "The manner by which teachers respond to and act on specific instruction and communication depends largely on the way school heads relay the information to them. How can a school head best ensure that the teachers clearly understand his/her instructions?"}, {"num": 64, "officialAnswer": "B", "q": "An SBM assessment yields: Leadership & Governance: Developing Curriculum & Instruction: Emerging Accountability & Transparency: Developing Resource Management: Developing What should be th
