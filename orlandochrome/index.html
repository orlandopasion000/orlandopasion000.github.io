<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OrlandoChrome</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrlandoChrome">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="OrlandoChrome · Taskbar Chrome Profile Messenger, AI Cooldown Timers & Wispr Flow Pro Dictation Suite.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="oc-logo.svg">
  <link rel="apple-touch-icon" href="oc-logo.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="netflix-messenger-theme">
  <!-- Top Application Bar -->
  <header class="app-topbar">
    <div class="topbar-left">
      <div class="brand-logo" id="logoBtn" title="OrlandoChrome">
        <img src="oc-logo.svg" class="oc-logo-img" alt="OC Logo">
        <div class="brand-text-wrap">
          <span class="brand-title"><span class="title-orlando">ORLANDO</span><span class="title-chrome">CHROME</span></span>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Jump to Next Pending / Reset Profile (Alt+N) -->
      <button type="button" class="btn-topbar-quick" id="btnNextReady" title="Jump to next profile with Pending Note or Limit Reset (Alt + N)">
        ⚡ Next Ready
      </button>

      <!-- App Distribution, Live QR & Command Suite Trigger (Single Unified Button — No Redundancy) -->
      <button type="button" class="btn-topbar-suite" id="btnOpenAppSuite" title="Open App Distribution, Live QR Scanner &amp; Cross-Device Cloud Sync Suite">
        <span>📲 App Suite</span>
        <span class="pwa-ready-mini-badge"><span class="sync-status-dot synced" id="topbarSyncDot"></span> <span id="topbarSyncLabel">Synced</span></span>
      </button>

      <!-- Live Clock & Daily Recharge Alarm Widget -->
      <div class="nav-clock-box" id="navClockBox">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- Main 2-Pane Messenger Workspace -->
  <div class="app-workspace" id="appWorkspace">
    <!-- Left Column: Search, Filters, and Chrome Profiles -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <div class="search-box-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="profileSearch" class="search-input" placeholder="Search profiles or notes... (Alt+↑/↓)">
        </div>

        <div class="filter-tabs-row">
          <button class="filter-tab active" data-filter="all" id="tabAll">All (<span id="countAll">22</span>)</button>
          <button class="filter-tab" data-filter="pending" id="tabPending"><span class="tab-red-radiant-dot"></span> Pending (<span id="countPending">0</span>)</button>
          <button class="filter-tab" data-filter="timers" id="tabTimers">⏳ Timers (<span id="countTimers">0</span>)</button>
        </div>
      </div>

      <!-- Profiles List -->
      <div class="profile-list" id="profileList">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Draggable Width Resizer Line Between Profiles & Messages -->
    <div class="workspace-resizer" id="workspaceResizer" title="Drag to adjust width · Double-click to reset">
      <span class="resizer-grip" aria-hidden="true">⋮</span>
    </div>

    <!-- Right Column: Active Chrome Profile Notes & Timers -->
    <main class="chat-main" id="chatMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- Hidden Photo Upload Input (Profile Avatar) -->
  <input type="file" id="globalPhotoInput" accept="image/*" style="display:none;">
  <!-- Hidden Screenshot / Media Attachment Input (Chat Notes) -->
  <input type="file" id="noteImageInput" accept="image/*" style="display:none;">
  <!-- Hidden JSON Backup Restore Input -->
  <input type="file" id="backupJsonInput" accept=".json,application/json" style="display:none;">
  <!-- Hidden Chrome Local State / Taskbar Scanner File Input (For Blank Edition Laptop Sync) -->
  <input type="file" id="localStateFileInput" style="display:none;">

  <!-- Toast Notification Container -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="sound.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
