<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Bevel Chamfer Filter for Letters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Radiant Gold Linear Gradients -->
    <linearGradient id="goldGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="20%" stop-color="#FCEBA6" />
      <stop offset="45%" stop-color="#D9B95C" />
      <stop offset="70%" stop-color="#A68326" />
      <stop offset="90%" stop-color="#E5CA79" />
      <stop offset="100%" stop-color="#7A5D12" />
    </linearGradient>

    <linearGradient id="goldGradientBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E4407" />
      <stop offset="35%" stop-color="#A68326" />
      <stop offset="65%" stop-color="#FCEBA6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Squircle Border Gold Rim Gradient -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C2" />
      <stop offset="30%" stop-color="#D9B95C" />
      <stop offset="60%" stop-color="#806119" />
      <stop offset="85%" stop-color="#ECCF7E" />
      <stop offset="100%" stop-color="#D9B95C" />
    </linearGradient>

    <!-- Obsidian Plate Radial Gradient -->
    <radialGradient id="obsidianPlate" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242630" />
      <stop offset="60%" stop-color="#111217" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <!-- Ambient Backlight -->
    <radialGradient id="ambientBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(217, 185, 92, 0.45)" />
      <stop offset="70%" stop-color="rgba(217, 185, 92, 0.15)" />
      <stop offset="100%" stop-color="rgba(217, 185, 92, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Golden Backlight Glow -->
  <rect x="26" y="26" width="460" height="460" rx="130" fill="url(#ambientBacklight)" filter="url(#goldGlow)" />

  <!-- Outer Squircle Metallic Bezel -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="#0C0D11" stroke="url(#rimGold)" stroke-width="6" filter="url(#dropShadow)" />

  <!-- Inner Concentric Obsidian Plate -->
  <rect x="52" y="52" width="408" height="408" rx="100" fill="url(#obsidianPlate)" stroke="rgba(217, 185, 92, 0.3)" stroke-width="1.5" />

  <!-- Subtle Radial Hairline Texture Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(217, 185, 92, 0.12)" stroke-width="1" stroke-dasharray="3, 3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(217, 185, 92, 0.08)" stroke-width="1" />

  <!-- Group for Monogram OT -->
  <g filter="url(#dropShadow)">
    <!-- O RING (Beveled Chiseled Outer & Inner) -->
    <!-- Outer O Ring Bevel Shadow -->
    <path d="M 256 120 C 335 120 396 181 396 260 C 396 339 335 400 256 400 C 177 400 116 339 116 260 C 116 181 177 120 256 120 Z M 256 168 C 205 168 164 209 164 260 C 164 311 205 352 256 352 C 307 352 348 311 348 260 C 348 209 307 168 256 168 Z"
          fill="url(#goldGradientMain)" stroke="url(#goldGradientBevel)" stroke-width="2" />

    <!-- O Chisel Ridge Highlights (3D Facet Crease) -->
    <ellipse cx="256" cy="260" rx="116" ry="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- T CAPITAL SERIF / HOROLOGY LETTER -->
    <!-- T Top Horizontal Crossbar with Serif Flares -->
    <path d="M 148 132 L 364 132 L 360 178 L 334 168 L 278 168 L 278 200 L 234 200 L 234 168 L 178 168 L 152 178 Z"
          fill="url(#goldGradientMain)" stroke="url(#goldGradientBevel)" stroke-width="2" />
    
    <!-- T Vertical Stem Interlocking Through O -->
    <path d="M 236 168 L 276 168 L 276 384 L 308 396 L 308 408 L 204 408 L 204 396 L 236 384 Z"
          fill="url(#goldGradientMain)" stroke="url(#goldGradientBevel)" stroke-width="2" />

    <!-- Center Chiseled Ridge line down stem of T -->
    <line x1="256" y1="134" x2="256" y2="406" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.8" />
    <line x1="150" y1="150" x2="362" y2="150" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />
  </g>

  <!-- Typography: ORLANDO TIMER & LUXURY HOROLOGY -->
  <text x="256" y="440" font-family="'Lexend', 'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="url(#goldGradientMain)" text-anchor="middle">ORLANDO TIMER</text>
  <text x="256" y="456" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="3" fill="rgba(217, 185, 92, 0.75)" text-anchor="middle">24K SWISS GOLD HOROLOGY</text>
</svg>
