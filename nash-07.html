<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASH Mock Test Part 2 — Set 7 of 7 | Crimson Throne</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg-start:#0e0404;--bg-mid:#1a0808;--bg-end:#0c0303;--accent:#c03030;--accent2:#e85050;--accent-glow:rgba(192,48,48,0.30);--card-bg:rgba(26,8,8,0.85);--text-primary:#f8d0d0;--text-secondary:#a06060;--border-glow:rgba(192,48,48,0.4);--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes auroraFloat{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.12;transform:translateY(-20px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.15s!important;transition-duration:.15s!important}}
body{font-family:'DM Sans',sans-serif;color:var(--text-primary);background:linear-gradient(135deg,var(--bg-start),var(--bg-mid),var(--bg-end),var(--bg-start));background-size:400% 400%;animation:bgShift 12s ease-in-out infinite;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,var(--accent-glow),transparent 70%);animation:auroraFloat 8s ease-in-out infinite;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}
.nav{position:sticky;top:0;height:56px;background:rgba(0,0,0,0.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(192,48,48,0.30);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-left{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}.nav-right{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.container{max-width:1080px;margin:0 auto;padding:24px 16px;position:relative;z-index:10}
.card{background:var(--card-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(192,48,48,0.30);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);padding:32px 28px;animation:fadeInUp .5s ease-out;margin-bottom:24px}
.domain-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);background:rgba(192,48,48,0.30);margin-bottom:8px}
.strand-badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);background:rgba(255,255,255,0.05);margin-bottom:16px}
.q-counter{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.q-text{font-size:clamp(20px,2.8vw,24px);font-weight:600;line-height:1.75;margin-bottom:24px}
.q-img{max-width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(192,48,48,0.30)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);border-radius:14px;min-height:64px;padding:18px 22px;cursor:pointer;transition:all .25s ease;width:100%;text-align:left;color:var(--text-primary);font-family:'DM Sans',sans-serif;font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.6}
.choice-btn:hover:not(.locked){border-color:rgba(192,48,48,0.4);background:rgba(192,48,48,0.30);box-shadow:0 0 20px rgba(192,48,48,0.30)}
.choice-btn:hover:not(.locked) .letter{background:rgba(192,48,48,0.4)}
.choice-btn.locked{cursor:default}
.choice-btn.correct{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.50);animation:correctPulse .4s ease}
.choice-btn.correct .letter{background:var(--green);color:#fff}
.choice-btn.wrong{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.50);animation:wrongShake .4s ease}
.choice-btn.wrong .letter{background:var(--red);color:#fff}
.choice-btn.dimmed{opacity:.4}
.letter{width:38px;height:38px;border-radius:10px;background:rgba(192,48,48,0.30);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;transition:all .25s ease}
.choice-text{flex:1;padding-top:4px}
.explanation{animation:fadeInUp .3s ease;background:rgba(0,0,0,0.50);border-left:4px solid var(--accent);border-radius:14px;padding:24px 28px;margin-top:20px;display:none}
.explanation.show{display:block}
.exp-header{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:16px}
.exp-correct{display:inline-block;padding:6px 16px;border-radius:12px;background:rgba(34,197,94,0.15);color:var(--green);font-weight:600;font-size:15px;margin-bottom:16px;line-height:1.5}
.exp-body{font-size:clamp(17px,2.2vw,20px);line-height:1.7;color:var(--text-secondary)}
.exp-body p{margin-bottom:12px}.exp-body .wrong-label{color:var(--red);font-weight:600}
.exp-body .section-title{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.next-btn{display:block;margin:28px auto 0;min-height:60px;min-width:260px;border-radius:16px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 20px var(--accent-glow);font-family:'DM Sans',sans-serif;animation:breathe 3s ease-in-out infinite;transition:all .3s ease;padding:0 32px}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.progress-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.80);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(192,48,48,0.30);padding:12px 24px 14px;z-index:1000}
.progress-stats{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.stat-dot.accent{background:var(--accent)}.stat-dot.green{background:var(--green)}.stat-dot.red{background:var(--red)}
.stat-pct{color:var(--accent);font-weight:700}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .6s cubic-bezier(0.16,1,0.3,1);width:0%}
.results-screen{display:none;text-align:center;padding:40px 20px}.results-screen.show{display:block}
.trophy{font-size:clamp(56px,10vw,80px);animation:bounceIn .6s ease-out}
.score-number{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,14vw,96px);font-weight:700;margin:16px 0}
.score-subtitle{font-size:20px;color:var(--text-secondary);margin-bottom:32px}
.stat-boxes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.stat-box{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px 28px;min-width:120px;border:1px solid rgba(255,255,255,0.08)}
.stat-box.green-tint{border-color:rgba(34,197,94,0.3)}.stat-box.red-tint{border-color:rgba(239,68,68,0.3)}.stat-box.accent-tint{border-color:rgba(192,48,48,0.30)}
.stat-box-num{font-size:32px;font-weight:700}.stat-box-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.perf-pill{display:inline-block;padding:8px 24px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:20px}
.perf-pill.excellent{background:var(--green);color:#fff}.perf-pill.proficient{background:var(--accent);color:#fff}.perf-pill.developing{background:var(--amber);color:#000}.perf-pill.needs-review{background:var(--red);color:#fff}
.motiv-msg{font-size:18px;color:var(--text-secondary);line-height:1.7;max-width:500px;margin:0 auto 32px}
.results-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-outline{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s ease}
.btn-outline:hover{background:rgba(192,48,48,0.30)}
.btn-filled{min-height:56px;padding:0 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px var(--accent-glow);transition:all .3s ease}
.btn-filled:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
.hidden{display:none!important}
.file-nav{position:relative;z-index:10;max-width:1080px;margin:40px auto 0;padding:0 16px 40px;text-align:center}
.file-nav-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.file-nav-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.file-nav-links a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;color:var(--text-secondary);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);transition:all .25s ease}
.file-nav-links a:hover{border-color:rgba(192,48,48,0.4);background:rgba(192,48,48,0.30);color:var(--accent)}
.file-nav-links a.active{background:var(--accent);color:#fff;border-color:var(--accent);pointer-events:none}
@media(max-width:600px){.card{padding:24px 18px;border-radius:16px}.choice-btn{padding:14px 16px;gap:12px}.letter{width:34px;height:34px;font-size:14px}.nav{padding:0 16px}.progress-bar{padding:10px 16px 12px}.explanation{padding:20px 18px}.results-actions{flex-direction:column;align-items:center}}
</style>

const Q=[
{q:"A performing master teacher was installed as a school head who was too focused on instructional leadership but unable to discharge other functions. What should a school head do to ensure the performance of the other functions?",
c:[{t:"Empower the department heads and hone their instructional leadership.",x:0},{t:"Learn the most previous experiences as a master teacher.",x:0},{t:"Undergo mentoring from an experienced colleague in the field.",x:1},{t:"Benchmark best practices of performing schools.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.3 Professional networks",
e:{w:"A school head who is too focused on instructional leadership needs to develop competencies in other areas such as management, operations, and stakeholder relations. Undergoing mentoring from an experienced colleague provides direct, personalized guidance on the full range of school head functions.",
wr:[{l:"A",r:"Empowering department heads addresses delegation but does not build the school head\u2019s own competencies in the other functions."},{l:"B",r:"Learning from past master teacher experiences reinforces the same instructional focus rather than developing new administrative competencies."},{l:"D",r:"Benchmarking provides models and ideas but does not offer the personalized guidance that mentoring provides for developing specific competencies."}]}},

{q:"As part of the performance management of teachers, a school head ensures that appropriate interventions are in place to guarantee high-impact results in employee development. The principle of the 70-20-10 Learning Model is used where 70% of the learning is through experience, 20% through others, and 10% through structural courses and programs. Which of the following is an example of learning and development obtained through experience?",
c:[{t:"Applying the principles of effective writing in preparing reports",x:1},{t:"Participating in Learning Action Cells on a regular basis.",x:0},{t:"Pursuing a master\u2019s degree related to the field of specialization",x:0},{t:"Delegating work to others to relieve one from responsibilities",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The item asks for an example of learning obtained through experience (70%) under the 70-20-10 Learning Model. Applying learned principles while performing an actual task (preparing reports) reflects learning through experience \u2014 learning by doing in a real work context.",
wr:[{l:"B",r:"Participating in LAC is social learning (20% \u2014 learning from others through collaboration), not experiential learning."},{l:"C",r:"Pursuing a master\u2019s degree is formal learning (10% \u2014 structured courses and programs), not experiential."},{l:"D",r:"Delegating work is a management action, not a learning activity. It does not represent learning through experience."}]}},

{q:"A school\u2019s Project Teams reconvened in year two on the School Improvement Plan Implementation to check on learners\u2019 views toward the existing interventions and relevant school processes related to the identified Priority Improvement Areas. In the process of the Project Team\u2019s conduct of Focus Group Discussion with the learners, they expressed their discontent with the half-day schedule of periodic examinations as the time allotted for their academic subjects is not enough, affecting their academic performance. What should the school head do upon learning about the feedback from the Project Team concerned?",
c:[{t:"Assemble all learners and have a dialogue on the existing half-day schedule of periodic examinations for all their academic subjects.",x:0},{t:"Instruct the Project Team concerned to investigate and understand further why the learners are expressing their discontent over the identified problem.",x:1},{t:"Ignore the learners\u2019 feedback, as the practice has existed for a long time.",x:0},{t:"Issue immediately a school policy on a whole day schedule of periodic examinations for all their academic subjects.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.4 Stakeholder engagement",
e:{w:"Before making any decision, the school head should instruct the Project Team to investigate and understand the root cause of the discontent. This evidence-based approach ensures that any subsequent action is informed by a thorough understanding of the problem, not just surface-level complaints.",
wr:[{l:"A",r:"Assembling all learners for a dialogue is premature. The school head should first understand the full scope of the issue through investigation before engaging the entire student body."},{l:"C",r:"Ignoring feedback because a practice has existed for a long time is dismissive and contradicts the SIP\u2019s purpose of continuous improvement based on stakeholder input."},{l:"D",r:"Issuing an immediate policy change is reactive and hasty. Decisions should be based on thorough investigation, not immediate reactions to complaints."}]}},

{q:"The newly assigned school head has observed low community participation and involvement in the school operations. Furthermore, he/she observed the lack of Minutes of Meeting and other documents that reflect the school\u2019s accomplishments and Key Performance Indicators. What mechanisms can the school head do to advocate and communicate to all stakeholders the situation, context, and performance of the school?\n\nI. Provide the stakeholders with the School Report Card at least twice a year.\nII. Disseminate the results of the quarterly program implementation review.\nIII. Present the school status during the year-end \u201CState of the School Address.\u201D\nIV. Allow the stakeholders to conduct monitoring and evaluation of the programs/projects.",
c:[{t:"I and III",x:0},{t:"II, III and IV",x:0},{t:"I, II, III and IV",x:0},{t:"I, II and III",x:1}],
d:"Domain 5 \u2014 Building Connections",s:"5.4 Communication",
e:{w:"Effective communication mechanisms include: (I) Providing the School Report Card at least twice a year, (II) Disseminating quarterly program implementation review results, and (III) Presenting the year-end State of the School Address. These are school-led communication and advocacy tools. Statement IV (allowing stakeholders to conduct M&E) goes beyond communication into governance oversight, which is not the primary mechanism being asked about.",
wr:[{l:"A",r:"While I and III are correct, this misses the quarterly dissemination (II) which provides regular, ongoing communication with stakeholders."},{l:"B",r:"While II and III are correct, statement IV (stakeholder-conducted M&E) is a governance function beyond communication. Also missing the School Report Card (I)."},{l:"C",r:"Statement IV (allowing stakeholders to conduct M&E) goes beyond communication mechanisms. The question asks about advocacy and communication, not monitoring authority."}]}},

{q:"A school head wants to cultivate a culture of research-based innovation in the school. To ensure quality output, he/she conducted an online survey for teachers on their research writing skills development priority. What observation can be made from the given data on teacher research skills?",img:"assets/nash-images/nash-q125.png",
c:[{t:"Teachers are more skillful in literature search and support than theoretical and conceptualization; however, they fare very poorly in publication and utilization.",x:0},{t:"Teachers are aware of the most pressing problems in their class/school; on the other hand, they need to undergo intensive capability building in writing and reporting.",x:1},{t:"Teachers are good enough at looking for related literature that will support their studies but need to develop their data collection and interpretation skills.",x:0},{t:"Teachers can do better in data collection and interpretation but needs further honing of their skills in literature search and support and theoretical conceptualization.",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.2 Professional reflection and learning",
e:{w:"The data shows: Identification and Recognition of Problem has the lowest weighted mean (1.38 = Very Low Priority, meaning teachers are most competent here), while Writing and Reporting has the highest (3.51 = High Priority, meaning it needs the most development). This means teachers can identify problems but struggle most with writing and reporting their research.",
wr:[{l:"A",r:"The data does not show \u201Cvery poor\u201D performance in publication (2.59 = Low Priority). The most critical need is Writing and Reporting (3.51), not publication."},{l:"C",r:"Literature search (2.35) is Low Priority, not a strength. Data collection (1.40) is Very Low Priority, meaning teachers are already competent there."},{l:"D",r:"Data collection (1.40) is already a strength (Very Low Priority = competent). Literature search (2.35) is Low Priority, not the area needing the most attention."}]}},

{q:"A school head organized a Senior High School (SHS) - Learning Action Cell (LAC). The table shows the summary of the SHS teachers\u2019 information across the strands for SY 2020 - 2021. From the given data, what priority area must be addressed by the school head during the LAC Session?",img:"assets/nash-images/nash-q126.png",
c:[{t:"Subjects\u2019 content and competencies",x:1},{t:"Classroom management and assessment",x:0},{t:"Pedagogy and teaching strategies",x:0},{t:"Teaching and learning resources",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"The table shows that while most strands have high percentages of major field graduates (98-100%), the percentage of teachers with education course/certificate is low (30-50%). Combined with the COT-RPMS ratings showing lower scores on Indicator 2 (content delivery), the priority area is Subjects\u2019 content and competencies \u2014 ensuring teachers have deep content knowledge in their assigned subjects.",
wr:[{l:"B",r:"Classroom management and assessment is not the primary concern shown by the data. The low education certificate percentages and content-related COT ratings point to content competency gaps."},{l:"C",r:"While pedagogy is always important, the data specifically highlights content knowledge gaps (education course/certificate percentages), not pedagogical method issues."},{l:"D",r:"Teaching and learning resources are not reflected as the main concern in the data, which focuses on teacher qualifications and content delivery ratings."}]}},

{q:"Aside from the School Improvement Plan (SIP), what other documents are to be submitted to the Schools Division Office for school monitoring and evaluation in promoting learner achievement?\n\nI. Annual Implementation Plan (AIP)\nII. Project Monitoring Report Forms\nIII. School Report Card (SRC)\nIV. School Operating Budget (SOB)",
c:[{t:"II and IV only",x:0},{t:"I, II, and III",x:1},{t:"II, III and IV",x:0},{t:"I and II only",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"The documents submitted to the SDO for monitoring and evaluation include: (I) Annual Implementation Plan \u2014 operationalizes the SIP yearly, (II) Project Monitoring Report Forms \u2014 tracks program implementation, and (III) School Report Card \u2014 communicates school performance to stakeholders. The SOB (IV) is a financial document, not primarily for M&E of learner achievement.",
wr:[{l:"A",r:"While II is correct, SOB (IV) is a budget document, not an M&E tool for learner achievement. Missing AIP (I) and SRC (III)."},{l:"C",r:"While II and III are correct, SOB (IV) is not a monitoring and evaluation document for learner achievement promotion."},{l:"D",r:"While I and II are correct, this misses the School Report Card (III), which is a key document for communicating school performance."}]}},

{q:"What cross-cutting themes comprise the research agenda to improve the culture of research in DepEd and to promote an environment of evidence-based decision-making?\n\nI. Human Resource and Development\nII. Gender and Development\nIII. Governance\nIV. Disaster Risk Reduction and Management\nV. Inclusive Education\nVI. Teaching and Learning",
c:[{t:"II, IV, and V",x:0},{t:"I, III, and VI",x:1},{t:"III, IV, and VI",x:0},{t:"I, II, and III",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.2 Professional reflection and learning",
e:{w:"The cross-cutting themes of the DepEd research agenda are: (I) Human Resource and Development, (III) Governance, and (VI) Teaching and Learning. These three themes cut across all aspects of the education system and form the foundation for evidence-based decision-making.",
wr:[{l:"A",r:"Gender and Development (II), DRRM (IV), and Inclusive Education (V) are important DepEd programs but are not the designated cross-cutting research themes."},{l:"C",r:"While III and VI are correct, DRRM (IV) is a specific program area, not a cross-cutting research theme."},{l:"D",r:"While I and III are correct, Gender and Development (II) is not among the three designated cross-cutting research themes."}]}},

{q:"DepEd sets the guidelines for establishing and implementing RPMS, stipulating the strategies, methods, tools, and rewards for assessing the accomplishments, including the commitments. Which phases of the performance management system cycle should the school head follow for the continuous and consistent work improvement and individual growth of teachers and staff?",
c:[{t:"Planning and commitment; review and evaluation; rewarding and development planning; and monitoring and coaching",x:0},{t:"Planning and commitment; monitoring and coaching; review and evaluation; rewarding and development planning",x:1},{t:"Rewarding and development planning; review and evaluation; monitoring and coaching; and planning and commitment",x:0},{t:"Planning and commitment; monitoring and coaching; rewarding and development planning; and review and evaluation",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.4 Performance management",
e:{w:"The correct RPMS cycle follows this sequence: (1) Planning and commitment \u2014 setting targets and expectations, (2) Monitoring and coaching \u2014 ongoing support during implementation, (3) Review and evaluation \u2014 assessing performance against targets, (4) Rewarding and development planning \u2014 recognizing achievements and planning growth.",
wr:[{l:"A",r:"This places review and evaluation before monitoring and coaching, which reverses the logical sequence. You must monitor first before you can review."},{l:"C",r:"Starting with rewarding is illogical \u2014 you cannot reward before planning, monitoring, or evaluating performance."},{l:"D",r:"This places rewarding before review and evaluation. You must evaluate performance before determining rewards and development plans."}]}},

{q:"Which of the following skills help teachers in the development of lessons that facilitate building a solid foundation of learning throughout life towards achieving holistically-developed Filipino learners?\n\nI. Providing opportunities for decoding and spelling.\nII. Promoting 21st-century skills in MAPEH class only.\nIII. Creating outputs anchored on learning and innovation skills.\nIV. Highlighting logical and mathematical skills across learning areas.\nV. Utilizing lessons that develop information, media and technology skills.\nVI. Empowering learners to make informed decisions to make a significant contribution to society.",
c:[{t:"I, II and IV",x:0},{t:"II, IV and VI",x:0},{t:"I, III and VI",x:0},{t:"III, V and VI",x:1}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"Skills for holistic lifelong learning include: (III) Creating outputs anchored on learning and innovation skills, (V) Utilizing lessons that develop information, media and technology skills, and (VI) Empowering learners to make informed decisions. These reflect 21st-century skills applied across all learning areas.",
wr:[{l:"A",r:"Decoding and spelling (I) are basic literacy skills, not holistic lifelong learning skills. Promoting skills in MAPEH only (II) is too narrow."},{l:"B",r:"Promoting skills in MAPEH only (II) limits 21st-century skills to one subject. Highlighting only logical/mathematical skills (IV) is also too narrow for holistic development."},{l:"C",r:"While III and VI are correct, decoding and spelling (I) is a basic skill, not a holistic lifelong learning competency."}]}},

{q:"Republic Act 9155, also known as the Governance of Basic Education Act of 2001, mandates DepEd to provide learners with the KSA (Knowledge, Skills, and Attitudes) to become caring, self-reliant, productive, and patriotic citizens. In response, DepEd commits to developing holistic Filipino learners, as declared in its vision statement. Which actions best demonstrate a school head\u2019s passionate love for the country?",
c:[{t:"Requires all the students, teachers, and other school personnel to attend the flag-raising ceremony every morning.",x:1},{t:"Uses all the school resources, including financial, human, and materials effectively and efficiently to attain the DepEd vision and goals.",x:0},{t:"Reads national and local laws, regulations, and issuances related to school leadership, management, and operations.",x:0},{t:"Involves teachers, parents, students, and community stakeholders in crafting and implementing the school improvement plan.",x:0}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.1 Vision, mission and core values",
e:{w:"The question specifically asks for an action that demonstrates passionate love for the country. The flag ceremony is a direct institutional practice that cultivates patriotism, respect for national symbols, and national identity among learners and school personnel. Requiring attendance demonstrates the school head\u2019s commitment to patriotic values.",
wr:[{l:"B",r:"Effective resource management demonstrates good stewardship and management skills, not specifically patriotic love for the country."},{l:"C",r:"Reading laws and regulations demonstrates professional diligence and compliance, not passionate love for the country."},{l:"D",r:"Involving stakeholders in SIP demonstrates collaborative leadership, not specifically patriotic sentiment."}]}},

{q:"The new school head of a national high school has a clean-up drive program. He/she decided to dispose of all the old office documents by selling them and using the proceeds to buy office supplies from the nearest store. What conclusions may be drawn from the action of the school head?\n\nI. The school head violated the guidelines on proper record disposal of public documents.\nII. The school head showed competence in generating resources for the school.\nIII. The school head disobeyed the procurement guideline on using the amount generated from the disposal.\nIV. The school head exemplified high competence in proper waste segregation in school.",
c:[{t:"I and III",x:1},{t:"II, III, and IV",x:0},{t:"I, III, and IV",x:0},{t:"II and IV",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.1 Records management",
e:{w:"The school head committed two violations: (I) Violated record disposal guidelines \u2014 public documents cannot be simply sold without following proper disposal procedures; (III) Disobeyed procurement guidelines \u2014 proceeds from disposal must follow proper government financial procedures, not be used for direct purchase from stores.",
wr:[{l:"B",r:"The school head did NOT show competence (II) \u2014 selling records improperly and bypassing procurement are violations, not competent resource generation."},{l:"C",r:"While I and III are correct, the school head did NOT exemplify proper waste segregation (IV) \u2014 disposing of documents by selling them is not proper waste management."},{l:"D",r:"Neither II nor IV is correct. The actions described are violations, not demonstrations of competence or proper waste management."}]}},

{q:"There were reports that the learners undergoing Online Distance Learning (ODL) modality are experiencing difficulty in attending online classes and submitting outputs. It was found out that most of the learners chose the ODL modality despite their lack of learning devices and internet connectivity.\n\nAs a school head, what is the most effective way of addressing the issue?",
c:[{t:"Change their modality immediately from online to either printed or digital modular distance learning.",x:0},{t:"Look for possible sponsors or donors for learning devices.",x:0},{t:"Discuss the issue and conduct another survey among parents of the learners concerned to determine their preference.",x:1},{t:"Review the MLESF submitted and inform parents that they cannot shift from one modality to another.",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.1 School-based review, contextualization and implementation of learning standards",
e:{w:"The most effective approach is to discuss the issue with parents and conduct another survey to determine their informed preference. This respects parental choice while ensuring they understand the implications of their modality selection. The original choice may have been made without full understanding of requirements.",
wr:[{l:"A",r:"Immediately changing modality without consulting parents overrides their right to participate in decisions about their children\u2019s education."},{l:"B",r:"Looking for sponsors addresses the resource gap but is a long-term solution that does not address the immediate learning continuity issue."},{l:"D",r:"Telling parents they cannot shift is rigid and does not address the root problem. DepEd guidelines allow for modality adjustments based on learner needs."}]}},

{q:"The Division Disaster Risk Reduction Management Coordinator monitored an elementary school on Comprehensive School Health, Safety, and Preparedness. The rating scale and a part of the checklist are given. Which actions must be prioritized by the school head based on the results of the monitoring?",
c:[{t:"Place one or two fire extinguishers in every room; transfer heavy objects found on top of the cabinets; and, remove dead tree branches.",x:0},{t:"Request funds from the LGU for the installation of a wet standpipe system in the school; rope off the construction area; put up additional signage; and, attach cabinets firmly to the walls.",x:0},{t:"Conduct school watching and hazard mapping to identify safety hazards in the school; post safety measures in laboratories; and, put away obstacles in the corridor.",x:0},{t:"Put dilapidated buildings off-limits; check the school\u2019s electrical and water facility; and, post evacuation plans in every classroom.",x:1}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.3 School facilities and equipment",
e:{w:"The priority actions address the most critical safety concerns: putting dilapidated buildings off-limits prevents immediate danger to occupants, checking electrical and water facilities addresses infrastructure safety, and posting evacuation plans ensures preparedness. These are the highest-priority items from a comprehensive safety assessment.",
wr:[{l:"A",r:"While fire extinguishers and removing hazards are important, they are secondary to addressing structural dangers from dilapidated buildings and ensuring basic infrastructure safety."},{l:"B",r:"Requesting LGU funds for a standpipe system is a long-term project, not an immediate priority. The most urgent actions should be implementable right away."},{l:"C",r:"School watching and hazard mapping are assessment activities, not immediate corrective actions. Posting lab safety measures and clearing corridors are lower-priority items."}]}},

{q:"One of the activities that a school head includes in the Individual Work Plan is checking the Teachers\u2019 Daily Lesson Plan. Upon reviewing the plan, he/she examined further reflections of the teachers. Which among the teachers\u2019 reflections can be a basis for him/her to provide technical assistance?",
c:[{t:"Difficulties enumerated by the teachers",x:1},{t:"Effectiveness of the delivery of instruction",x:0},{t:"Teaching strategies on methods that worked well and why",x:0},{t:"Number of learners who earned 80% and above in the evaluation",x:0}],
d:"Domain 3 \u2014 Focusing on Teaching and Learning",s:"3.2 Teaching standards and pedagogy",
e:{w:"The difficulties enumerated by teachers in their reflections directly identify areas where they need support. These difficulties serve as the basis for targeted technical assistance because they reveal specific challenges the school head can address through coaching, mentoring, or professional development.",
wr:[{l:"B",r:"Effectiveness of instruction is a positive reflection that shows what works. Technical assistance is needed where there are difficulties, not where instruction is already effective."},{l:"C",r:"Strategies that worked well are strengths, not areas needing technical assistance. The school head should focus on what teachers find challenging."},{l:"D",r:"The number of learners meeting the standard is an outcome measure. While useful for monitoring, it does not directly indicate where the teacher needs technical assistance."}]}},

{q:"The city mayor called the attention of the school due to a fraternity war that happened on the school campus. The school was advised to coordinate with City Social Service and Welfare Office to address the problem. What intervention program should be implemented by the school head in accordance with RA 9344 as amended by RA 10630, \u201CAn Act establishing a comprehensive Justice and Welfare System?\u201D",
c:[{t:"Prevention",x:0},{t:"Conversion",x:0},{t:"Digression",x:0},{t:"Diversion",x:1}],
d:"Domain 5 \u2014 Building Connections",s:"5.3 Inclusive practice",
e:{w:"According to Republic Act No. 9344, as amended by RA 10630 (Juvenile Justice and Welfare Act), the appropriate action for a child who has committed a crime is a diversion program. Diversion is an alternative to formal criminal proceedings that aims to rehabilitate and reintegrate a Child in Conflict with the Law (CICL) into the community without resorting to formal court trial.",
wr:[{l:"A",r:"Prevention programs are proactive measures taken before incidents occur. Since a fraternity war has already happened, the response should be rehabilitative, not preventive."},{l:"B",r:"Conversion is not a term used in RA 9344 or its amendments for juvenile justice interventions."},{l:"C",r:"Digression is not a recognized intervention under the Juvenile Justice and Welfare Act. The correct term for alternative proceedings is diversion."}]}},

{q:"A school head is accountable for the school\u2019s learning outcomes. Who among the following school heads will most likely succeed in meeting the objectives of the School Learning Action Cell (SLAC)?",
c:[{t:"School head A prioritizes learning cells over an administrative meeting over SLAC",x:0},{t:"School head B utilizes teachers\u2019 needs assessment to determine the content of SLAC sessions",x:1},{t:"School head C uses SLAC sessions to promote business opportunities",x:0},{t:"School head D provides human and material resources before the implementation of the sessions",x:0}],
d:"Domain 4 \u2014 Developing Self and Others",s:"4.5 Professional development of staff",
e:{w:"Effective SLAC implementation begins with identifying teachers\u2019 professional learning needs. Using a needs assessment ensures that SLAC sessions address actual teaching challenges, professional development is relevant and targeted, and learning outcomes are more likely to improve.",
wr:[{l:"A",r:"Prioritizing learning cells over SLAC suggests fragmented implementation rather than systematic use of SLAC as the primary professional development platform."},{l:"C",r:"Using SLAC to promote business opportunities is a misuse of the professional development platform and violates its intended purpose."},{l:"D",r:"Providing resources is important but is a logistical preparation, not the content-determining factor. Without needs assessment, resources may not align with actual needs."}]}},

{q:"Which of the following sets of qualifications may the school head consider in designating a learning area coordinator?",
c:[{t:"Outstanding accomplishment, training, education, potential, affiliations, recommendation, and personality traits",x:0},{t:"Experience, outstanding accomplishment, education, training, potential, personality traits, and affiliations",x:1},{t:"Performance, experience, outstanding accomplishment, training, potential, and personality traits",x:0},{t:"Experience, accomplishments, education, training, affiliations, personal preferences, and recommendation",x:0}],
d:"Domain 2 \u2014 Managing School Operations and Resources",s:"2.4 Management of staff",
e:{w:"The correct set of qualifications for designating a learning area coordinator includes: Experience, outstanding accomplishment, education, training, potential, personality traits, and affiliations. This comprehensive set covers professional background, academic qualifications, and personal attributes relevant to the coordinatorship role.",
wr:[{l:"A",r:"This set includes \u201Crecommendation\u201D but omits \u201Cexperience,\u201D which is a fundamental qualification for a coordinator role."},{l:"C",r:"This set includes \u201Cperformance\u201D instead of \u201Ceducation\u201D and \u201Caffiliations,\u201D missing key academic and professional network qualifications."},{l:"D",r:"This set includes \u201Cpersonal preferences\u201D and \u201Crecommendation\u201D instead of \u201Cpotential\u201D and \u201Cpersonality traits,\u201D which are more objective criteria."}]}},

{q:"A school head met and discussed with the members of the School-Community Planning Team (SPT) and talked about incorporating DepEd\u2019s vision in their long-term plan, which is to focus on providing a learner-centered environment to produce learners who are holistically developed, competent, and responsible members of society. How should the school head encourage the members of SPT in realizing this vision of DepEd?",
c:[{t:"The school head should convey that as a school manager, he/she should manage the discussion and ensure that every SPT member shall share his/her view.",x:0},{t:"The school head should serve as the expert and demonstrate the skills of a coach by mentoring the members of the SPT to convince the SPT members.",x:0},{t:"The school head should listen to the opinion of the SPT members and decide what is best for the school based on his/her experience and expertise.",x:0},{t:"The school head ensures that as a leader, he/she considers the views of the SPT members and formulates plans collectively in attaining the desired goals.",x:1}],
d:"Domain 1 \u2014 Leading Strategically",s:"1.1 Vision, mission and core values",
e:{w:"The School Planning Team (SPT) is designed to promote shared governance and collaborative planning. DepEd leadership frameworks emphasize inclusive decision-making and collective ownership of school improvement plans. Option D integrates participation and goal attainment, reflecting higher-order relational thinking \u2014 the school head leads by considering all views and formulating plans collectively.",
wr:[{l:"A",r:"Managing the discussion and ensuring everyone shares views is facilitative but does not go far enough \u2014 it positions the school head as a manager rather than a collaborative leader."},{l:"B",r:"Serving as expert and coach implies a top-down approach where the school head convinces rather than collaborates. This does not reflect shared governance."},{l:"C",r:"Listening but then deciding alone based on personal experience and expertise contradicts the principle of collective planning and shared governance that the SPT embodies."}]}
}
];
const L=['A','B','C','D'];
let cur=0,cor=0,wrn=0,ans=false;
function render(){
if(cur>=Q.length){showResults();return;}
const q=Q[cur];
document.getElementById('pCur').textContent=cur+1;
document.getElementById('pFill').style.width=(cur/Q.length*100)+'%';
let stem=q.q.replace(/\n/g,'<br>');
let imgHtml=q.img?'<img class="q-img" src="'+q.img+'" alt="Question reference image">':'';
if(q.img==='IMG125') imgHtml='<img class="q-img" src="'+IMG125+'" alt="Data Table">';
if(q.img==='IMG126') imgHtml='<img class="q-img" src="'+IMG126+'" alt="Data Table">';

let h='<div class="card"><div class="domain-badge">'+q.d+'</div><br><div class="strand-badge">'+q.s+'</div><div class="q-counter">Question '+(cur+1)+' of '+Q.length+'</div><div class="q-text">'+stem+'</div>'+imgHtml+'<div class="choices" id="ch">';
q.c.forEach(function(c,i){h+='<button class="choice-btn" onclick="pick('+i+')" id="cb'+i+'"><span class="letter">'+L[i]+'</span><span class="choice-text">'+c.t+'</span></button>';});
h+='</div><div class="explanation" id="ep"></div><button class="next-btn hidden" id="nb" onclick="nxt()">'+(cur<Q.length-1?'Next Question \u2192':'See Results \ud83c\udfc6')+'</button></div>';
document.getElementById('quizArea').innerHTML=h;
ans=false;window.scrollTo({top:0,behavior:'smooth'});
}
function pick(i){
if(ans)return;ans=true;const q=Q[cur];
document.querySelectorAll('.choice-btn').forEach(function(b,j){b.classList.add('locked');if(q.c[j].x)b.classList.add('correct');else if(j===i)b.classList.add('wrong');else b.classList.add('dimmed');});
if(q.c[i].x)cor++;else wrn++;
document.getElementById('pCor').textContent=cor;document.getElementById('pWrn').textContent=wrn;
var tot=cor+wrn;document.getElementById('pPct').textContent=tot?Math.round(cor/tot*100):0;
var ci=q.c.findIndex(function(c){return c.x;});
var eh='<div class="exp-header">\ud83d\udca1 EXPLANATION</div><div class="exp-correct">\u2713 Correct Answer: '+L[ci]+' \u2014 '+q.c[ci].t+'</div><div class="exp-body"><div class="section-title">Why This Is Correct</div><p>'+q.e.w+'</p><div class="section-title">Why the Others Are Incorrect</div>';
q.e.wr.forEach(function(w){eh+='<p><span class="wrong-label">'+w.l+'.</span> '+w.r+'</p>';});
eh+='</div>';
var ep=document.getElementById('ep');ep.innerHTML=eh;ep.classList.add('show');
document.getElementById('nb').classList.remove('hidden');
setTimeout(function(){var nb=document.getElementById('nb');nb.scrollIntoView({behavior:'smooth',block:'center'});},350);
}
function nxt(){cur++;render();}
function showResults(){
document.getElementById('quizArea').classList.add('hidden');document.getElementById('pFill').style.width='100%';
var p=Math.round(cor/Q.length*100);var band,bc,em,msg;
if(p>=90){band='\ud83c\udf1f Excellent';bc='excellent';em='\ud83c\udfc6';msg='You have completed all 139 questions. Outstanding performance! You demonstrate mastery of school leadership competencies. Keep shining, future school head!';}
else if(p>=75){band='\u2705 Proficient';bc='proficient';em='\ud83c\udfaf';msg="You have completed all 139 questions. Great job! You show a strong grasp of PPSSH domains. Review the items you missed and you will be fully ready for the NASH.";}
else if(p>=60){band='\ud83d\udcc8 Developing';bc='developing';em='\ud83d\udcda';msg="You have completed all 139 questions. You are making good progress! Focus on the domains where you struggled and revisit the key DepEd issuances.";}
else{band='\ud83d\udd04 Needs Review';bc='needs-review';em='\ud83d\udcaa';msg="You have completed all 139 questions. Do not give up! Revisit the PPSSH domains and key DepEd policies. Every review session brings you closer to passing the NASH.";}
var r=document.getElementById('resultsArea');
r.innerHTML='<div class="trophy">'+em+'</div><div class="score-number" style="color:'+(p>=75?'var(--green)':p>=60?'var(--amber)':'var(--red)')+'" id="sn">0%</div><div class="score-subtitle">'+cor+' out of '+Q.length+' correct</div><div class="stat-boxes"><div class="stat-box green-tint"><div class="stat-box-num" style="color:var(--green)">'+cor+'</div><div class="stat-box-label">Correct</div></div><div class="stat-box red-tint"><div class="stat-box-num" style="color:var(--red)">'+wrn+'</div><div class="stat-box-label">Wrong</div></div><div class="stat-box accent-tint"><div class="stat-box-num" style="color:var(--accent)">'+p+'%</div><div class="stat-box-label">Score</div></div></div><div class="perf-pill '+bc+'">'+band+'</div><div class="motiv-msg">'+msg+'</div><div class="results-actions"><button class="btn-outline" onclick="restart()">\u21ba Restart This Set</button><button class="btn-filled" onclick="window.location.href=\'nash-01.html\'">\ud83c\udfe0 Back to Set 1</button></div>';
r.classList.add('show');
var c=0,el=document.getElementById('sn');var iv=setInterval(function(){c++;el.textContent=c+'%';if(c>=p)clearInterval(iv);},20);launchP();
}
function restart(){cur=0;cor=0;wrn=0;ans=false;document.getElementById('pCor').textContent=0;document.getElementById('pWrn').textContent=0;document.getElementById('pPct').textContent=0;document.getElementById('pFill').style.width='0%';var r=document.getElementById('resultsArea');r.classList.remove('show');r.innerHTML='';document.getElementById('quizArea').classList.remove('hidden');render();}
function launchP(){var cv=document.getElementById('particleCanvas');cv.style.display='block';var cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var ps=[];for(var i=0;i<60;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*4+2,a:1,d:Math.random()*.02+.005});(function anim(){cx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=p.d;if(p.a>0){alive=true;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(192,48,48,'+p.a+')';cx.fill();}});if(alive)requestAnimationFrame(anim);else{cv.style.display='none';cx.clearRect(0,0,cv.width,cv.height);}})();}
render();
</script>
